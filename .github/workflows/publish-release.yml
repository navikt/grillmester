name: Publish reviewed release request

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-request.json"

concurrency:
  group: publish-grillmester-marketplace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      before-sha: ${{ steps.contract.outputs.before_sha }}
      bundle-artifact-digest: ${{ steps.bundle-upload.outputs.artifact-digest }}
      bundle-artifact-id: ${{ steps.bundle-upload.outputs.artifact-id }}
      bundle-artifact-name: ${{ steps.bundle.outputs.bundle_artifact_name }}
      bundle-checksum-name: ${{ steps.bundle.outputs.bundle_checksum_name }}
      bundle-name: ${{ steps.bundle.outputs.bundle_name }}
      bundle-sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
      bundle-size: ${{ steps.bundle.outputs.bundle_size }}
      catalog-sha: ${{ steps.contract.outputs.catalog_sha }}
      channel: ${{ steps.contract.outputs.channel }}
      main-sha: ${{ steps.contract.outputs.main_sha }}
      notes-base64: ${{ steps.contract.outputs.notes_base64 }}
      notes-sha256: ${{ steps.contract.outputs.notes_sha256 }}
      rc-catalog-sha: ${{ steps.contract.outputs.rc_catalog_sha }}
      rc-bundle-checksum-name: ${{ steps.contract.outputs.rc_bundle_checksum_name }}
      rc-bundle-checksum-sha256: ${{ steps.contract.outputs.rc_bundle_checksum_sha256 }}
      rc-bundle-name: ${{ steps.contract.outputs.rc_bundle_name }}
      rc-bundle-sha256: ${{ steps.contract.outputs.rc_bundle_sha256 }}
      rc-formula-sha256: ${{ steps.contract.outputs.rc_formula_sha256 }}
      rc-source-sha: ${{ steps.contract.outputs.rc_source_sha }}
      rc-tag: ${{ steps.contract.outputs.rc_tag }}
      request-id: ${{ steps.contract.outputs.request_id }}
      source-sha: ${{ steps.contract.outputs.source_sha }}
      tag: ${{ steps.contract.outputs.tag }}
      formula-name: ${{ steps.bundle.outputs.formula_name }}
      formula-sha256: ${{ steps.bundle.outputs.formula_sha256 }}
      formula-size: ${{ steps.bundle.outputs.formula_size }}
    steps:
      - name: Check out reviewed request and trusted tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate request and immutable chain
        id: contract
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          request=".github/release-request.json"
          [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ && \
             "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] || {
            echo "The release request needs a nonzero push before SHA." >&2
            exit 1
          }
          jq -e '
            type == "object" and
            (keys | sort) == ["catalogSha", "channel", "rcTag", "requestId", "schemaVersion"] and
            .schemaVersion == 1 and
            (.requestId | type == "string" and test("^[a-z0-9][a-z0-9._-]{0,63}$")) and
            (.channel == "rc" or .channel == "stable") and
            (.catalogSha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.rcTag | type == "string") and
            (if .channel == "rc" then .rcTag == ""
             else (.rcTag | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)-[0-9A-Za-z.-]+$"))
             end)
          ' "${request}" >/dev/null
          channel="$(jq -er '.channel' "${request}")"
          catalog_sha="$(jq -er '.catalogSha' "${request}")"
          rc_tag="$(jq -er '.rcTag' "${request}")"
          request_id="$(jq -er '.requestId' "${request}")"

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/marketplace:refs/remotes/origin/marketplace"
          [[ "${MAIN_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]] || {
            echo "Release request is not current origin/main." >&2
            exit 1
          }
          git cat-file -e "${BEFORE_SHA}^{commit}"
          git merge-base --is-ancestor "${BEFORE_SHA}" "${MAIN_SHA}" || {
            echo "The push before SHA must be an ancestor of current main." >&2
            exit 1
          }
          [[ "$(git diff --name-only "${BEFORE_SHA}" "${MAIN_SHA}")" == ".github/release-request.json" ]] || {
            echo "The complete push must change only .github/release-request.json." >&2
            exit 1
          }
          git cat-file -e "${catalog_sha}^{commit}"
          git merge-base --is-ancestor \
            "${catalog_sha}" refs/remotes/origin/marketplace || {
            echo "Requested catalog is not reachable from origin/marketplace." >&2
            exit 1
          }

          catalog_repo="${RUNNER_TEMP}/catalog"
          source_repo="${RUNNER_TEMP}/source"
          git worktree add --detach "${catalog_repo}" "${catalog_sha}"
          catalog="${catalog_repo}/.github/plugin/marketplace.json"
          source_sha="$(jq -er '
            .metadata.version as $version |
            .plugins[0].source.sha as $sha |
            if
              (.plugins | length) == 1 and
              [.plugins[].name] == ["grillmester"] and
              [.plugins[].version] == [$version] and
              .plugins[0].source == {
                source: "github", repo: "navikt/grillmester",
                path: "plugin", sha: $sha
              }
            then $sha
            else error("catalog must contain the exact one-package release roster")
            end
          ' "${catalog}")"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor \
            "${source_sha}" refs/remotes/origin/main || {
            echo "Requested source is not reachable from origin/main." >&2
            exit 1
          }
          git worktree add --detach "${source_repo}" "${source_sha}"

          contract_args=(
            validate
            --catalog "${catalog}"
            --channel "${channel}"
            --catalog-repo "${catalog_repo}"
            --catalog-sha "${catalog_sha}"
            --source-repo "${source_repo}"
          )
          rc_catalog_sha=""
          rc_bundle_checksum_name=""
          rc_bundle_checksum_sha256=""
          rc_bundle_name=""
          rc_bundle_sha256=""
          rc_formula_sha256=""
          rc_source_sha=""
          if [[ "${channel}" == "stable" ]]; then
            git fetch --no-tags origin "refs/tags/${rc_tag}:refs/tags/${rc_tag}"
            [[ "$(git cat-file -t "refs/tags/${rc_tag}")" == "tag" ]]
            rc_catalog_sha="$(git rev-parse "refs/tags/${rc_tag}^{}")"
            git merge-base --is-ancestor \
              "${rc_catalog_sha}" refs/remotes/origin/marketplace
            rc_catalog_repo="${RUNNER_TEMP}/rc-catalog"
            git worktree add --detach "${rc_catalog_repo}" "${rc_catalog_sha}"
            rc_catalog="${rc_catalog_repo}/.github/plugin/marketplace.json"
            rc_values="${RUNNER_TEMP}/rc-values"
            python3 scripts/release_contract.py inspect \
              --catalog "${rc_catalog}" --channel rc \
              --github-output "${rc_values}"
            [[ "${rc_tag}" == "$(sed -n 's/^tag=//p' "${rc_values}")" ]]
            rc_source_sha="$(sed -n 's/^source_sha=//p' "${rc_values}")"
            git cat-file -e "${rc_source_sha}^{commit}"
            git merge-base --is-ancestor \
              "${rc_source_sha}" refs/remotes/origin/main
            rc_source_repo="${RUNNER_TEMP}/rc-source"
            git worktree add --detach "${rc_source_repo}" "${rc_source_sha}"
            contract_args+=(
              --rc-tag "${rc_tag}"
              --rc-catalog "${rc_catalog}"
              --rc-catalog-repo "${rc_catalog_repo}"
              --rc-catalog-sha "${rc_catalog_sha}"
              --rc-source-repo "${rc_source_repo}"
            )
            # Complete the workflow-owned, read-only contract before executing
            # the selected RC source's bundle builder.
            python3 scripts/release_contract.py "${contract_args[@]}"
            rc_release="$(curl --config /dev/null --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${rc_tag}")"
            [[ "$(jq -r '.tag_name' <<<"${rc_release}")" == "${rc_tag}" ]]
            [[ "$(jq -r '.draft' <<<"${rc_release}")" == "false" ]]
            [[ "$(jq -r '.prerelease' <<<"${rc_release}")" == "true" ]]
            [[ "$(jq -r '.immutable' <<<"${rc_release}")" == "true" ]]
            rc_bundle_name="grillmester-opencode-${rc_tag}.tar.gz"
            rc_bundle_checksum_name="${rc_bundle_name}.sha256"
            rc_formula_name="grillmester.rb"
            jq -e \
              --arg bundle "${rc_bundle_name}" \
              --arg checksum "${rc_bundle_checksum_name}" \
              --arg formula "${rc_formula_name}" \
              '(.assets | length) == 3 and
               ([.assets[].name] | sort) == ([$bundle, $checksum, $formula] | sort) and
               all(.assets[];
                 .state == "uploaded" and
                 (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                 (.browser_download_url | type == "string" and
                   startswith("https://github.com/"))) and
               any(.assets[];
                 .name == $bundle and .label == "Grillmester OpenCode bundle") and
               any(.assets[];
                 .name == $checksum and .label == "SHA-256 checksum") and
               any(.assets[];
                 .name == $formula and .label == "Homebrew formula")' \
              <<<"${rc_release}" >/dev/null

            rc_assets="${RUNNER_TEMP}/rc-assets"
            mkdir -p "${rc_assets}"
            rc_published_bundle="${rc_assets}/${rc_bundle_name}"
            rc_published_checksum="${rc_assets}/${rc_bundle_checksum_name}"
            rc_published_formula="${rc_assets}/${rc_formula_name}"
            rc_bundle_url="$(jq -er --arg name "${rc_bundle_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${rc_release}")"
            rc_checksum_url="$(jq -er --arg name "${rc_bundle_checksum_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${rc_release}")"
            rc_formula_url="$(jq -er --arg name "${rc_formula_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${rc_release}")"
            curl --config /dev/null --fail-with-body --silent --show-error --location \
              --proto '=https' --tlsv1.2 --proto-redir '=https' \
              --max-filesize 61000000 \
              "${rc_bundle_url}" --output "${rc_published_bundle}"
            curl --config /dev/null --fail-with-body --silent --show-error --location \
              --proto '=https' --tlsv1.2 --proto-redir '=https' \
              --max-filesize 1024 \
              "${rc_checksum_url}" --output "${rc_published_checksum}"
            curl --config /dev/null --fail-with-body --silent --show-error --location \
              --proto '=https' --tlsv1.2 --proto-redir '=https' \
              --max-filesize 100000 \
              "${rc_formula_url}" --output "${rc_published_formula}"

            rc_rebuilt_bundle="${RUNNER_TEMP}/rebuilt-${rc_bundle_name}"
            python3 "${rc_source_repo}/scripts/build_opencode_bundle.py" \
              --source-root "${rc_source_repo}" --source-sha "${rc_source_sha}" \
              --output "${rc_rebuilt_bundle}"
            cmp -s "${rc_rebuilt_bundle}" "${rc_published_bundle}"
            rc_bundle_sha256="$(sha256sum "${rc_published_bundle}" | cut -d' ' -f1)"
            rc_bundle_checksum_sha256="$(sha256sum "${rc_published_checksum}" | cut -d' ' -f1)"
            rc_formula_sha256="$(sha256sum "${rc_published_formula}" | cut -d' ' -f1)"
            [[ "$(jq -er --arg name "${rc_bundle_name}" \
              '.assets[] | select(.name == $name) | .digest' <<<"${rc_release}")" == \
              "sha256:${rc_bundle_sha256}" ]]
            [[ "$(jq -er --arg name "${rc_bundle_checksum_name}" \
              '.assets[] | select(.name == $name) | .digest' <<<"${rc_release}")" == \
              "sha256:${rc_bundle_checksum_sha256}" ]]
            [[ "$(jq -er --arg name "${rc_formula_name}" \
              '.assets[] | select(.name == $name) | .digest' <<<"${rc_release}")" == \
              "sha256:${rc_formula_sha256}" ]]
            rc_expected_checksum="${RUNNER_TEMP}/expected-${rc_bundle_checksum_name}"
            printf '%s  %s\n' \
              "${rc_bundle_sha256}" "${rc_bundle_name}" > "${rc_expected_checksum}"
            cmp -s "${rc_expected_checksum}" "${rc_published_checksum}"
            (cd "${rc_assets}" && \
              sha256sum --check --strict "${rc_bundle_checksum_name}")
            rc_expected_formula="${RUNNER_TEMP}/expected-rc-grillmester.rb"
            python3 "${rc_source_repo}/scripts/generate_homebrew_formula.py" \
              --tag "${rc_tag}" --bundle-name "${rc_bundle_name}" \
              --bundle-sha256 "${rc_bundle_sha256}" \
              --client-artifacts "${rc_source_repo}/policy/client-artifacts.json" \
              --output "${rc_expected_formula}"
            ruby -c "${rc_expected_formula}"
            cmp -s "${rc_expected_formula}" "${rc_published_formula}"
          else
            python3 scripts/release_contract.py "${contract_args[@]}"
          fi

          values="${RUNNER_TEMP}/values"
          python3 scripts/release_contract.py inspect \
            --catalog "${catalog}" --channel "${channel}" \
            --github-output "${values}"
          tag="$(sed -n 's/^tag=//p' "${values}")"
          [[ "${source_sha}" == "$(sed -n 's/^source_sha=//p' "${values}")" ]]

          notes="${RUNNER_TEMP}/release-notes.md"
          notes_args=(
            notes --channel "${channel}" --tag "${tag}"
            --catalog-sha "${catalog_sha}" --source-sha "${source_sha}"
            --output "${notes}"
          )
          [[ -z "${rc_tag}" ]] || notes_args+=(--rc-tag "${rc_tag}")
          python3 scripts/release_contract.py "${notes_args[@]}"

          {
            echo "before_sha=${BEFORE_SHA}"
            echo "catalog_sha=${catalog_sha}"
            echo "channel=${channel}"
            echo "main_sha=${MAIN_SHA}"
            echo "notes_base64=$(base64 -w0 "${notes}")"
            echo "notes_sha256=$(sha256sum "${notes}" | cut -d' ' -f1)"
            echo "rc_catalog_sha=${rc_catalog_sha}"
            echo "rc_bundle_checksum_name=${rc_bundle_checksum_name}"
            echo "rc_bundle_checksum_sha256=${rc_bundle_checksum_sha256}"
            echo "rc_bundle_name=${rc_bundle_name}"
            echo "rc_bundle_sha256=${rc_bundle_sha256}"
            echo "rc_formula_sha256=${rc_formula_sha256}"
            echo "rc_source_sha=${rc_source_sha}"
            echo "rc_tag=${rc_tag}"
            echo "request_id=${request_id}"
            echo "source_sha=${source_sha}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "CATALOG_PATH=${catalog}"
            echo "SOURCE_ROOT=${source_repo}"
            echo "SOURCE_SHA=${source_sha}"
            echo "TAG=${tag}"
          } >> "${GITHUB_ENV}"

      - name: Build and seal deterministic terminal release assets
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TAG}" =~ ^v[0-9A-Za-z.-]+$ ]]
          bundle_name="grillmester-opencode-${TAG}.tar.gz"
          bundle_checksum_name="${bundle_name}.sha256"
          bundle_artifact_name="sealed-${bundle_name}-${SOURCE_SHA}"
          bundle="${RUNNER_TEMP}/${bundle_name}"
          repeated="${RUNNER_TEMP}/repeated-${bundle_name}"
          checksum="${RUNNER_TEMP}/${bundle_checksum_name}"
          formula="${RUNNER_TEMP}/grillmester.rb"
          formula_name="grillmester.rb"
          python3 "${SOURCE_ROOT}/scripts/build_opencode_bundle.py" \
            --source-root "${SOURCE_ROOT}" --source-sha "${SOURCE_SHA}" \
            --output "${bundle}"
          python3 "${SOURCE_ROOT}/scripts/build_opencode_bundle.py" \
            --source-root "${SOURCE_ROOT}" --source-sha "${SOURCE_SHA}" \
            --output "${repeated}"
          cmp -s "${bundle}" "${repeated}"
          bundle_sha256="$(sha256sum "${bundle}" | cut -d' ' -f1)"
          bundle_size="$(wc -c < "${bundle}" | tr -d ' ')"
          [[ "${bundle_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${bundle_size}" =~ ^[1-9][0-9]*$ ]]
          printf '%s  %s\n' \
            "${bundle_sha256}" "${bundle_name}" > "${checksum}"
          python3 "${SOURCE_ROOT}/scripts/generate_homebrew_formula.py" \
            --tag "${TAG}" --bundle-name "${bundle_name}" \
            --bundle-sha256 "${bundle_sha256}" \
            --client-artifacts "${SOURCE_ROOT}/policy/client-artifacts.json" \
            --output "${formula}"
          ruby -c "${formula}"
          formula_sha256="$(sha256sum "${formula}" | cut -d' ' -f1)"
          formula_size="$(wc -c < "${formula}" | tr -d ' ')"
          [[ "${formula_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${formula_size}" =~ ^[1-9][0-9]*$ ]]
          (( formula_size <= 100000 ))
          {
            echo "bundle_artifact_name=${bundle_artifact_name}"
            echo "bundle_checksum_name=${bundle_checksum_name}"
            echo "bundle_name=${bundle_name}"
            echo "bundle_sha256=${bundle_sha256}"
            echo "bundle_size=${bundle_size}"
            echo "formula_name=${formula_name}"
            echo "formula_sha256=${formula_sha256}"
            echo "formula_size=${formula_size}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload exact sealed terminal assets
        id: bundle-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.bundle.outputs.bundle_artifact_name }}
          path: |
            ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_name }}
            ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_checksum_name }}
            ${{ runner.temp }}/${{ steps.bundle.outputs.formula_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
          include-hidden-files: false

      - name: Write protected-environment approval summary
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.bundle-upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.bundle-upload.outputs.artifact-id }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.bundle_sha256 }}
          BUNDLE_SIZE: ${{ steps.bundle.outputs.bundle_size }}
          CATALOG_SHA: ${{ steps.contract.outputs.catalog_sha }}
          CHANNEL: ${{ steps.contract.outputs.channel }}
          FORMULA_SHA256: ${{ steps.bundle.outputs.formula_sha256 }}
          FORMULA_SIZE: ${{ steps.bundle.outputs.formula_size }}
          REQUEST_ID: ${{ steps.contract.outputs.request_id }}
          SOURCE_SHA: ${{ steps.contract.outputs.source_sha }}
          TAG: ${{ steps.contract.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BUNDLE_NAME}" == "grillmester-opencode-${TAG}.tar.gz" ]]
          [[ "${BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${BUNDLE_SIZE}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CATALOG_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CHANNEL}" == "rc" || "${CHANNEL}" == "stable" ]]
          [[ "${FORMULA_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${FORMULA_SIZE}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REQUEST_ID}" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TAG}" =~ ^v[0-9A-Za-z.-]+$ ]]
          {
            echo "### Grillmester release approval"
            echo
            echo "| Field | Sealed value |"
            echo "| --- | --- |"
            echo "| Request | \`${REQUEST_ID}\` |"
            echo "| Channel | \`${CHANNEL}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Catalog SHA | \`${CATALOG_SHA}\` |"
            echo "| Source SHA | \`${SOURCE_SHA}\` |"
            echo "| Bundle | \`${BUNDLE_NAME}\` (${BUNDLE_SIZE} bytes) |"
            echo "| Bundle SHA-256 | \`${BUNDLE_SHA256}\` |"
            echo "| Formula SHA-256 | \`${FORMULA_SHA256}\` (${FORMULA_SIZE} bytes) |"
            echo "| Actions artifact | ID \`${ARTIFACT_ID}\`, SHA-256 \`${ARTIFACT_DIGEST}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install checksum-pinned OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64-1.18.20.tgz"
          binary_dir="${RUNNER_TEMP}/opencode-bin"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 70000000 \
            "https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-1.18.20.tgz" \
            --output "${archive}"
          echo "1fe5e153b35b7d306df98135cdab1876e9637ef79941b6adc3bda00d485629f9c4f3781df4a67cbb96e209fed364472c8bd40979b1606b6513ade6ec8afcd0ba  ${archive}" \
            | sha512sum --check --strict
          mapfile -t opencode_entries < <(tar -tzf "${archive}")
          [[ "${#opencode_entries[@]}" == "2" ]]
          [[ "${opencode_entries[0]}" == "package/package.json" ]]
          [[ "${opencode_entries[1]}" == "package/bin/opencode" ]]
          mkdir -p "${binary_dir}"
          tar -xzf "${archive}" -C "${binary_dir}" --strip-components=2 \
            --no-same-owner --no-same-permissions -- "package/bin/opencode"
          chmod 0555 "${binary_dir}/opencode"
          [[ -f "${binary_dir}/opencode" && -x "${binary_dir}/opencode" && ! -L "${binary_dir}/opencode" ]]
          echo "5dce99ea079d925736e332b20f5bf869fe9a1fa67dc0a09027156b0ed8e41b16  ${binary_dir}/opencode" \
            | sha256sum --check --strict
          echo "OPENCODE_BIN=${binary_dir}/opencode" >> "${GITHUB_ENV}"

      - name: Install checksum-pinned cplt
        shell: bash
        run: |
          set -euo pipefail
          release="2026.08.17-062831-1008a92"
          archive="${RUNNER_TEMP}/cplt-x86_64-unknown-linux-gnu.tar.gz"
          binary_dir="${RUNNER_TEMP}/cplt-bin"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 10000000 \
            "https://github.com/navikt/cplt/releases/download/${release}/cplt-x86_64-unknown-linux-gnu.tar.gz" \
            --output "${archive}"
          echo "3e6607db8ed2f361bb4e8a43246d38acc7e63e5d956de96c3319fffbd3be3eb4  ${archive}" \
            | sha256sum --check --strict
          mapfile -t cplt_entries < <(tar -tzf "${archive}")
          [[ "${#cplt_entries[@]}" == "1" && "${cplt_entries[0]}" == "cplt" ]]
          mkdir -p "${binary_dir}"
          tar -xzf "${archive}" -C "${binary_dir}" \
            --no-same-owner --no-same-permissions -- cplt
          chmod 0555 "${binary_dir}/cplt"
          [[ -f "${binary_dir}/cplt" && ! -L "${binary_dir}/cplt" ]]
          echo "115fff00248f0c170388e11f2a05cc9914f5ba589f2ca87817ed96de2c6eedb5  ${binary_dir}/cplt" \
            | sha256sum --check --strict
          [[ "$("${binary_dir}/cplt" --version)" == "cplt ${release}" ]]
          echo "CPLT_BIN=${binary_dir}/cplt" >> "${GITHUB_ENV}"

      - name: Smoke-test exact immutable OpenCode target locally
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          echo "5dce99ea079d925736e332b20f5bf869fe9a1fa67dc0a09027156b0ed8e41b16  ${OPENCODE_BIN}" | sha256sum --check --strict
          echo "115fff00248f0c170388e11f2a05cc9914f5ba589f2ca87817ed96de2c6eedb5  ${CPLT_BIN}" | sha256sum --check --strict
          python3 "${SOURCE_ROOT}/scripts/smoke_opencode.py" \
            --require-binary --opencode "${OPENCODE_BIN}"

      - name: Smoke-test exact immutable OpenCode runtime contracts locally
        shell: bash
        env:
          PATH: ${{ runner.temp }}/opencode-bin:${{ runner.temp }}/cplt-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          echo "5dce99ea079d925736e332b20f5bf869fe9a1fa67dc0a09027156b0ed8e41b16  ${OPENCODE_BIN}" | sha256sum --check --strict
          echo "115fff00248f0c170388e11f2a05cc9914f5ba589f2ca87817ed96de2c6eedb5  ${CPLT_BIN}" | sha256sum --check --strict
          python3 "${SOURCE_ROOT}/scripts/smoke_opencode_runtime.py" \
            --require-binary --opencode "${OPENCODE_BIN}" --cplt "${CPLT_BIN}"

  copilot-compatibility:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CATALOG_SHA: ${{ needs.validate.outputs.catalog-sha }}
      SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
    steps:
      - name: Check out exact immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore exact catalog commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CATALOG_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/heads/marketplace:refs/remotes/origin/marketplace"
          git merge-base --is-ancestor "${CATALOG_SHA}" refs/remotes/origin/marketplace
          catalog="${RUNNER_TEMP}/marketplace.json"
          git show "${CATALOG_SHA}:.github/plugin/marketplace.json" > "${catalog}"
          echo "CATALOG_PATH=${catalog}" >> "${GITHUB_ENV}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test exact immutable catalog locally
        run: >-
          python3 scripts/smoke_plugin_install.py
          --catalog "${CATALOG_PATH}"
          --source-root "${GITHUB_WORKSPACE}"
          --source-sha "${SOURCE_SHA}"
          --expect-release-sha "${SOURCE_SHA}"

  macos-homebrew-compatibility:
    needs:
      - validate
      - verify-release-assets
    uses: ./.github/workflows/macos-homebrew-compatibility.yml
    with:
      release_bundle_name: ${{ needs.validate.outputs.bundle-name }}
      release_bundle_sha256: ${{ needs.validate.outputs.bundle-sha256 }}
      release_formula_sha256: ${{ needs.validate.outputs.formula-sha256 }}
      sealed_formula_base64: ${{ needs.verify-release-assets.outputs.formula-base64 }}
      source_sha: ${{ needs.validate.outputs.source-sha }}
    permissions:
      contents: read

  macos-live-compatibility:
    needs: validate
    uses: ./.github/workflows/macos-opencode-compatibility.yml
    with:
      source_sha: ${{ needs.validate.outputs.source-sha }}
    permissions:
      contents: read

  verify-release-assets:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      formula-base64: ${{ steps.macos-formula.outputs.formula_base64 }}
    permissions:
      actions: read # Authenticate and download this run's exact artifact by ID.
      contents: read
    env:
      BEFORE_SHA: ${{ needs.validate.outputs.before-sha }}
      BUNDLE_ARTIFACT_DIGEST: ${{ needs.validate.outputs.bundle-artifact-digest }}
      BUNDLE_ARTIFACT_ID: ${{ needs.validate.outputs.bundle-artifact-id }}
      BUNDLE_ARTIFACT_NAME: ${{ needs.validate.outputs.bundle-artifact-name }}
      BUNDLE_CHECKSUM_NAME: ${{ needs.validate.outputs.bundle-checksum-name }}
      BUNDLE_NAME: ${{ needs.validate.outputs.bundle-name }}
      BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
      BUNDLE_SIZE: ${{ needs.validate.outputs.bundle-size }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      MAIN_SHA: ${{ needs.validate.outputs.main-sha }}
      RUN_ID: ${{ github.run_id }}
      SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
      TAG: ${{ needs.validate.outputs.tag }}
      FORMULA_NAME: ${{ needs.validate.outputs.formula-name }}
      FORMULA_SHA256: ${{ needs.validate.outputs.formula-sha256 }}
      FORMULA_SIZE: ${{ needs.validate.outputs.formula-size }}
    steps:
      - name: Independently bind sealed assets to immutable source
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${MAIN_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BUNDLE_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${BUNDLE_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ && \
             "${BUNDLE_SIZE}" =~ ^[1-9][0-9]*$ ]]
          (( BUNDLE_SIZE <= 61000000 ))
          [[ "${FORMULA_NAME}" == "grillmester.rb" ]]
          [[ "${FORMULA_SHA256}" =~ ^[0-9a-f]{64}$ && \
             "${FORMULA_SIZE}" =~ ^[1-9][0-9]*$ ]]
          (( FORMULA_SIZE <= 100000 ))
          [[ "${RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${TAG}" =~ ^v[0-9A-Za-z.-]+$ ]]
          [[ "${BUNDLE_NAME}" == "grillmester-opencode-${TAG}.tar.gz" ]]
          [[ "${BUNDLE_ARTIFACT_NAME}" == "sealed-${BUNDLE_NAME}-${SOURCE_SHA}" ]]
          [[ "${BUNDLE_CHECKSUM_NAME}" == "${BUNDLE_NAME}.sha256" ]]
          artifact_zip="${RUNNER_TEMP}/sealed-opencode-assets.zip"
          bundle="${RUNNER_TEMP}/${BUNDLE_NAME}"
          checksum="${RUNNER_TEMP}/${BUNDLE_CHECKSUM_NAME}"
          formula="${RUNNER_TEMP}/${FORMULA_NAME}"

          artifact="$(GH_TOKEN="${READ_TOKEN}" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/artifacts/${BUNDLE_ARTIFACT_ID}")"
          artifact_size="$(jq -er '.size_in_bytes' <<<"${artifact}")"
          [[ "${artifact_size}" =~ ^[1-9][0-9]*$ ]]
          (( artifact_size <= 62100000 ))
          jq -e \
            --arg digest "sha256:${BUNDLE_ARTIFACT_DIGEST}" \
            --arg id "${BUNDLE_ARTIFACT_ID}" \
            --arg main_sha "${MAIN_SHA}" \
            --arg name "${BUNDLE_ARTIFACT_NAME}" \
            --arg run_id "${RUN_ID}" \
            '.id == ($id | tonumber) and .name == $name and
             .expired == false and .digest == $digest and
             .workflow_run.id == ($run_id | tonumber) and
             .workflow_run.head_sha == $main_sha' \
            <<<"${artifact}" >/dev/null
          GH_TOKEN="${READ_TOKEN}" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/artifacts/${BUNDLE_ARTIFACT_ID}/zip" \
            > "${artifact_zip}"
          [[ "$(wc -c < "${artifact_zip}" | tr -d ' ')" == "${artifact_size}" ]]
          [[ "$(sha256sum "${artifact_zip}" | cut -d' ' -f1)" == \
             "${BUNDLE_ARTIFACT_DIGEST}" ]]
          mapfile -t artifact_entries < <(unzip -Z1 "${artifact_zip}")
          [[ "${#artifact_entries[@]}" == "3" ]]
          [[ "$(printf '%s\n' "${artifact_entries[@]}" | LC_ALL=C sort)" == \
             "$(printf '%s\n' "${BUNDLE_CHECKSUM_NAME}" "${BUNDLE_NAME}" \
               "${FORMULA_NAME}" | LC_ALL=C sort)" ]]
          unzip -p "${artifact_zip}" "${BUNDLE_NAME}" > "${bundle}"
          unzip -p "${artifact_zip}" "${BUNDLE_CHECKSUM_NAME}" > "${checksum}"
          unzip -p "${artifact_zip}" "${FORMULA_NAME}" > "${formula}"
          [[ "$(wc -c < "${bundle}" | tr -d ' ')" == "${BUNDLE_SIZE}" ]]
          [[ "$(sha256sum "${bundle}" | cut -d' ' -f1)" == "${BUNDLE_SHA256}" ]]
          expected_checksum="${RUNNER_TEMP}/expected-${BUNDLE_CHECKSUM_NAME}"
          printf '%s  %s\n' \
            "${BUNDLE_SHA256}" "${BUNDLE_NAME}" > "${expected_checksum}"
          cmp -s "${expected_checksum}" "${checksum}"
          [[ "$(wc -c < "${formula}" | tr -d ' ')" == "${FORMULA_SIZE}" ]]
          [[ "$(sha256sum "${formula}" | cut -d' ' -f1)" == "${FORMULA_SHA256}" ]]
          ruby -c "${formula}"

          git init --quiet
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          [[ "${MAIN_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]]
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main
          # This verifier is workflow-owned code, not code from SOURCE_SHA. It
          # independently binds every archive byte to immutable Git blobs before
          # the write token can create a public release.
          python3 - "${bundle}" "${SOURCE_SHA}" <<'PY'
          import hashlib
          import io
          import json
          import re
          import stat
          import subprocess
          import sys
          import tarfile
          import unicodedata
          import zlib
          from pathlib import Path, PurePosixPath

          archive_path = Path(sys.argv[1])
          source_sha = sys.argv[2]
          archive_root = PurePosixPath("grillmester-opencode-v1")
          outer_manifest = PurePosixPath("DISTRIBUTION-MANIFEST.json")
          max_archive_bytes = 61_000_000
          max_tar_bytes = 61_000_000
          max_file_bytes = 5_000_000
          max_distribution_bytes = 50_000_000
          digest_pattern = re.compile(r"^[0-9a-f]{64}$")

          def fail(message):
              raise SystemExit(f"sealed OpenCode archive verification failed: {message}")

          def duplicate_keys(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      fail(f"duplicate JSON key {key!r}")
                  value[key] = item
              return value

          def reject_constant(value):
              fail(f"non-standard JSON constant {value!r}")

          def json_object(content, label):
              try:
                  value = json.loads(
                      content.decode("utf-8"),
                      object_pairs_hook=duplicate_keys,
                      parse_constant=reject_constant,
                  )
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  fail(f"{label} is invalid JSON: {error}")
              if not isinstance(value, dict):
                  fail(f"{label} must be an object")
              return value

          def safe_path(value, label):
              if not isinstance(value, str) or not value:
                  fail(f"{label} must be a non-empty string")
              if "\\" in value or any(ord(character) < 32 or ord(character) == 127 for character in value):
                  fail(f"{label} is not portable: {value!r}")
              path = PurePosixPath(value)
              if (
                  path.is_absolute()
                  or path.as_posix() != value
                  or any(part in ("", ".", "..") for part in path.parts)
              ):
                  fail(f"{label} is not a normalized relative path: {value!r}")
              return path

          def run_git(*arguments):
              completed = subprocess.run(
                  ["git", *arguments],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if completed.returncode != 0:
                  fail(f"git {' '.join(arguments[:2])} could not inspect immutable source")
              return completed.stdout

          def git_tree(prefix):
              result = {}
              raw = run_git("ls-tree", "-rz", source_sha, "--", prefix)
              for record in raw.split(b"\0"):
                  if not record:
                      continue
                  try:
                      metadata, encoded_path = record.split(b"\t", 1)
                      mode, kind, object_id = metadata.decode("ascii").split(" ")
                      path = encoded_path.decode("utf-8")
                  except (UnicodeDecodeError, ValueError):
                      fail(f"Git tree for {prefix!r} is not canonical UTF-8")
                  if kind != "blob" or mode not in ("100644", "100755"):
                      fail(f"unsupported Git node at {path!r}")
                  if path in result:
                      fail(f"duplicate Git path {path!r}")
                  result[path] = (mode, object_id)
              return result

          def git_blob(node):
              return run_git("cat-file", "blob", node[1])

          if archive_path.stat().st_size > max_archive_bytes:
              fail("compressed archive exceeds the safety limit")
          with archive_path.open("rb") as stream:
              header = stream.read(10)
              if header != bytes.fromhex("1f8b08000000000002ff"):
                  fail("gzip header is not canonical")
              stream.seek(0)
              decompressor = zlib.decompressobj(wbits=31)
              uncompressed = bytearray()
              while chunk := stream.read(1024 * 1024):
                  pending = chunk
                  while pending:
                      remaining = max_tar_bytes + 1 - len(uncompressed)
                      if remaining <= 0:
                          fail("archive expands beyond the safety limit")
                      uncompressed.extend(decompressor.decompress(pending, remaining))
                      if len(uncompressed) > max_tar_bytes:
                          fail("archive expands beyond the safety limit")
                      pending = decompressor.unconsumed_tail
              uncompressed.extend(decompressor.flush(max_tar_bytes + 1 - len(uncompressed)))
              if len(uncompressed) > max_tar_bytes:
                  fail("archive expands beyond the safety limit")
              if not decompressor.eof or decompressor.unused_data:
                  fail("gzip stream is truncated, concatenated, or has trailing data")
          if len(uncompressed) % 10240 != 0:
              fail("tar blocking is not canonical")

          archive_files = {}
          archive_directories = set()
          portable_paths = {}
          aggregate_size = 0
          cursor = 0
          with tarfile.open(fileobj=io.BytesIO(uncompressed), mode="r:") as archive:
              if archive.pax_headers:
                  fail("global PAX headers are forbidden")
              members = archive.getmembers()
              if not members or len(members) > 10000:
                  fail("archive member count is invalid")
              normalized_names = []
              for member in members:
                  raw_name = member.name[:-1] if member.isdir() and member.name.endswith("/") else member.name
                  relative = safe_path(raw_name, "archive member")
                  if not relative.parts or relative.parts[0] != archive_root.as_posix():
                      fail(f"archive member is outside {archive_root}: {relative}")
                  if member.offset != cursor or member.offset_data != member.offset + 512:
                      fail(f"archive uses non-canonical headers before {relative}")
                  cursor = member.offset_data + ((member.size + 511) // 512) * 512
                  if member.pax_headers:
                      fail(f"PAX headers are forbidden for {relative}")
                  if (
                      member.uid != 0
                      or member.gid != 0
                      or member.uname != ""
                      or member.gname != ""
                      or member.mtime != 0
                  ):
                      fail(f"archive metadata is not canonical for {relative}")
                  collision_key = unicodedata.normalize("NFC", relative.as_posix()).casefold()
                  if collision_key in portable_paths:
                      fail(f"portable archive path collision at {relative}")
                  portable_paths[collision_key] = relative
                  normalized_names.append(relative.as_posix())
                  mode = stat.S_IMODE(member.mode)
                  if member.isdir():
                      if mode != 0o755 or member.size != 0:
                          fail(f"directory metadata is invalid for {relative}")
                      archive_directories.add(relative)
                      continue
                  if not member.isreg() or mode not in (0o644, 0o755):
                      fail(f"links and special nodes are forbidden: {relative}")
                  if len(relative.parts) == 1 or member.size > max_file_bytes:
                      fail(f"archive file is invalid or too large: {relative}")
                  aggregate_size += member.size
                  if aggregate_size > max_distribution_bytes:
                      fail("distribution files exceed the safety limit")
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      fail(f"cannot read archive file {relative}")
                  content = extracted.read(max_file_bytes + 1)
                  if len(content) != member.size:
                      fail(f"archive file size changed for {relative}")
                  path = PurePosixPath(*relative.parts[1:])
                  if path in archive_files:
                      fail(f"duplicate archive file {path}")
                  archive_files[path] = (content, mode)
              if normalized_names != sorted(normalized_names):
                  fail("archive members are not sorted")
          if len(uncompressed) - cursor < 1024 or any(uncompressed[cursor:]):
              fail("tar end padding is not canonical")

          manager_path = "scripts/manage_opencode.py"
          launcher_path = "scripts/grillmester.py"
          composer_path = "scripts/compose_opencode_permissions.py"
          artifact_verifier_path = "scripts/verify_client_artifact.py"
          legal_source_to_archive = {
              "LICENSE": "LICENSE",
              "PROVENANCE.md": "PROVENANCE.md",
              "THIRD_PARTY_NOTICES.md": "THIRD_PARTY_NOTICES.md",
              "policy/content-lock.json": "policy/content-lock.json",
              "policy/client-artifacts.json": "policy/client-artifacts.json",
          }
          profile_paths = {
              f"profiles/opencode/{profile}.json"
              for profile in ("cloud-open-weight", "hybrid", "local", "local-only")
          }
          manager_nodes = git_tree(manager_path)
          launcher_nodes = git_tree(launcher_path)
          composer_nodes = git_tree(composer_path)
          artifact_verifier_nodes = git_tree(artifact_verifier_path)
          plugin_nodes = git_tree("plugin")
          profile_nodes = git_tree("profiles/opencode")
          target_nodes = git_tree("targets/opencode-v1")
          legal_nodes = {}
          for source_path in legal_source_to_archive:
              nodes = git_tree(source_path)
              if set(nodes) != {source_path} or nodes[source_path][0] != "100644":
                  fail(f"immutable source has no regular legal artifact {source_path}")
              legal_nodes[source_path] = nodes[source_path]
          if (
              set(manager_nodes) != {manager_path}
              or manager_nodes[manager_path][0] != "100644"
          ):
              fail("immutable source has no regular lifecycle manager")
          if (
              set(launcher_nodes) != {launcher_path}
              or launcher_nodes[launcher_path][0] != "100644"
          ):
              fail("immutable source has no regular Grillmester launcher")
          if set(composer_nodes) != {composer_path} or composer_nodes[composer_path][0] != "100644":
              fail("immutable source has no regular permission composer")
          if (
              set(artifact_verifier_nodes) != {artifact_verifier_path}
              or artifact_verifier_nodes[artifact_verifier_path][0] != "100644"
          ):
              fail("immutable source has no regular client artifact verifier")
          if set(profile_nodes) != profile_paths:
              fail("immutable source does not have exactly four runtime profiles")
          if any(node[0] != "100644" for node in profile_nodes.values()):
              fail("runtime profiles must have source mode 0644")

          target_manifest_path = "targets/opencode-v1/manifest.json"
          if target_manifest_path not in target_nodes or target_nodes[target_manifest_path][0] != "100644":
              fail("immutable source has no mode-0644 target manifest")
          target_manifest_bytes = git_blob(target_nodes[target_manifest_path])
          target_manifest = json_object(target_manifest_bytes, "target manifest")
          if target_manifest.get("schemaVersion") != 1 or target_manifest.get("target") != "opencode-v1":
              fail("target manifest identity is invalid")
          target_entries = target_manifest.get("files")
          if not isinstance(target_entries, dict) or not target_entries:
              fail("target manifest file inventory is invalid")

          expected_content = {
              PurePosixPath(launcher_path): (git_blob(launcher_nodes[launcher_path]), 0o755),
              PurePosixPath(manager_path): (git_blob(manager_nodes[manager_path]), 0o755),
              PurePosixPath(composer_path): (git_blob(composer_nodes[composer_path]), 0o644),
              PurePosixPath(artifact_verifier_path): (
                  git_blob(artifact_verifier_nodes[artifact_verifier_path]), 0o755
              ),
              PurePosixPath(target_manifest_path): (target_manifest_bytes, 0o644),
          }
          for source_path, archive_path in legal_source_to_archive.items():
              expected_content[PurePosixPath(archive_path)] = (
                  git_blob(legal_nodes[source_path]), 0o644
              )
          for path in sorted(profile_paths):
              expected_content[PurePosixPath(path)] = (git_blob(profile_nodes[path]), 0o644)
          if not plugin_nodes or "plugin/plugin.json" not in plugin_nodes:
              fail("immutable source has no Copilot plugin tree")
          for path, node in sorted(plugin_nodes.items()):
              source_mode = node[0]
              if source_mode not in ("100644", "100755"):
                  fail(f"unsupported Copilot plugin source mode for {path}")
              expected_content[PurePosixPath(path)] = (
                  git_blob(node),
                  0o755 if source_mode == "100755" else 0o644,
              )
          expected_target_paths = {target_manifest_path}
          seen_target_paths = set()
          for raw_relative, entry in target_entries.items():
              relative = safe_path(raw_relative, "target manifest path")
              if relative == PurePosixPath("manifest.json") or relative in seen_target_paths:
                  fail(f"invalid target manifest path {relative}")
              seen_target_paths.add(relative)
              if not isinstance(entry, dict) or set(entry) != {"sha256", "mode"}:
                  fail(f"invalid target manifest entry for {relative}")
              digest = entry.get("sha256")
              raw_mode = entry.get("mode")
              if not isinstance(digest, str) or digest_pattern.fullmatch(digest) is None:
                  fail(f"invalid target digest for {relative}")
              if not isinstance(raw_mode, str) or re.fullmatch(r"0[0-7]{3}", raw_mode) is None:
                  fail(f"invalid target mode for {relative}")
              mode = int(raw_mode, 8)
              if mode not in (0o644, 0o755):
                  fail(f"unsupported target mode for {relative}")
              source_path = f"targets/opencode-v1/{relative.as_posix()}"
              expected_target_paths.add(source_path)
              node = target_nodes.get(source_path)
              if node is None or node[0] != f"100{mode:03o}":
                  fail(f"target source node or mode does not match for {relative}")
              content = git_blob(node)
              if hashlib.sha256(content).hexdigest() != digest:
                  fail(f"target source digest does not match for {relative}")
              expected_content[PurePosixPath(source_path)] = (content, mode)
          if set(target_nodes) != expected_target_paths:
              fail("target source tree differs from its manifest inventory")

          manifest_entry = archive_files.pop(outer_manifest, None)
          if manifest_entry is None or manifest_entry[1] != 0o644:
              fail("distribution manifest is missing or has the wrong mode")
          if set(archive_files) != set(expected_content):
              fail("archive file roster differs from immutable source")
          for path, expected in expected_content.items():
              if archive_files[path] != expected:
                  fail(f"archive bytes or mode differ from immutable source for {path}")

          file_manifest = {
              path.as_posix(): {
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "mode": f"{mode:04o}",
              }
              for path, (content, mode) in sorted(expected_content.items(), key=lambda item: item[0].as_posix())
          }
          expected_manifest = {
              "schemaVersion": 1,
              "sourceSha": source_sha,
              "target": "opencode-v1",
              "opencodeVersion": "1.18.20",
              "cpltRelease": "2026.08.17-062831-1008a92",
              "targetManifestSha256": hashlib.sha256(target_manifest_bytes).hexdigest(),
              "files": file_manifest,
          }
          expected_manifest_bytes = (json.dumps(expected_manifest, indent=2, sort_keys=True) + "\n").encode()
          if manifest_entry[0] != expected_manifest_bytes:
              fail("distribution manifest is not the canonical immutable-source manifest")

          expected_directories = {archive_root}
          for path in (*expected_content, outer_manifest):
              parent = archive_root / path.parent
              while parent != archive_root.parent:
                  expected_directories.add(parent)
                  parent = parent.parent
          if archive_directories != expected_directories:
              fail("archive directory roster differs from immutable source")
          PY

      - name: Independently bind formula with trusted release tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ && \
             "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]
          [[ "${MAIN_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TAG}" =~ ^v[0-9A-Za-z.-]+$ ]]
          [[ "${BUNDLE_NAME}" == "grillmester-opencode-${TAG}.tar.gz" ]]
          [[ "${BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${FORMULA_NAME}" == "grillmester.rb" ]]

          # The push that invoked this workflow may only change the reviewed
          # release request, so tooling read from MAIN_SHA is workflow-owned.
          git cat-file -e "${BEFORE_SHA}^{commit}"
          git cat-file -e "${MAIN_SHA}^{commit}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "${BEFORE_SHA}" "${MAIN_SHA}"
          [[ "$(git diff --name-only "${BEFORE_SHA}" "${MAIN_SHA}")" == \
             ".github/release-request.json" ]]

          trusted_root="${RUNNER_TEMP}/trusted-formula-renderer"
          mkdir -m 700 "${trusted_root}"
          trusted_generator="${trusted_root}/generate_homebrew_formula.py"
          client_lock="${trusted_root}/client-artifacts.json"
          expected_formula="${trusted_root}/grillmester.rb"
          git show "${MAIN_SHA}:scripts/generate_homebrew_formula.py" \
            > "${trusted_generator}"
          git show "${SOURCE_SHA}:policy/client-artifacts.json" > "${client_lock}"
          chmod 0400 "${trusted_generator}" "${client_lock}"
          python3 -I -S "${trusted_generator}" \
            --tag "${TAG}" --bundle-name "${BUNDLE_NAME}" \
            --bundle-sha256 "${BUNDLE_SHA256}" \
            --client-artifacts "${client_lock}" \
            --output "${expected_formula}"
          [[ -f "${expected_formula}" && ! -L "${expected_formula}" ]]
          [[ "$(sha256sum "${expected_formula}" | cut -d' ' -f1)" == \
             "${FORMULA_SHA256}" ]]
          cmp -s "${expected_formula}" "${RUNNER_TEMP}/${FORMULA_NAME}"

      - name: Export independently verified formula for macOS
        id: macos-formula
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import base64
          import hashlib
          import os
          import stat
          from pathlib import Path

          formula = Path(os.environ["RUNNER_TEMP"]) / os.environ["FORMULA_NAME"]
          observed = formula.lstat()
          if not stat.S_ISREG(observed.st_mode) or observed.st_size <= 0:
              raise SystemExit("verified release formula is not a nonempty regular file")
          if observed.st_size > 100_000:
              raise SystemExit("verified release formula is too large")
          content = formula.read_bytes()
          if len(content) != observed.st_size:
              raise SystemExit("verified release formula changed while reading")
          if hashlib.sha256(content).hexdigest() != os.environ["FORMULA_SHA256"]:
              raise SystemExit("verified release formula digest changed")
          encoded = base64.b64encode(content).decode("ascii")
          if len(encoded) > 140_000:
              raise SystemExit("verified release formula encoding is too large")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"formula_base64={encoded}\n")
          PY

      - name: Independently enforce stable rights approval
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CHANNEL}" != "stable" ]]; then
            [[ "${CHANNEL}" == "rc" ]]
            exit 0
          fi
          python3 - "${SOURCE_SHA}" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import re
          import subprocess
          import sys

          source_sha = sys.argv[1]
          hovmester_repo = "navikt/hovmester"
          hovmester_revision = "48483bf32c2b6f89c31e7d50e25b5fe6fac45ca2"
          placeholder = re.compile(
              r"unverified|unknown|pending|placeholder|example|todo|tbd|replace[-_ ]?me",
              re.IGNORECASE,
          )

          def fail(message):
              raise SystemExit(message)

          def git(*arguments):
              result = subprocess.run(
                  ["git", *arguments],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if result.returncode != 0:
                  fail(f"cannot read immutable source object: {' '.join(arguments[:2])}")
              return result.stdout

          def object_from_bytes(raw, label):
              def no_duplicates(pairs):
                  value = {}
                  for key, item in pairs:
                      if key in value:
                          fail(f"duplicate key in {label}: {key!r}")
                      value[key] = item
                  return value
              try:
                  value = json.loads(raw.decode("utf-8"), object_pairs_hook=no_duplicates)
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  fail(f"invalid JSON in {label}: {error}")
              if not isinstance(value, dict):
                  fail(f"{label} must be an object")
              return value

          def blob(path):
              if not re.fullmatch(r"[A-Za-z0-9_./-]+", path) or ".." in path.split("/"):
                  fail(f"unsafe source path: {path!r}")
              return git("show", f"{source_sha}:{path}")

          def exact(value, keys, label):
              if not isinstance(value, dict) or set(value) != set(keys):
                  fail(f"{label} has the wrong exact schema")
              return value

          def component_digest(kind, component_id):
              if re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", component_id) is None:
                  fail(f"unsafe component id: {component_id!r}")
              if kind == "agents":
                  return hashlib.sha256(
                      blob(f"plugin/agents/{component_id}.agent.md")
                  ).hexdigest()
              prefix = f"plugin/skills/{component_id}"
              manifest = {}
              for record in git("ls-tree", "-rz", source_sha, "--", prefix).split(b"\0"):
                  if not record:
                      continue
                  try:
                      metadata, encoded_path = record.split(b"\t", 1)
                      mode, node_type, object_id = metadata.decode("ascii").split(" ")
                      path = encoded_path.decode("utf-8")
                  except (UnicodeDecodeError, ValueError):
                      fail(f"invalid Git tree for {prefix}")
                  if node_type != "blob" or mode not in ("100644", "100755"):
                      fail(f"unsupported Git node for {path}")
                  relative = path.removeprefix(prefix + "/")
                  if not relative or relative == path or relative in manifest:
                      fail(f"invalid component path for {path}")
                  manifest[relative] = hashlib.sha256(
                      git("cat-file", "blob", object_id)
                  ).hexdigest()
              if not manifest:
                  fail(f"empty imported skill: {component_id}")
              canonical = json.dumps(
                  manifest, ensure_ascii=False, separators=(",", ":"), sort_keys=True
              ).encode()
              return hashlib.sha256(canonical).hexdigest()

          approval = object_from_bytes(
              blob("policy/stable-rights-approval.json"), "stable rights approval"
          )
          content_lock_bytes = blob("policy/content-lock.json")
          content_lock = object_from_bytes(content_lock_bytes, "content lock")
          provenance_bytes = blob("PROVENANCE.md")
          exact(approval, {"schemaVersion", "scope", "decisions"}, "approval")
          if approval["schemaVersion"] != 1:
              fail("approval schemaVersion must be 1")
          scope = exact(
              approval["scope"],
              {"hovmester", "contentLockSha256", "provenanceSha256", "components"},
              "approval scope",
          )
          if scope["hovmester"] != {
              "repository": hovmester_repo,
              "revision": hovmester_revision,
          }:
              fail("approval Hovmester scope differs")
          if scope["contentLockSha256"] != hashlib.sha256(content_lock_bytes).hexdigest():
              fail("approval does not bind the content lock")
          if scope["provenanceSha256"] != hashlib.sha256(provenance_bytes).hexdigest():
              fail("approval does not bind provenance")

          expected_components = {"agents": {}, "skills": {}}
          sources = content_lock.get("sources")
          if not isinstance(sources, dict) or sources.get("hovmester") != {
              "repository": hovmester_repo,
              "revision": hovmester_revision,
          }:
              fail("content lock Hovmester source differs")
          for kind in ("agents", "skills"):
              contracts = content_lock.get(kind)
              if not isinstance(contracts, dict):
                  fail(f"content lock {kind} is invalid")
              for component_id, contract in sorted(contracts.items()):
                  if not isinstance(contract, dict):
                      fail(f"content lock {kind} contract is invalid")
                  source_ids = {contract.get("source")}
                  lineage = contract.get("lineage", [])
                  if not isinstance(lineage, list) or not all(
                      isinstance(entry, dict) for entry in lineage
                  ):
                      fail(f"content lock {kind} lineage is invalid")
                  source_ids.update(entry.get("source") for entry in lineage)
                  if "hovmester" in source_ids:
                      expected_components[kind][component_id] = component_digest(
                          kind, component_id
                      )
          if set(expected_components["agents"]) != {"designer", "doctor-who"}:
              fail("imported agent rights scope differs")
          if not expected_components["skills"] or scope["components"] != expected_components:
              fail("approval does not bind exact imported component IDs and digests")

          decisions = exact(
              approval["decisions"],
              {"organizationalRights", "doctorWhoBrand"},
              "approval decisions",
          )
          for name, statuses in (
              ("organizationalRights", {"approved"}),
              ("doctorWhoBrand", {"approved", "renamed"}),
          ):
              decision = exact(
                  decisions[name],
                  {"status", "decisionReference", "authority", "date"},
                  name,
              )
              if decision["status"] not in statuses:
                  fail(f"{name} status is not approved")
              authority = exact(decision["authority"], {"role", "team"}, f"{name} authority")
              for value in (
                  decision["decisionReference"], authority["role"], authority["team"]
              ):
                  if (
                      not isinstance(value, str)
                      or not value.strip()
                      or len(value) > 256
                      or placeholder.search(value)
                  ):
                      fail(f"{name} contains a missing or placeholder decision field")
              if not isinstance(decision["date"], str) or re.fullmatch(
                  r"[0-9]{4}-[0-9]{2}-[0-9]{2}", decision["date"]
              ) is None:
                  fail(f"{name} has no ISO decision date")
              try:
                  decision_date = dt.date.fromisoformat(decision["date"])
              except (TypeError, ValueError):
                  fail(f"{name} has no real ISO decision date")
              if decision_date > dt.date.today():
                  fail(f"{name} decision date is in the future")
          if decisions["doctorWhoBrand"]["status"] == "renamed":
              fail("Doctor Who remains in scope but brand status says renamed")
          PY


  release:
    needs:
      - validate
      - copilot-compatibility
      - macos-homebrew-compatibility
      - macos-live-compatibility
      - verify-release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: grillmester-release
    permissions:
      actions: read # Re-authenticate this run's exact staged artifact by ID.
      contents: write # Create the GitHub release and upload its assets.
    env:
      BEFORE_SHA: ${{ needs.validate.outputs.before-sha }}
      BUNDLE_ARTIFACT_DIGEST: ${{ needs.validate.outputs.bundle-artifact-digest }}
      BUNDLE_ARTIFACT_ID: ${{ needs.validate.outputs.bundle-artifact-id }}
      BUNDLE_ARTIFACT_NAME: ${{ needs.validate.outputs.bundle-artifact-name }}
      BUNDLE_CHECKSUM_NAME: ${{ needs.validate.outputs.bundle-checksum-name }}
      BUNDLE_NAME: ${{ needs.validate.outputs.bundle-name }}
      BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
      BUNDLE_SIZE: ${{ needs.validate.outputs.bundle-size }}
      CATALOG_SHA: ${{ needs.validate.outputs.catalog-sha }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      MAIN_SHA: ${{ needs.validate.outputs.main-sha }}
      NOTES_BASE64: ${{ needs.validate.outputs.notes-base64 }}
      NOTES_SHA256: ${{ needs.validate.outputs.notes-sha256 }}
      RC_BUNDLE_CHECKSUM_NAME: ${{ needs.validate.outputs.rc-bundle-checksum-name }}
      RC_BUNDLE_CHECKSUM_SHA256: ${{ needs.validate.outputs.rc-bundle-checksum-sha256 }}
      RC_BUNDLE_NAME: ${{ needs.validate.outputs.rc-bundle-name }}
      RC_BUNDLE_SHA256: ${{ needs.validate.outputs.rc-bundle-sha256 }}
      RC_FORMULA_SHA256: ${{ needs.validate.outputs.rc-formula-sha256 }}
      RC_CATALOG_SHA: ${{ needs.validate.outputs.rc-catalog-sha }}
      RC_SOURCE_SHA: ${{ needs.validate.outputs.rc-source-sha }}
      RC_TAG: ${{ needs.validate.outputs.rc-tag }}
      REQUEST_ID: ${{ needs.validate.outputs.request-id }}
      RUN_ID: ${{ github.run_id }}
      SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
      TAG: ${{ needs.validate.outputs.tag }}
      FORMULA_NAME: ${{ needs.validate.outputs.formula-name }}
      FORMULA_SHA256: ${{ needs.validate.outputs.formula-sha256 }}
      FORMULA_SIZE: ${{ needs.validate.outputs.formula-size }}
    steps:
      - name: Require immutable GitHub Releases before publication
        shell: bash
        env:
          IMMUTABLE_RELEASES_ADMIN_READ_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ -n "${IMMUTABLE_RELEASES_ADMIN_READ_TOKEN}" ]] || {
            echo "The protected environment lacks its Administration:read token." >&2
            exit 1
          }
          immutable_policy="$(curl --config /dev/null \
            --fail-with-body --silent --show-error \
            --proto '=https' --tlsv1.2 --max-filesize 4096 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer ${IMMUTABLE_RELEASES_ADMIN_READ_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/immutable-releases")"
          jq -e '
            type == "object" and
            (.enabled | type) == "boolean" and .enabled == true and
            (.enforced_by_owner | type) == "boolean"
          ' <<<"${immutable_policy}" >/dev/null

      - name: Publish exact reviewed release idempotently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ && \
             "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]
          [[ "${MAIN_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CATALOG_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${NOTES_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${BUNDLE_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${BUNDLE_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ && \
             "${BUNDLE_SIZE}" =~ ^[1-9][0-9]*$ ]]
          (( BUNDLE_SIZE <= 61000000 ))
          [[ "${FORMULA_NAME}" == "grillmester.rb" && \
             "${FORMULA_SHA256}" =~ ^[0-9a-f]{64}$ && \
             "${FORMULA_SIZE}" =~ ^[1-9][0-9]*$ ]]
          (( FORMULA_SIZE <= 100000 ))
          [[ "${RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REQUEST_ID}" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          [[ "${TAG}" =~ ^v[0-9A-Za-z.-]+$ ]]
          [[ "${CHANNEL}" == "rc" || "${CHANNEL}" == "stable" ]]
          [[ "${BUNDLE_NAME}" == "grillmester-opencode-${TAG}.tar.gz" ]]
          [[ "${BUNDLE_ARTIFACT_NAME}" == "sealed-${BUNDLE_NAME}-${SOURCE_SHA}" ]]
          [[ "${BUNDLE_CHECKSUM_NAME}" == "${BUNDLE_NAME}.sha256" ]]
          notes="${RUNNER_TEMP}/release-notes.md"
          artifact_zip="${RUNNER_TEMP}/sealed-opencode-assets.zip"
          bundle="${RUNNER_TEMP}/${BUNDLE_NAME}"
          checksum="${RUNNER_TEMP}/${BUNDLE_CHECKSUM_NAME}"
          formula="${RUNNER_TEMP}/${FORMULA_NAME}"
          printf '%s' "${NOTES_BASE64}" | base64 --decode > "${notes}"
          [[ "$(sha256sum "${notes}" | cut -d' ' -f1)" == "${NOTES_SHA256}" ]]

          artifact="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/artifacts/${BUNDLE_ARTIFACT_ID}")"
          artifact_size="$(jq -er '.size_in_bytes' <<<"${artifact}")"
          [[ "${artifact_size}" =~ ^[1-9][0-9]*$ ]]
          (( artifact_size <= 62100000 ))
          jq -e \
            --arg digest "sha256:${BUNDLE_ARTIFACT_DIGEST}" \
            --arg id "${BUNDLE_ARTIFACT_ID}" \
            --arg main_sha "${MAIN_SHA}" \
            --arg name "${BUNDLE_ARTIFACT_NAME}" \
            --arg run_id "${RUN_ID}" \
            '.id == ($id | tonumber) and
             .name == $name and
             .expired == false and
             .digest == $digest and
             .workflow_run.id == ($run_id | tonumber) and
             .workflow_run.head_sha == $main_sha' \
            <<<"${artifact}" >/dev/null
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/actions/artifacts/${BUNDLE_ARTIFACT_ID}/zip" \
            > "${artifact_zip}"
          [[ "$(wc -c < "${artifact_zip}" | tr -d ' ')" == "${artifact_size}" ]]
          [[ "$(sha256sum "${artifact_zip}" | cut -d' ' -f1)" == \
             "${BUNDLE_ARTIFACT_DIGEST}" ]]
          mapfile -t artifact_entries < <(unzip -Z1 "${artifact_zip}")
          [[ "${#artifact_entries[@]}" == "3" ]]
          [[ "$(printf '%s\n' "${artifact_entries[@]}" | LC_ALL=C sort)" == \
             "$(printf '%s\n' "${BUNDLE_CHECKSUM_NAME}" "${BUNDLE_NAME}" \
               "${FORMULA_NAME}" | LC_ALL=C sort)" ]]
          unzip -p "${artifact_zip}" "${BUNDLE_NAME}" > "${bundle}"
          unzip -p "${artifact_zip}" "${BUNDLE_CHECKSUM_NAME}" > "${checksum}"
          unzip -p "${artifact_zip}" "${FORMULA_NAME}" > "${formula}"
          [[ "$(wc -c < "${bundle}" | tr -d ' ')" == "${BUNDLE_SIZE}" ]]
          [[ "$(sha256sum "${bundle}" | cut -d' ' -f1)" == "${BUNDLE_SHA256}" ]]
          expected_checksum="${RUNNER_TEMP}/expected-${BUNDLE_CHECKSUM_NAME}"
          printf '%s  %s\n' \
            "${BUNDLE_SHA256}" "${BUNDLE_NAME}" > "${expected_checksum}"
          cmp -s "${expected_checksum}" "${checksum}"
          (cd "${RUNNER_TEMP}" && sha256sum --check --strict "${BUNDLE_CHECKSUM_NAME}")
          [[ "$(wc -c < "${formula}" | tr -d ' ')" == "${FORMULA_SIZE}" ]]
          [[ "$(sha256sum "${formula}" | cut -d' ' -f1)" == "${FORMULA_SHA256}" ]]

          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/marketplace:refs/remotes/origin/marketplace"
          [[ "${MAIN_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]] || {
            echo "origin/main moved after validation; a new request is required." >&2
            exit 1
          }
          git cat-file -e "${BEFORE_SHA}^{commit}"
          git merge-base --is-ancestor "${BEFORE_SHA}" "${MAIN_SHA}"
          [[ "$(git diff --name-only "${BEFORE_SHA}" "${MAIN_SHA}")" == \
             ".github/release-request.json" ]]

          request="$(git show "${MAIN_SHA}:.github/release-request.json")"
          [[ "$(jq -r '.schemaVersion' <<<"${request}")" == "1" ]]
          [[ "$(jq -r '.channel' <<<"${request}")" == "${CHANNEL}" ]]
          [[ "$(jq -r '.catalogSha' <<<"${request}")" == "${CATALOG_SHA}" ]]
          [[ "$(jq -r '.rcTag' <<<"${request}")" == "${RC_TAG}" ]]
          [[ "$(jq -r '.requestId' <<<"${request}")" == "${REQUEST_ID}" ]]

          validate_catalog() {
            jq -e --arg v "$2" --arg s "$3" \
              '.name == "grillmester" and .metadata.version == $v and
               (.plugins | length) == 1 and [.plugins[].name] == ["grillmester"] and
               [.plugins[].version] == [$v] and .plugins[0].source ==
               {source: "github", repo: "navikt/grillmester", path: "plugin", sha: $s}' \
              "$1" >/dev/null
          }
          regenerate_catalog() {
            jq -n \
              --arg n "$(jq -er '.marketplace.name' "$1")" \
              --arg o "$(jq -er '.marketplace.owner' "$1")" \
              --arg d "$(jq -er '.marketplace.description' "$1")" \
              --arg pn "$(jq -er '.name' "$2")" \
              --arg pd "$(jq -er '.description' "$2")" \
              --arg v "$3" --arg s "$4" \
              '{name: $n, owner: {name: $o}, metadata: {description: $d, version: $v},
                plugins: [{name: $pn, description: $pd, version: $v,
                  source: {source: "github", repo: "navikt/grillmester",
                    path: "plugin", sha: $s}}]}' > "$5"
          }

          git cat-file -e "${CATALOG_SHA}^{commit}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor \
            "${CATALOG_SHA}" refs/remotes/origin/marketplace
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main
          expected_tree="100644 blob $(git rev-parse "${CATALOG_SHA}:.github/plugin/marketplace.json")"
          actual_tree="$(git ls-tree -r "${CATALOG_SHA}")"
          [[ "${actual_tree}" == "${expected_tree}"$'\t'.github/plugin/marketplace.json ]]
          catalog_file="${RUNNER_TEMP}/marketplace.json"
          git show "${CATALOG_SHA}:.github/plugin/marketplace.json" > "${catalog_file}"
          catalog="$(<"${catalog_file}")"
          version="$(jq -er '.metadata.version' <<<"${catalog}")"
          [[ "${TAG}" == "v${version}" ]]
          if [[ "${CHANNEL}" == "rc" ]]; then
            [[ "${version}" == *-* ]]
          else
            [[ "${version}" != *-* ]]
          fi
          validate_catalog "${catalog_file}" "${version}" "${SOURCE_SHA}"

          package_manifest_file="${RUNNER_TEMP}/package-manifest.json"
          standard_manifest_file="${RUNNER_TEMP}/grillmester-plugin.json"
          git show "${SOURCE_SHA}:package-manifest.json" > "${package_manifest_file}"
          git show "${SOURCE_SHA}:plugin/plugin.json" > "${standard_manifest_file}"
          git cat-file -e "${SOURCE_SHA}:targets/opencode-v1/opencode.json"
          git cat-file -e "${SOURCE_SHA}:targets/opencode-v1/agents/grillmester.md"
          git cat-file -e "${SOURCE_SHA}:targets/opencode-v1/skills/grillmester-grilling/SKILL.md"
          git cat-file -e "${SOURCE_SHA}:targets/opencode-v1/commands/grillmester-grilling.md"
          jq -e '
            .schemaVersion == 1 and
            (keys | sort) == ["marketplace", "packages", "schemaVersion"] and
            (.marketplace | keys | sort) == ["description", "name", "owner"] and
            .marketplace.name == "grillmester" and
            .marketplace.owner == "Team eSyfo" and
            (.marketplace.description | type == "string" and length > 0) and
            .packages == [
              {name: "grillmester", path: "plugin", agents: 7, skills: 42}
            ]
          ' "${package_manifest_file}" >/dev/null
          jq -e \
            --arg version "${version}" \
            --arg owner "$(jq -er '.marketplace.owner' "${package_manifest_file}")" \
            '
              (keys | sort) == [
                "agents", "author", "description", "license", "name",
                "repository", "skills", "version"
              ] and
              (.author | keys) == ["name"] and
              .name == "grillmester" and
              .version == $version and
              (.description | type == "string" and length > 0) and
              .author.name == $owner and
              .repository == "https://github.com/navikt/grillmester" and
              .agents == "agents/" and .skills == "skills/"
          ' "${standard_manifest_file}" >/dev/null
          regenerated_catalog="${RUNNER_TEMP}/regenerated-marketplace.json"
          regenerate_catalog "${package_manifest_file}" "${standard_manifest_file}" \
            "${version}" "${SOURCE_SHA}" "${regenerated_catalog}"
          cmp -s "${regenerated_catalog}" "${catalog_file}"

          if [[ "${CHANNEL}" == "stable" ]]; then
            git cat-file -e "${SOURCE_SHA}:policy/stable-rights-approval.json"
            [[ "${RC_TAG}" =~ ^v[0-9A-Za-z.-]+$ ]]
            [[ "${RC_CATALOG_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${RC_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${RC_BUNDLE_NAME}" == "grillmester-opencode-${RC_TAG}.tar.gz" ]]
            [[ "${RC_BUNDLE_CHECKSUM_NAME}" == "${RC_BUNDLE_NAME}.sha256" ]]
            [[ "${RC_BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${RC_BUNDLE_CHECKSUM_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${RC_FORMULA_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            git fetch --no-tags origin "refs/tags/${RC_TAG}:refs/tags/${RC_TAG}"
            [[ "$(git cat-file -t "refs/tags/${RC_TAG}")" == "tag" ]]
            [[ "$(git rev-parse "refs/tags/${RC_TAG}^{}")" == "${RC_CATALOG_SHA}" ]]
            git merge-base --is-ancestor \
              "${RC_CATALOG_SHA}" refs/remotes/origin/marketplace
            expected_rc_tree="100644 blob $(git rev-parse "${RC_CATALOG_SHA}:.github/plugin/marketplace.json")"
            actual_rc_tree="$(git ls-tree -r "${RC_CATALOG_SHA}")"
            [[ "${actual_rc_tree}" == "${expected_rc_tree}"$'\t'.github/plugin/marketplace.json ]]
            rc_catalog_file="${RUNNER_TEMP}/rc-marketplace.json"
            git show "${RC_CATALOG_SHA}:.github/plugin/marketplace.json" > "${rc_catalog_file}"
            rc_catalog_version="$(jq -er '.metadata.version' "${rc_catalog_file}")"
            [[ "v${rc_catalog_version}" == "${RC_TAG}" ]]
            validate_catalog \
              "${rc_catalog_file}" "${rc_catalog_version}" "${RC_SOURCE_SHA}"
            git merge-base --is-ancestor \
              "${RC_SOURCE_SHA}" refs/remotes/origin/main
            rc_package_manifest_file="${RUNNER_TEMP}/rc-package-manifest.json"
            rc_standard_manifest_file="${RUNNER_TEMP}/rc-grillmester-plugin.json"
            git show "${RC_SOURCE_SHA}:package-manifest.json" > "${rc_package_manifest_file}"
            git show "${RC_SOURCE_SHA}:plugin/plugin.json" > "${rc_standard_manifest_file}"
            cmp -s "${package_manifest_file}" "${rc_package_manifest_file}"
            rc_version="$(jq -er '.version' "${rc_standard_manifest_file}")"
            [[ "v${rc_version}" == "${RC_TAG}" ]]
            [[ "$(jq -er '.name' "${rc_standard_manifest_file}")" == "grillmester" ]]
            [[ "$(jq -er '.repository' "${rc_standard_manifest_file}")" == "https://github.com/navikt/grillmester" ]]
            [[ "${rc_version%%-*}" == "${version}" && "${rc_version}" == *-* ]]
            [[ "$(jq -cS 'del(.version)' "${standard_manifest_file}")" == \
               "$(jq -cS 'del(.version)' "${rc_standard_manifest_file}")" ]]
            [[ -z "$(git diff --name-only "${RC_SOURCE_SHA}" "${SOURCE_SHA}" \
              -- plugin ':(exclude)plugin/plugin.json')" ]]
            [[ -z "$(git diff --name-only "${RC_SOURCE_SHA}" "${SOURCE_SHA}" \
              -- LICENSE PROVENANCE.md THIRD_PARTY_NOTICES.md \
                 policy/content-lock.json policy/client-artifacts.json \
                 targets/opencode-v1 profiles/opencode \
                 scripts/build_opencode_bundle.py scripts/grillmester.py \
                 scripts/generate_homebrew_formula.py \
                 scripts/manage_opencode.py \
                 scripts/compose_opencode_permissions.py scripts/release_contract.py \
                 scripts/verify_client_artifact.py scripts/smoke_plugin_install.py \
                 scripts/smoke_opencode.py scripts/smoke_opencode_runtime.py)" ]]

            stable_version_pattern="${version//./\\.}"
            [[ "$(grep -Ec "\"version\"[[:space:]]*:[[:space:]]*\"${stable_version_pattern}\"" \
              "${standard_manifest_file}")" == "1" ]]
            normalized_standard_manifest="${RUNNER_TEMP}/normalized-grillmester-plugin.json"
            sed -E \
              "0,/(\"version\"[[:space:]]*:[[:space:]]*)\"${stable_version_pattern}\"/s//\\1\"${rc_version}\"/" \
              "${standard_manifest_file}" > "${normalized_standard_manifest}"
            cmp -s "${normalized_standard_manifest}" "${rc_standard_manifest_file}"

            regenerated_rc_catalog="${RUNNER_TEMP}/regenerated-rc-marketplace.json"
            regenerate_catalog \
              "${rc_package_manifest_file}" "${rc_standard_manifest_file}" \
              "${rc_version}" "${RC_SOURCE_SHA}" "${regenerated_rc_catalog}"
            cmp -s "${regenerated_rc_catalog}" "${rc_catalog_file}"
            rc_release="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${REPOSITORY}/releases/tags/${RC_TAG}")"
            [[ "$(jq -r '.tag_name' <<<"${rc_release}")" == "${RC_TAG}" ]]
            [[ "$(jq -r '.draft' <<<"${rc_release}")" == "false" ]]
            [[ "$(jq -r '.prerelease' <<<"${rc_release}")" == "true" ]]
            [[ "$(jq -r '.immutable' <<<"${rc_release}")" == "true" ]]
            jq -e \
              --arg bundle "${RC_BUNDLE_NAME}" \
              --arg bundle_digest "sha256:${RC_BUNDLE_SHA256}" \
              --arg checksum "${RC_BUNDLE_CHECKSUM_NAME}" \
              --arg checksum_digest "sha256:${RC_BUNDLE_CHECKSUM_SHA256}" \
              --arg formula "grillmester.rb" \
              --arg formula_digest "sha256:${RC_FORMULA_SHA256}" \
              '(.assets | length) == 3 and
               ([.assets[].name] | sort) == ([$bundle, $checksum, $formula] | sort) and
               all(.assets[]; .state == "uploaded") and
               any(.assets[];
                 .name == $bundle and
                 .label == "Grillmester OpenCode bundle" and
                 .digest == $bundle_digest) and
               any(.assets[];
                 .name == $checksum and
                 .label == "SHA-256 checksum" and
                 .digest == $checksum_digest) and
               any(.assets[];
                 .name == $formula and
                 .label == "Homebrew formula" and
                 .digest == $formula_digest)' \
              <<<"${rc_release}" >/dev/null
            current_rc_assets="${RUNNER_TEMP}/current-rc-assets"
            mkdir -p "${current_rc_assets}"
            gh release download "${RC_TAG}" --repo "${REPOSITORY}" \
              --dir "${current_rc_assets}" \
              --pattern "${RC_BUNDLE_NAME}" \
              --pattern "${RC_BUNDLE_CHECKSUM_NAME}" \
              --pattern "grillmester.rb"
            [[ "$(sha256sum "${current_rc_assets}/${RC_BUNDLE_NAME}" | cut -d' ' -f1)" == \
               "${RC_BUNDLE_SHA256}" ]]
            [[ "$(sha256sum "${current_rc_assets}/${RC_BUNDLE_CHECKSUM_NAME}" | cut -d' ' -f1)" == \
               "${RC_BUNDLE_CHECKSUM_SHA256}" ]]
            [[ "$(sha256sum "${current_rc_assets}/grillmester.rb" | cut -d' ' -f1)" == \
               "${RC_FORMULA_SHA256}" ]]
            expected_rc_checksum="${RUNNER_TEMP}/expected-${RC_BUNDLE_CHECKSUM_NAME}"
            printf '%s  %s\n' \
              "${RC_BUNDLE_SHA256}" "${RC_BUNDLE_NAME}" > "${expected_rc_checksum}"
            cmp -s \
              "${expected_rc_checksum}" \
              "${current_rc_assets}/${RC_BUNDLE_CHECKSUM_NAME}"
          else
            [[ -z "${RC_TAG}" && -z "${RC_CATALOG_SHA}" && -z "${RC_SOURCE_SHA}" ]]
            [[ -z "${RC_BUNDLE_NAME}" && -z "${RC_BUNDLE_CHECKSUM_NAME}" ]]
            [[ -z "${RC_BUNDLE_SHA256}" && -z "${RC_BUNDLE_CHECKSUM_SHA256}" ]]
            [[ -z "${RC_FORMULA_SHA256}" ]]
          fi

          verify_remote_tag() {
            local object target
            git fetch --no-tags origin \
              "refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1 || return 1
            object="$(git rev-parse "refs/tags/${TAG}")"
            [[ "$(git cat-file -t "${object}")" == "tag" ]] || {
              echo "Refusing non-annotated release tag ${TAG}." >&2
              exit 1
            }
            target="$(git rev-parse "refs/tags/${TAG}^{}")"
            [[ "${target}" == "${CATALOG_SHA}" ]] || {
              echo "Refusing to move ${TAG}; it identifies another catalog." >&2
              exit 1
            }
          }
          if ! verify_remote_tag; then
            git tag -a "${TAG}" "${CATALOG_SHA}" \
              -m "Grillmester ${TAG}: catalog ${CATALOG_SHA}, source ${SOURCE_SHA}"
            if ! git push origin "refs/tags/${TAG}"; then
              git tag -d "${TAG}"
              verify_remote_tag || {
                echo "Concurrent tag creation produced another target." >&2
                exit 1
              }
            fi
          fi

          expected_prerelease="false"
          [[ "${CHANNEL}" == "rc" ]] && expected_prerelease="true"
          verify_release_metadata() {
            local expected_draft="$1"
            [[ "$(jq -r '.tag_name' <<<"${release}")" == "${TAG}" ]]
            [[ "$(jq -r '.draft' <<<"${release}")" == "${expected_draft}" ]]
            [[ "$(jq -r '.name' <<<"${release}")" == "Grillmester ${TAG}" ]]
            [[ "$(jq -r '.prerelease' <<<"${release}")" == "${expected_prerelease}" ]]
            [[ "$(jq -r '.body' <<<"${release}")" == "$(<"${notes}")" ]]
            if [[ "${expected_draft}" == "false" ]]; then
              [[ "$(jq -r '.immutable' <<<"${release}")" == "true" ]]
            fi
          }
          verify_release_asset_roster() {
            jq -e \
              --arg bundle "${BUNDLE_NAME}" \
              --arg bundle_digest "sha256:${BUNDLE_SHA256}" \
              --arg checksum "${BUNDLE_CHECKSUM_NAME}" \
              --arg checksum_digest "sha256:$(sha256sum "${checksum}" | cut -d' ' -f1)" \
              --arg formula "${FORMULA_NAME}" \
              --arg formula_digest "sha256:${FORMULA_SHA256}" \
              '(.assets | length) == 3 and
               ([.assets[].name] | sort) == ([$bundle, $checksum, $formula] | sort) and
               all(.assets[]; .state == "uploaded") and
               any(.assets[]; .name == $bundle and
                 .label == "Grillmester OpenCode bundle" and .digest == $bundle_digest) and
               any(.assets[]; .name == $checksum and
                 .label == "SHA-256 checksum" and .digest == $checksum_digest) and
               any(.assets[]; .name == $formula and
                 .label == "Homebrew formula" and .digest == $formula_digest)' \
              <<<"${release}" >/dev/null
          }
          find_release() {
            local pages
            pages="$(gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${REPOSITORY}/releases?per_page=100")" || return 10
            jq -cer \
              --arg tag "${TAG}" \
              '[.[][] | select(.tag_name == $tag)] |
               if length == 0 then empty
               elif length == 1 then .[0]
               else error("multiple releases use the requested tag")
               end' \
              <<<"${pages}"
          }
          download_asset_from_release() {
            local name="$1" destination="$2" asset_id
            asset_id="$(jq -er --arg name "${name}" \
              '.assets[] | select(.name == $name) | .id' <<<"${release}")"
            [[ "${asset_id}" =~ ^[1-9][0-9]*$ ]]
            gh api \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/releases/assets/${asset_id}" \
              > "${destination}"
          }

          release_already_published="false"
          release_lookup_status=0
          release="$(find_release)" || release_lookup_status=$?
          if [[ "${release_lookup_status}" == "0" ]]; then
            [[ "$(jq -r '.draft' <<<"${release}")" != "false" ]] || \
              release_already_published="true"
          elif [[ "${release_lookup_status}" == "4" ]]; then
            create_args=(
              release create "${TAG}" --verify-tag --draft --latest=false
              --title "Grillmester ${TAG}" --notes-file "${notes}"
            )
            [[ "${CHANNEL}" == "rc" ]] && create_args+=(--prerelease)
            gh "${create_args[@]}"
            release="$(find_release)"
          else
            echo "Could not unambiguously inspect an existing release for ${TAG}." >&2
            exit 1
          fi

          if [[ "${release_already_published}" == "false" ]]; then
            verify_release_metadata "true"
            jq -e \
              --arg bundle "${BUNDLE_NAME}" \
              --arg checksum "${BUNDLE_CHECKSUM_NAME}" \
              --arg formula "${FORMULA_NAME}" \
              '([.assets[].name] | unique | length) == (.assets | length) and
               all(.assets[];
                 .name == $bundle or .name == $checksum or .name == $formula)' \
              <<<"${release}" >/dev/null
            gh release upload "${TAG}" --repo "${REPOSITORY}" --clobber \
              "${bundle}#Grillmester OpenCode bundle" \
              "${checksum}#SHA-256 checksum" \
              "${formula}#Homebrew formula"
            release="$(find_release)"
            verify_release_metadata "true"
            verify_release_asset_roster

            staged_assets="${RUNNER_TEMP}/staged-release-assets"
            mkdir -p "${staged_assets}"
            download_asset_from_release \
              "${BUNDLE_NAME}" "${staged_assets}/${BUNDLE_NAME}"
            download_asset_from_release \
              "${BUNDLE_CHECKSUM_NAME}" "${staged_assets}/${BUNDLE_CHECKSUM_NAME}"
            download_asset_from_release \
              "${FORMULA_NAME}" "${staged_assets}/${FORMULA_NAME}"
            cmp -s "${bundle}" "${staged_assets}/${BUNDLE_NAME}"
            cmp -s "${checksum}" "${staged_assets}/${BUNDLE_CHECKSUM_NAME}"
            cmp -s "${formula}" "${staged_assets}/${FORMULA_NAME}"

            publish_args=(
              release edit "${TAG}" --verify-tag --draft=false
              --title "Grillmester ${TAG}" --notes-file "${notes}"
            )
            if [[ "${CHANNEL}" == "rc" ]]; then
              publish_args+=(--prerelease=true --latest=false)
            else
              publish_args+=(--prerelease=false --latest)
            fi
            gh "${publish_args[@]}"
            release="$(find_release)"
          fi

          verify_release_metadata "false"
          verify_release_asset_roster
          published_assets="${RUNNER_TEMP}/published-assets"
          mkdir -p "${published_assets}"
          download_asset_from_release \
            "${BUNDLE_NAME}" "${published_assets}/${BUNDLE_NAME}"
          download_asset_from_release \
            "${BUNDLE_CHECKSUM_NAME}" "${published_assets}/${BUNDLE_CHECKSUM_NAME}"
          download_asset_from_release \
            "${FORMULA_NAME}" "${published_assets}/${FORMULA_NAME}"
          cmp -s "${bundle}" "${published_assets}/${BUNDLE_NAME}"
          cmp -s "${checksum}" "${published_assets}/${BUNDLE_CHECKSUM_NAME}"
          cmp -s "${formula}" "${published_assets}/${FORMULA_NAME}"
          [[ "$(sha256sum "${published_assets}/${BUNDLE_NAME}" | cut -d' ' -f1)" == \
             "${BUNDLE_SHA256}" ]]
          if [[ "${release_already_published}" == "true" ]]; then
            echo "Release ${TAG} and its sealed OpenCode assets already exist exactly; no-op."
          else
            echo "Published ${TAG} with sealed OpenCode archive ${BUNDLE_NAME}."
          fi

  remote-smoke:
    needs:
      - validate
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUNDLE_CHECKSUM_NAME: ${{ needs.validate.outputs.bundle-checksum-name }}
      BUNDLE_NAME: ${{ needs.validate.outputs.bundle-name }}
      BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
      CATALOG_SHA: ${{ needs.validate.outputs.catalog-sha }}
      SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
      TAG: ${{ needs.validate.outputs.tag }}
      FORMULA_NAME: ${{ needs.validate.outputs.formula-name }}
      FORMULA_SHA256: ${{ needs.validate.outputs.formula-sha256 }}
    steps:
      - name: Check out trusted smoke tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.main-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the published tag to catalog and source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CATALOG_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TAG}" =~ ^v[0-9A-Za-z.-]+$ ]]
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/marketplace:refs/remotes/origin/marketplace" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          [[ "$(git cat-file -t "refs/tags/${TAG}")" == "tag" ]]
          [[ "${CATALOG_SHA}" == "$(git rev-parse "refs/tags/${TAG}^{}")" ]]
          git merge-base --is-ancestor \
            "${CATALOG_SHA}" refs/remotes/origin/marketplace
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main

          catalog_root="${RUNNER_TEMP}/catalog"
          source_root="${RUNNER_TEMP}/source"
          git worktree add --detach "${catalog_root}" "${CATALOG_SHA}"
          git worktree add --detach "${source_root}" "${SOURCE_SHA}"
          {
            echo "CATALOG_PATH=${catalog_root}/.github/plugin/marketplace.json"
            echo "SOURCE_ROOT=${source_root}"
          } >> "${GITHUB_ENV}"

      - name: Download, verify, safely extract, and install OpenCode asset
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${BUNDLE_NAME}" == "grillmester-opencode-${TAG}.tar.gz" ]]
          [[ "${BUNDLE_NAME}" =~ ^grillmester-opencode-v[0-9A-Za-z.-]+\.tar\.gz$ ]]
          [[ "${BUNDLE_CHECKSUM_NAME}" == "${BUNDLE_NAME}.sha256" ]]
          [[ "${FORMULA_NAME}" == "grillmester.rb" ]]
          [[ "${FORMULA_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          download_root="${RUNNER_TEMP}/opencode-download"
          extract_root="${RUNNER_TEMP}/opencode-extract"
          install_home="${RUNNER_TEMP}/opencode-install"
          mkdir -p "${download_root}" "${extract_root}"
          bundle="${download_root}/${BUNDLE_NAME}"
          checksum="${download_root}/${BUNDLE_CHECKSUM_NAME}"
          formula="${download_root}/${FORMULA_NAME}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 61000000 \
            "${release_url}/${BUNDLE_NAME}" --output "${bundle}"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 1024 \
            "${release_url}/${BUNDLE_CHECKSUM_NAME}" --output "${checksum}"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 100000 \
            "${release_url}/${FORMULA_NAME}" --output "${formula}"
          expected_checksum="${download_root}/expected.sha256"
          printf '%s  %s\n' \
            "${BUNDLE_SHA256}" "${BUNDLE_NAME}" > "${expected_checksum}"
          cmp -s "${expected_checksum}" "${checksum}"
          (cd "${download_root}" && \
            sha256sum --check --strict "${BUNDLE_CHECKSUM_NAME}")
          [[ "$(sha256sum "${formula}" | cut -d' ' -f1)" == "${FORMULA_SHA256}" ]]
          expected_formula="${download_root}/expected-grillmester.rb"
          python3 "${SOURCE_ROOT}/scripts/generate_homebrew_formula.py" \
            --tag "${TAG}" --bundle-name "${BUNDLE_NAME}" \
            --bundle-sha256 "${BUNDLE_SHA256}" \
            --client-artifacts "${SOURCE_ROOT}/policy/client-artifacts.json" \
            --output "${expected_formula}"
          ruby -c "${formula}"
          cmp -s "${expected_formula}" "${formula}"

          python3 - "${bundle}" "${extract_root}" "${SOURCE_SHA}" <<'PY'
          import hashlib
          import json
          import shutil
          import stat
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          archive_path = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          expected_source = sys.argv[3]
          archive_root = PurePosixPath("grillmester-opencode-v1")

          def duplicate_keys(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit(f"duplicate manifest key: {key!r}")
                  value[key] = item
              return value

          with tarfile.open(archive_path, mode="r:gz") as archive:
              if archive.pax_headers:
                  raise SystemExit("archive must not use global PAX headers")
              members = archive.getmembers()
              if not members or len(members) > 10000:
                  raise SystemExit("archive member count is invalid")
              seen = set()
              total_size = 0
              normalized = []
              for member in members:
                  raw = member.name[:-1] if member.isdir() and member.name.endswith("/") else member.name
                  if "\\" in raw or any(
                      ord(character) < 32 or ord(character) == 127
                      for character in raw
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
                  relative = PurePosixPath(raw)
                  if (
                      relative.is_absolute()
                      or relative.as_posix() != raw
                      or not relative.parts
                      or relative.parts[0] != archive_root.as_posix()
                      or any(part in ("", ".", "..") for part in relative.parts)
                  ):
                      raise SystemExit(f"unsafe archive path: {member.name!r}")
                  if relative in seen:
                      raise SystemExit(f"duplicate archive path: {relative}")
                  seen.add(relative)
                  if member.pax_headers or member.uid != 0 or member.gid != 0 or member.mtime != 0:
                      raise SystemExit(f"non-canonical archive metadata: {relative}")
                  mode = stat.S_IMODE(member.mode)
                  if member.isdir():
                      if mode != 0o755 or member.size != 0:
                          raise SystemExit(f"invalid directory metadata: {relative}")
                  elif member.isreg():
                      if mode not in (0o644, 0o755) or member.size > 5_000_000:
                          raise SystemExit(f"invalid file metadata: {relative}")
                      total_size += member.size
                      if total_size > 50_000_000:
                          raise SystemExit("archive expands beyond the safety limit")
                  else:
                      raise SystemExit(f"links and special archive nodes are forbidden: {relative}")
                  normalized.append((relative, member))
              member_by_path = dict(normalized)
              if archive_root not in member_by_path or not member_by_path[archive_root].isdir():
                  raise SystemExit("archive root directory is missing")

              destination_resolved = destination.resolve()
              for relative, member in sorted(normalized, key=lambda item: (len(item[0].parts), str(item[0]))):
                  target = destination.joinpath(*relative.parts)
                  if not target.resolve().is_relative_to(destination_resolved):
                      raise SystemExit(f"archive member escapes extraction root: {relative}")
                  if member.isdir():
                      target.mkdir(mode=0o755, exist_ok=True)
                  else:
                      target.parent.mkdir(mode=0o755, parents=True, exist_ok=True)
                      source = archive.extractfile(member)
                      if source is None:
                          raise SystemExit(f"cannot read archive member: {relative}")
                      with source, target.open("xb") as output:
                          shutil.copyfileobj(source, output)
                      target.chmod(stat.S_IMODE(member.mode))

          bundle_root = destination / archive_root.as_posix()
          manifest_path = bundle_root / "DISTRIBUTION-MANIFEST.json"
          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8"),
              object_pairs_hook=duplicate_keys,
          )
          required_keys = {
              "schemaVersion", "sourceSha", "target", "opencodeVersion",
              "cpltRelease", "targetManifestSha256", "files",
          }
          if not isinstance(manifest, dict) or set(manifest) != required_keys:
              raise SystemExit("distribution manifest shape is invalid")
          if manifest["schemaVersion"] != 1 or manifest["sourceSha"] != expected_source:
              raise SystemExit("distribution manifest provenance does not match the release")
          if (
              manifest["target"] != "opencode-v1"
              or manifest["opencodeVersion"] != "1.18.20"
              or manifest["cpltRelease"] != "2026.08.17-062831-1008a92"
          ):
              raise SystemExit("distribution manifest client contract is invalid")
          declared = manifest["files"]
          if not isinstance(declared, dict) or not declared:
              raise SystemExit("distribution manifest file inventory is invalid")
          actual = {}
          for path in sorted(bundle_root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"extracted bundle contains a symlink: {path}")
              if not path.is_file() or path == manifest_path:
                  continue
              relative = path.relative_to(bundle_root).as_posix()
              actual[relative] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "mode": f"{stat.S_IMODE(path.stat().st_mode):04o}",
              }
          if actual != declared:
              raise SystemExit("extracted files do not match the distribution manifest")
          target_manifest = bundle_root / "targets/opencode-v1/manifest.json"
          if hashlib.sha256(target_manifest.read_bytes()).hexdigest() != manifest["targetManifestSha256"]:
              raise SystemExit("target manifest digest does not match distribution manifest")
          PY

          bundle_root="${extract_root}/grillmester-opencode-v1"
          python3 -I -S "${bundle_root}/scripts/manage_opencode.py" install \
            --source "${bundle_root}" \
            --home "${install_home}"
          jq -e '
            .schemaVersion == 1 and
            (.active | type == "string" and test("^[0-9a-f]{64}$")) and
            (.previous == null or (.previous | test("^[0-9a-f]{64}$")))
          ' "${install_home}/state.json" >/dev/null
          active="$(jq -er '.active' "${install_home}/state.json")"
          test -d "${install_home}/releases/${active}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test published release tag
        run: >-
          python3 scripts/smoke_plugin_install.py
          --catalog "${CATALOG_PATH}"
          --source-root "${SOURCE_ROOT}"
          --source-sha "${SOURCE_SHA}"
          --expect-release-sha "${SOURCE_SHA}"
          --remote-marketplace-ref "navikt/grillmester#${TAG}"
