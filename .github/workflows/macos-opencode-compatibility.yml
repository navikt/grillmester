name: Verify release-test terminal clients on macOS

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact Grillmester source commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-live-compatibility:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out exact immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load the executable release-test baseline
        shell: bash
        run: python3 -I -S scripts/release_test_baseline.py github-env >> "${GITHUB_ENV}"

      - name: Install and independently verify native Darwin release-test clients
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]

          machine="$(uname -m)"
          case "${machine}" in
            arm64|x86_64) ;;
            *)
              echo "Unsupported macOS runner architecture: ${machine}" >&2
              exit 1
              ;;
          esac

          verified_bin="${RUNNER_TEMP}/verified-darwin-bin"
          mkdir -m 700 "${verified_bin}"
          for client in opencode cplt copilot; do
            python3 -I -S scripts/release_test_baseline.py install \
              --client "${client}" --platform darwin --architecture "${machine}" \
              --output "${verified_bin}/${client}"
          done

          opencode_binary_sha256="$(python3 -I -S scripts/release_test_baseline.py field \
            --client opencode --platform darwin --architecture "${machine}" \
            --name executableSha256)"
          cplt_binary_sha256="$(python3 -I -S scripts/release_test_baseline.py field \
            --client cplt --platform darwin --architecture "${machine}" \
            --name executableSha256)"
          copilot_binary_sha256="$(python3 -I -S scripts/release_test_baseline.py field \
            --client copilot --platform darwin --architecture "${machine}" \
            --name executableSha256)"

          for client in opencode cplt copilot; do
            [[ "$(stat -f '%Lp:%u' "${verified_bin}/${client}")" == "555:$(id -u)" ]]
          done
          [[ "$(shasum -a 256 "${verified_bin}/opencode" | cut -d' ' -f1)" == \
             "${opencode_binary_sha256}" ]]
          [[ "$(shasum -a 256 "${verified_bin}/cplt" | cut -d' ' -f1)" == \
             "${cplt_binary_sha256}" ]]
          [[ "$(shasum -a 256 "${verified_bin}/copilot" | cut -d' ' -f1)" == \
             "${copilot_binary_sha256}" ]]

          # These are the first client executions in this job.
          [[ "$("${verified_bin}/opencode" --version)" == "${RELEASE_TEST_OPENCODE_VERSION}" ]]
          [[ "$("${verified_bin}/cplt" --version)" == \
             "cplt ${RELEASE_TEST_CPLT_RELEASE}" ]]
          [[ "$("${verified_bin}/copilot" --version)" == \
             "GitHub Copilot CLI ${RELEASE_TEST_COPILOT_VERSION}." ]]
          {
            echo "OPENCODE_BIN=${verified_bin}/opencode"
            echo "CPLT_BIN=${verified_bin}/cplt"
            echo "COPILOT_BIN=${verified_bin}/copilot"
            echo "OPENCODE_BINARY_SHA256=${opencode_binary_sha256}"
            echo "CPLT_BINARY_SHA256=${cplt_binary_sha256}"
            echo "COPILOT_BINARY_SHA256=${copilot_binary_sha256}"
          } >> "${GITHUB_ENV}"

      - name: Download and verify ripgrep for the local OpenCode smoke
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          case "${machine}" in
            arm64)
              ripgrep_platform="aarch64-apple-darwin"
              ripgrep_archive_size=1787248
              ripgrep_archive_sha256="24ad76777745fbff131c8fbc466742b011f925bfa4fffa2ded6def23b5b937be"
              ripgrep_binary_size=4375216
              ripgrep_binary_sha256="0e0cb83f5195f1f51bb8feef1fff5b0b171e82bd1db6bd35deee701a3e7102f8"
              ;;
            x86_64)
              ripgrep_platform="x86_64-apple-darwin"
              ripgrep_archive_size=2082672
              ripgrep_archive_sha256="fc87e78f7cb3fea12d69072e7ef3b215""09754717b746368fd40d88963630e2b3"
              ripgrep_binary_size=5162504
              ripgrep_binary_sha256="923dcc25cab57d33f4e7dd0476d4b74a554401a38817e246a8d6101dcd51c50f"
              ;;
            *)
              echo "Unsupported macOS runner architecture: ${machine}" >&2
              exit 1
              ;;
          esac
          ripgrep_root="ripgrep-14.1.1-${ripgrep_platform}"
          ripgrep_url="https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/${ripgrep_root}.tar.gz"
          downloads="${RUNNER_TEMP}/darwin-client-archives"
          mkdir -m 700 "${downloads}"
          archive="${downloads}/ripgrep.tar.gz"
          destination="${RUNNER_TEMP}/verified-darwin-bin/rg"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 3000000 --output "${archive}" "${ripgrep_url}"
          python3 -I -S - \
            "${archive}" "${ripgrep_archive_size}" "${ripgrep_archive_sha256}" \
            "${ripgrep_root}" "${ripgrep_binary_size}" \
            "${ripgrep_binary_sha256}" "${destination}" <<'PY'
          import hashlib
          import io
          import os
          import stat
          import sys
          import tarfile
          from pathlib import Path

          (
              archive,
              archive_size,
              archive_sha256,
              root,
              binary_size,
              binary_sha256,
              destination,
          ) = sys.argv[1:]
          archive_size_value = int(archive_size)
          binary_size_value = int(binary_size)
          expected_roster = [
              root,
              f"{root}/complete",
              f"{root}/rg",
              f"{root}/README.md",
              f"{root}/COPYING",
              f"{root}/UNLICENSE",
              f"{root}/doc",
              f"{root}/LICENSE-MIT",
              f"{root}/doc/CHANGELOG.md",
              f"{root}/doc/FAQ.md",
              f"{root}/doc/GUIDE.md",
              f"{root}/doc/rg.1",
              f"{root}/complete/_rg.ps1",
              f"{root}/complete/rg.fish",
              f"{root}/complete/_rg",
              f"{root}/complete/rg.bash",
          ]
          expected_directories = {root, f"{root}/complete", f"{root}/doc"}
          archive_path = Path(archive)
          flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
          descriptor = os.open(archive_path, flags)
          try:
              observed = os.fstat(descriptor)
              if not stat.S_ISREG(observed.st_mode) or observed.st_size != archive_size_value:
                  raise SystemExit("ripgrep archive size or type differs")
              with os.fdopen(descriptor, "rb", closefd=False) as stream:
                  content = stream.read(archive_size_value + 1)
          finally:
              os.close(descriptor)
          if len(content) != archive_size_value:
              raise SystemExit("ripgrep archive changed while reading")
          if hashlib.sha256(content).hexdigest() != archive_sha256:
              raise SystemExit("ripgrep archive digest differs")

          with tarfile.open(fileobj=io.BytesIO(content), mode="r:gz") as package:
              if package.pax_headers:
                  raise SystemExit("ripgrep archive has global PAX headers")
              members = package.getmembers()
              if [member.name for member in members] != expected_roster:
                  raise SystemExit("ripgrep archive roster differs")
              selected = None
              for member in members:
                  expected_type = (
                      tarfile.DIRTYPE
                      if member.name in expected_directories
                      else tarfile.REGTYPE
                  )
                  if (
                      member.type != expected_type
                      or member.pax_headers
                      or member.linkname
                      or member.devmajor != 0
                      or member.devminor != 0
                      or member.sparse is not None
                  ):
                      raise SystemExit("ripgrep archive contains a link or special member")
                  if member.name == f"{root}/rg":
                      selected = member
              if selected is None or selected.size != binary_size_value:
                  raise SystemExit("ripgrep executable size differs")
              extracted = package.extractfile(selected)
              if extracted is None:
                  raise SystemExit("ripgrep executable could not be read")
              executable = extracted.read(binary_size_value + 1)
          if len(executable) != binary_size_value:
              raise SystemExit("ripgrep executable changed while reading")
          if hashlib.sha256(executable).hexdigest() != binary_sha256:
              raise SystemExit("ripgrep executable digest differs")

          output_flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_CLOEXEC", 0)
          output = os.open(destination, output_flags, 0o500)
          try:
              with os.fdopen(output, "wb", closefd=False) as target:
                  target.write(executable)
                  target.flush()
                  os.fsync(output)
              os.fchmod(output, 0o555)
          finally:
              os.close(output)
          PY
          [[ "$(stat -f '%Lp:%u' "${destination}")" == "555:$(id -u)" ]]
          [[ "$(shasum -a 256 "${destination}" | cut -d' ' -f1)" == \
             "${ripgrep_binary_sha256}" ]]
          {
            echo "RIPGREP_BIN=${destination}"
            echo "RIPGREP_BINARY_SHA256=${ripgrep_binary_sha256}"
          } >> "${GITHUB_ENV}"

      - name: Prove strict native OpenCode Copilot-provider network policy without auth
        shell: bash
        run: |
          set -euo pipefail
          policy="${RUNNER_TEMP}/native-opencode-copilot-policy"
          mkdir -m 700 "${policy}"
          : > "${policy}/cplt-config.toml"
          printf '%s\n' \
            githubcopilot.com \
            api.github.com \
            github.com \
            copilot-proxy.githubusercontent.com \
            actions.githubusercontent.com \
            default.exp2.cds.s9ch.io \
            > "${policy}/allowed-domains.txt"
          chmod 0400 "${policy}/cplt-config.toml" "${policy}/allowed-domains.txt"

          policy_command=(
            "${CPLT_BIN}"
            --agent opencode
            --preset strict
            --no-scratch-dir
            --allowed-domains "${policy}/allowed-domains.txt"
          )
          expectations=(
            "github.com:443" "allowed"
            "api.githubcopilot.com:443" "allowed"
            "exfiltration.invalid:443" "blocked"
          )
          for ((index = 0; index < ${#expectations[@]}; index += 2)); do
            target="${expectations[index]}"
            decision="${expectations[index + 1]}"
            result="${policy}/result-${index}.json"
            CPLT_CONFIG="${policy}/cplt-config.toml" \
              "${policy_command[@]}" check net --no-connect --json "${target}" \
              > "${result}"
            jq -e --arg target "${target}" --arg decision "${decision}" '
              .agent == "OpenCode" and .preset == "strict" and
              .battery == false and (.items | length) == 1 and
              .items[0].category == "network" and
              .items[0].target == $target and
              .items[0].decision == $decision
            ' "${result}" >/dev/null
          done

      - name: Run native Darwin discovery and deterministic runtime smokes
        shell: bash
        env:
          PATH: ${{ runner.temp }}/verified-darwin-bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          [[ "$(stat -f '%Lp:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -f '%Lp:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          [[ "$(shasum -a 256 "${OPENCODE_BIN}" | cut -d' ' -f1)" == \
             "${OPENCODE_BINARY_SHA256}" ]]
          [[ "$(shasum -a 256 "${CPLT_BIN}" | cut -d' ' -f1)" == \
             "${CPLT_BINARY_SHA256}" ]]
          [[ "$(shasum -a 256 "${RIPGREP_BIN}" | cut -d' ' -f1)" == \
             "${RIPGREP_BINARY_SHA256}" ]]
          python3 -I -S scripts/smoke_opencode.py \
            --require-binary --opencode "${OPENCODE_BIN}"
          python3 -I -S scripts/smoke_opencode_runtime.py \
            --require-binary --opencode "${OPENCODE_BIN}" --cplt "${CPLT_BIN}"

      - name: Build and extract the exact distributable bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/macos-opencode-bundle.tar.gz"
          repeated="${RUNNER_TEMP}/macos-opencode-bundle-repeated.tar.gz"
          python3 -I -S scripts/generate_copilot_manifest.py --check
          python3 -I -S scripts/generate_context_projections.py --check
          python3 -I -S scripts/build_opencode_bundle.py \
            --source-root "${GITHUB_WORKSPACE}" --source-sha "${SOURCE_SHA}" \
            --output "${bundle}"
          python3 -I -S scripts/build_opencode_bundle.py \
            --source-root "${GITHUB_WORKSPACE}" --source-sha "${SOURCE_SHA}" \
            --output "${repeated}"
          cmp -s "${bundle}" "${repeated}"

          extraction="${RUNNER_TEMP}/macos-bundle-extraction"
          mkdir -m 700 "${extraction}"
          python3 -I -S - "${bundle}" "${extraction}" <<'PY'
          import os
          import stat
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          root = Path(sys.argv[2]).resolve(strict=True)
          directories: list[tuple[Path, int]] = []
          with tarfile.open(archive, mode="r:gz") as bundle:
              members = bundle.getmembers()
              if not members or len(members) > 10_000 or bundle.pax_headers:
                  raise SystemExit("bundle has an invalid member roster")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or any(part in ("", ".", "..") for part in path.parts)
                      or not path.parts
                      or path.parts[0] != "grillmester-terminal-v1"
                      or member.pax_headers
                  ):
                      raise SystemExit(f"unsafe bundle path: {member.name!r}")
                  destination = root.joinpath(*path.parts)
                  if (
                      member.linkname
                      or member.devmajor != 0
                      or member.devminor != 0
                      or member.sparse is not None
                  ):
                      raise SystemExit(f"unsafe bundle member: {member.name!r}")
                  if member.type == tarfile.DIRTYPE:
                      destination.mkdir(mode=0o700, exist_ok=False)
                      directories.append((destination, stat.S_IMODE(member.mode)))
                      continue
                  if member.type != tarfile.REGTYPE or member.size > 5_000_000:
                      raise SystemExit(f"unsafe bundle member: {member.name!r}")
                  extracted = bundle.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"cannot read bundle member: {member.name!r}")
                  content = extracted.read(member.size + 1)
                  if len(content) != member.size:
                      raise SystemExit(f"bundle member size changed: {member.name!r}")
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
                  descriptor = os.open(destination, flags, 0o400)
                  try:
                      with os.fdopen(descriptor, "wb", closefd=False) as output:
                          output.write(content)
                          output.flush()
                          os.fsync(descriptor)
                      os.fchmod(descriptor, stat.S_IMODE(member.mode))
                  finally:
                      os.close(descriptor)
          for directory, mode in reversed(directories):
              directory.chmod(mode)
          PY
          bundle_root="${extraction}/grillmester-terminal-v1"
          [[ -f "${bundle_root}/DISTRIBUTION-MANIFEST.json" ]]
          {
            echo "BUNDLE_ARCHIVE=${bundle}"
            echo "BUNDLE_ROOT=${bundle_root}"
          } >> "${GITHUB_ENV}"

      - name: Prove cplt policy and host-local socket semantics
        shell: bash
        env:
          PATH: ${{ runner.temp }}/verified-darwin-bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          [[ "$(shasum -a 256 "${CPLT_BIN}" | cut -d' ' -f1)" == \
             "${CPLT_BINARY_SHA256}" ]]
          project="${RUNNER_TEMP}/empty-consumer"
          policy="${RUNNER_TEMP}/cplt-loopback-policy"
          mkdir -m 700 "${project}" "${policy}"
          git -C "${project}" init --quiet
          : > "${policy}/cplt-config.toml"
          printf '%s\n' 'grillmester-policy-test.invalid' > "${policy}/allowed-domains.txt"
          printf '%s\n' \
            registry.npmjs.org registry.yarnpkg.com repo.maven.apache.org \
            plugins.gradle.org crates.io static.crates.io pypi.org \
            files.pythonhosted.org opencode.ai models.dev \
            grillmester-policy-test.invalid > "${policy}/blocked-domains.txt"
          chmod 0400 "${policy}"/*

          listener_info="${RUNNER_TEMP}/listener-port"
          python3 -I -S - "${listener_info}" <<'PY' &
          import socket
          import sys
          from pathlib import Path

          server = socket.socket()
          server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          server.bind(("0.0.0.0", 0))
          server.listen(16)
          Path(sys.argv[1]).write_text(f"{server.getsockname()[1]}\n", encoding="ascii")
          while True:
              connection, _address = server.accept()
              connection.close()
          PY
          listener_pid=$!
          trap 'kill "${listener_pid}" 2>/dev/null || true' EXIT
          for _attempt in {1..100}; do
            [[ -s "${listener_info}" ]] && break
            sleep 0.1
          done
          [[ -s "${listener_info}" ]]
          listener_port="$(<"${listener_info}")"
          [[ "${listener_port}" =~ ^[1-9][0-9]{1,4}$ ]]

          policy_command=(
            "${CPLT_BIN}"
            --yes --scratch-dir --deny-clipboard --no-audit --no-quiet
            --agent opencode --project-dir "${project}" --preset strict
            --with-proxy --proxy-forced --default-allowlist
            --gh-guard --git-guard --no-allow-localhost-any
            --no-allow-env-files --no-allow-tmp-exec --no-allow-docker
            --no-allow-lifecycle-scripts
            --allow-localhost "${listener_port}"
            --allowed-domains "${policy}/allowed-domains.txt"
            --blocked-domains "${policy}/blocked-domains.txt"
          )

          battery="${RUNNER_TEMP}/cplt-check-battery.json"
          check_status=0
          CPLT_CONFIG="${policy}/cplt-config.toml" \
            "${policy_command[@]}" check --json > "${battery}" || check_status=$?
          # This release-test policy deliberately blocks OpenCode's normal
          # allowed domains. Inspect every probe and require that single
          # intentional mismatch instead of trusting exit 0.
          [[ "${check_status}" == "1" ]]
          jq -e '
            .platform == "macos (Seatbelt)" and .battery == true and .enforcing == false and
            (.items | length) == 7 and .verified == 4 and
            ([.items[] | select(.category == "filesystem")] | length) == 4 and
            ([.items[] | select(.category == "exec")] | length) == 1 and
            ([.items[] | select(.category == "network")] | length) == 2 and
            all(.items[]; .expected != null) and
            all(.items[] | select((.category == "filesystem" or .category == "exec") and .expected != null);
                .decision == .expected) and
            any(.items[]; .category == "network" and .target == "opencode.ai:443" and
                .expected == "allowed" and .decision == "blocked") and
            any(.items[]; .category == "network" and .target == "169.254.169.254:443" and
                .expected == "blocked" and .decision == "blocked")
          ' "${battery}" >/dev/null

          allowed="${RUNNER_TEMP}/cplt-check-allowed.json"
          CPLT_CONFIG="${policy}/cplt-config.toml" \
            "${policy_command[@]}" check --json net \
            "127.0.0.1:${listener_port}" --no-connect > "${allowed}"
          jq -e --arg target "127.0.0.1:${listener_port}" '
            .platform == "macos (Seatbelt)" and .battery == false and
            (.items | length) == 1 and .items[0].target == $target and
            .items[0].decision == "allowed"
          ' "${allowed}" >/dev/null

          blocked="${RUNNER_TEMP}/cplt-check-blocked.json"
          CPLT_CONFIG="${policy}/cplt-config.toml" \
            "${policy_command[@]}" check --json net opencode.ai:443 \
            --no-connect > "${blocked}"
          jq -e '
            .platform == "macos (Seatbelt)" and .battery == false and
            (.items | length) == 1 and .items[0].target == "opencode.ai:443" and
            .items[0].decision == "blocked"
          ' "${blocked}" >/dev/null

          CPLT_CONFIG="${policy}/cplt-config.toml" \
            "${policy_command[@]}" exec -- \
            /usr/bin/nc -z -G 2 127.0.0.1 "${listener_port}"
          runner_ip="$(/sbin/ifconfig | awk '$1 == "inet" && $2 !~ /^127\./ {print $2; exit}')"
          python3 -I -S - "${runner_ip}" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.is_loopback or address.is_unspecified:
              raise SystemExit("no non-loopback runner address was found")
          PY
          # Seatbelt's `localhost` selector covers every address assigned to
          # this Mac, not only 127.0.0.1. This probe records the pinned cplt
          # semantics independently of the Grillmester launcher.
          CPLT_CONFIG="${policy}/cplt-config.toml" \
            "${policy_command[@]}" exec -- \
            /usr/bin/nc -z -G 2 "${runner_ip}" "${listener_port}"

          remote_same_port="198.51.100.1:${listener_port}"
          remote_result="${RUNNER_TEMP}/cplt-check-remote-same-port.json"
          CPLT_CONFIG="${policy}/cplt-config.toml" \
            "${policy_command[@]}" check --json net \
            "${remote_same_port}" --no-connect > "${remote_result}"
          jq -e --arg target "${remote_same_port}" '
            .platform == "macos (Seatbelt)" and .battery == false and
            (.items | length) == 1 and .items[0].target == $target and
            .items[0].decision == "blocked"
          ' "${remote_result}" >/dev/null
          {
            echo "MACOS_CONSUMER=${project}"
          } >> "${GITHUB_ENV}"

      - name: Exercise every local-model context through the exact cplt clients
        shell: bash
        env:
          PATH: ${{ runner.temp }}/verified-darwin-bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          [[ "$(shasum -a 256 "${COPILOT_BIN}" | cut -d' ' -f1)" == \
             "${COPILOT_BINARY_SHA256}" ]]
          [[ "$(shasum -a 256 "${OPENCODE_BIN}" | cut -d' ' -f1)" == \
             "${OPENCODE_BINARY_SHA256}" ]]
          [[ "$(shasum -a 256 "${CPLT_BIN}" | cut -d' ' -f1)" == \
             "${CPLT_BINARY_SHA256}" ]]
          [[ "$(shasum -a 256 "${RIPGREP_BIN}" | cut -d' ' -f1)" == \
             "${RIPGREP_BINARY_SHA256}" ]]
          smoke_home="${RUNNER_TEMP}/grillmester-local-smoke-home"
          mkdir -m 700 "${smoke_home}"
          HOME="${smoke_home}" \
          XDG_CONFIG_HOME="${smoke_home}/config" \
          XDG_CACHE_HOME="${smoke_home}/cache" \
          XDG_DATA_HOME="${smoke_home}/data" \
          XDG_STATE_HOME="${smoke_home}/state" \
            python3 -I -S scripts/smoke_grillmester_local.py \
              --distribution-root "${BUNDLE_ROOT}" \
              --require-binaries \
              --cplt "${CPLT_BIN}" \
              --opencode "${OPENCODE_BIN}" \
              --copilot "${COPILOT_BIN}" \
              --ripgrep "${RIPGREP_BIN}" \
              --timeout 90

      - name: Exercise focused and full Copilot through exact cplt and loopback BYOK
        shell: bash
        env:
          PATH: ${{ runner.temp }}/verified-darwin-bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          umask 077
          [[ "$(shasum -a 256 "${COPILOT_BIN}" | cut -d' ' -f1)" == \
             "${COPILOT_BINARY_SHA256}" ]]
          [[ "$(shasum -a 256 "${CPLT_BIN}" | cut -d' ' -f1)" == \
             "${CPLT_BINARY_SHA256}" ]]
          provider_root="$(mktemp -d "${RUNNER_TEMP}/copilot-provider.XXXXXX")"
          provider_info="${provider_root}/port"
          provider_log="${provider_root}/requests.jsonl"
          provider_stderr="${provider_root}/stderr.log"
          python3 -I -S - "${provider_info}" "${provider_log}" \
            2>"${provider_stderr}" <<'PY' &
          import json
          import os
          import sys
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path
          from urllib.parse import urlsplit

          port_file = Path(sys.argv[1])
          request_log = Path(sys.argv[2])
          model = "ci-grillmester-local"
          answer = "GRILLMESTER_LOCAL_GATE_OK"

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"

              def log_message(self, _format, *_arguments):
                  return

              def json_response(self, status, value):
                  content = json.dumps(value, separators=(",", ":")).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(content)))
                  self.end_headers()
                  self.wfile.write(content)

              def do_GET(self):
                  if urlsplit(self.path).path.rstrip("/") != "/v1/models":
                      self.json_response(404, {"error": "not found"})
                      return
                  self.json_response(
                      200,
                      {"object": "list", "data": [{"id": model, "object": "model"}]},
                  )

              def do_POST(self):
                  path = urlsplit(self.path).path
                  if path not in {"/v1/chat/completions", "/chat/completions"}:
                      self.json_response(404, {"error": "not found"})
                      return
                  try:
                      size = int(self.headers.get("Content-Length", "-1"))
                  except ValueError:
                      size = -1
                  if size < 0 or size > 20 * 1024 * 1024:
                      self.json_response(413, {"error": "invalid request size"})
                      return
                  try:
                      value = json.loads(self.rfile.read(size))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      self.json_response(400, {"error": "invalid JSON"})
                      return
                  if not isinstance(value, dict) or value.get("model") != model:
                      self.json_response(409, {"error": "unexpected model"})
                      return
                  record = {
                      "path": path,
                      "model": value["model"],
                      "stream": value.get("stream"),
                      "request": value,
                  }
                  descriptor = os.open(
                      request_log, os.O_WRONLY | os.O_CREAT | os.O_APPEND, 0o600
                  )
                  with os.fdopen(descriptor, "a", encoding="utf-8") as output:
                      output.write(json.dumps(record, sort_keys=True) + "\n")
                  if value.get("stream") is not True:
                      self.json_response(409, {"error": "streaming is required"})
                      return
                  chunks = (
                      {
                          "id": "chatcmpl-grillmester-ci",
                          "object": "chat.completion.chunk",
                          "created": 0,
                          "model": model,
                          "choices": [
                              {
                                  "index": 0,
                                  "delta": {"role": "assistant", "content": answer},
                                  "finish_reason": None,
                              }
                          ],
                      },
                      {
                          "id": "chatcmpl-grillmester-ci",
                          "object": "chat.completion.chunk",
                          "created": 0,
                          "model": model,
                          "choices": [
                              {"index": 0, "delta": {}, "finish_reason": "stop"}
                          ],
                          "usage": {
                              "prompt_tokens": 1,
                              "completion_tokens": 1,
                              "total_tokens": 2,
                          },
                      },
                  )
                  content = b"".join(
                      b"data: "
                      + json.dumps(chunk, separators=(",", ":")).encode()
                      + b"\n\n"
                      for chunk in chunks
                  ) + b"data: [DONE]\n\n"
                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Cache-Control", "no-cache")
                  self.send_header("Content-Length", str(len(content)))
                  self.end_headers()
                  self.wfile.write(content)

          server = HTTPServer(("127.0.0.1", 0), Handler)
          descriptor = os.open(port_file, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="ascii") as output:
              output.write(f"{server.server_port}\n")
          server.serve_forever()
          PY
          provider_pid=$!
          cleanup_provider() {
            kill "${provider_pid}" 2>/dev/null || true
            rm -rf "${provider_root}"
          }
          trap cleanup_provider EXIT
          provider_ready=false
          for _attempt in {1..600}; do
            if [[ -s "${provider_info}" ]]; then
              provider_ready=true
              break
            fi
            if ! kill -0 "${provider_pid}" 2>/dev/null; then
              echo "Loopback provider exited before publishing its port." >&2
              sed -n '1,120p' "${provider_stderr}" >&2
              exit 1
            fi
            sleep 0.1
          done
          if [[ "${provider_ready}" != true ]]; then
            echo "Loopback provider did not publish its port before the startup deadline." >&2
            sed -n '1,120p' "${provider_stderr}" >&2
            exit 1
          fi
          provider_port="$(<"${provider_info}")"
          [[ "${provider_port}" =~ ^[1-9][0-9]{1,4}$ ]]
          /usr/bin/nc -z -G 2 127.0.0.1 "${provider_port}"
          python_bin="$(command -v python3)"
          "${python_bin}" -I -S -c \
            'import sys, tomllib; assert sys.version_info >= (3, 11)'

          local_root="${RUNNER_TEMP}/copilot-local-gate"
          host_home="${local_root}/host-home"
          host_config="${local_root}/host-config"
          host_cache="${local_root}/host-cache"
          host_data="${local_root}/host-data"
          host_state="${local_root}/host-state"
          mkdir -m 700 \
            "${local_root}" "${host_home}" "${host_config}" "${host_cache}" \
            "${host_data}" "${host_state}"
          ambient_agents="${host_home}/.copilot/agents"
          ambient_plugin="${host_home}/.copilot/installed-plugins/_direct/full-grillmester"
          mkdir -p "${ambient_agents}" "$(dirname "${ambient_plugin}")"
          cp "${BUNDLE_ROOT}/plugin/agents/barista.agent.md" \
            "${ambient_agents}/barista.agent.md"
          printf '\nAMBIENT_FULL_PLUGIN_MUST_NOT_LOAD\n' \
            >> "${ambient_agents}/barista.agent.md"
          cp -R "${BUNDLE_ROOT}/plugin" "${ambient_plugin}"
          local_environment=(
            "HOME=${host_home}"
            "XDG_CONFIG_HOME=${host_config}"
            "XDG_CACHE_HOME=${host_cache}"
            "XDG_DATA_HOME=${host_data}"
            "XDG_STATE_HOME=${host_state}"
            "PATH=${RUNNER_TEMP}/verified-darwin-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          )
          launcher=("${python_bin}" -I -S "${BUNDLE_ROOT}/scripts/grillmester.py")
          local_setup="$(env "${local_environment[@]}" "${launcher[@]}" local setup \
            --client copilot --agent barista --context focused \
            --provider-id ci-local \
            --base-url "http://127.0.0.1:${provider_port}/v1" \
            --model-id ci-grillmester-local)"
          grep -F 'Selected copilot with ci-grillmester-local (focused barista)' \
            <<<"${local_setup}"

          focused_doctor="$(env "${local_environment[@]}" "${launcher[@]}" \
            local doctor --client copilot --agent barista \
            --project-dir "${MACOS_CONSUMER}")"
          grep -F 'ok  model ci-grillmester-local' <<<"${focused_doctor}"
          grep -F "ok  payload ${BUNDLE_ROOT}/targets/copilot-cli-focused-v1" \
            <<<"${focused_doctor}"
          focused_command="$(env "${local_environment[@]}" "${launcher[@]}" \
            local launch --client copilot --agent barista \
            --project-dir "${MACOS_CONSUMER}" --print-command)"
          grep -F -- "${BUNDLE_ROOT}/targets/copilot-cli-focused-v1" \
            <<<"${focused_command}"
          grep -F -- '--model ci-grillmester-local' <<<"${focused_command}"
          if grep -F -- "${BUNDLE_ROOT}/plugin" <<<"${focused_command}"; then
            echo "Focused local launch unexpectedly selected the full plugin." >&2
            exit 1
          fi
          focused_output="${local_root}/focused.stdout"
          env "${local_environment[@]}" "${launcher[@]}" local run \
            --client copilot --agent barista --project-dir "${MACOS_CONSUMER}" \
            'FOCUSED-GATE: return the provider sentinel without using tools.' \
            > "${focused_output}"
          grep -F 'GRILLMESTER_LOCAL_GATE_OK' "${focused_output}"

          full_doctor="$(env "${local_environment[@]}" "${launcher[@]}" \
            local doctor --client copilot --agent barista --full \
            --project-dir "${MACOS_CONSUMER}")"
          grep -F 'ok  model ci-grillmester-local' <<<"${full_doctor}"
          grep -F "ok  payload ${BUNDLE_ROOT}/plugin" <<<"${full_doctor}"
          full_command="$(env "${local_environment[@]}" "${launcher[@]}" \
            local launch --client copilot --agent barista --full \
            --project-dir "${MACOS_CONSUMER}" --print-command)"
          grep -F -- "${BUNDLE_ROOT}/plugin" <<<"${full_command}"
          grep -F -- '--model ci-grillmester-local' <<<"${full_command}"
          full_output="${local_root}/full.stdout"
          env "${local_environment[@]}" "${launcher[@]}" local run \
            --client copilot --agent barista --full \
            --project-dir "${MACOS_CONSUMER}" \
            'FULL-GATE: return the provider sentinel without using tools.' \
            > "${full_output}"
          grep -F 'GRILLMESTER_LOCAL_GATE_OK' "${full_output}"

          python3 -I -S - "${provider_log}" <<'PY'
          import json
          import sys
          from pathlib import Path

          records = [
              json.loads(line)
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          ]
          rendered = [(record, json.dumps(record["request"], sort_keys=True)) for record in records]
          focused = [item for item in rendered if "FOCUSED-GATE" in item[1]]
          full = [item for item in rendered if "FULL-GATE" in item[1]]
          if not focused or not full:
              raise SystemExit("local Copilot smoke did not record both context modes")
          for record, _body in rendered:
              if record.get("model") != "ci-grillmester-local":
                  raise SystemExit("Copilot ignored the explicit local model override")
              if record.get("stream") is not True:
                  raise SystemExit("Copilot did not use the required streaming contract")
              if not record.get("path", "").endswith("/chat/completions"):
                  raise SystemExit("Copilot did not use Chat Completions")
          focused_text = "\n".join(body for _record, body in focused)
          full_text = "\n".join(body for _record, body in full)
          overlay = "Resume with: grillmester local --full"
          ambient = "AMBIENT_FULL_PLUGIN_MUST_NOT_LOAD"
          if overlay not in focused_text:
              raise SystemExit("focused Copilot request did not load the focused overlay")
          if overlay in full_text:
              raise SystemExit("full Copilot request unexpectedly loaded the focused overlay")
          if ambient in focused_text or ambient in full_text:
              raise SystemExit("isolated local Copilot loaded an ambient agent or plugin")
          PY

          opencode_root="${RUNNER_TEMP}/opencode-local-launcher-gate"
          opencode_home="${opencode_root}/home"
          opencode_config="${opencode_root}/config"
          opencode_cache="${opencode_root}/cache"
          opencode_data="${opencode_root}/data"
          opencode_state="${opencode_root}/state"
          mkdir -m 700 \
            "${opencode_root}" "${opencode_home}" "${opencode_config}" \
            "${opencode_cache}" "${opencode_data}" "${opencode_state}"
          opencode_environment=(
            "HOME=${opencode_home}"
            "XDG_CONFIG_HOME=${opencode_config}"
            "XDG_CACHE_HOME=${opencode_cache}"
            "XDG_DATA_HOME=${opencode_data}"
            "XDG_STATE_HOME=${opencode_state}"
            "PATH=${RUNNER_TEMP}/verified-darwin-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          )
          opencode_setup="$(env "${opencode_environment[@]}" "${launcher[@]}" \
            local setup --client opencode --agent barista --context focused \
            --provider-id ci-local \
            --base-url "http://127.0.0.1:${provider_port}/v1" \
            --model-id ci-grillmester-local)"
          grep -F 'Selected opencode with ci-grillmester-local (focused barista)' \
            <<<"${opencode_setup}"
          opencode_doctor="$(env "${opencode_environment[@]}" "${launcher[@]}" \
            local doctor --client opencode --agent barista \
            --project-dir "${MACOS_CONSUMER}")"
          grep -F 'ok  client opencode ' <<<"${opencode_doctor}"
          grep -F 'ok  model ci-grillmester-local' <<<"${opencode_doctor}"
          grep -F "ok  payload ${BUNDLE_ROOT}/targets/opencode-v1-focused" \
            <<<"${opencode_doctor}"
          opencode_output="${opencode_root}/focused.stdout"
          env "${opencode_environment[@]}" "${launcher[@]}" local run \
            --client opencode --agent barista \
            --project-dir "${MACOS_CONSUMER}" \
            'OPENCODE-LOCAL-GATE: return the provider sentinel without using tools.' \
            > "${opencode_output}"
          grep -F 'GRILLMESTER_LOCAL_GATE_OK' "${opencode_output}"

          python3 -I -S - "${provider_log}" <<'PY'
          import json
          import sys
          from pathlib import Path

          records = [
              json.loads(line)
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          ]
          matching = [
              record
              for record in records
              if "OPENCODE-LOCAL-GATE" in json.dumps(record["request"], sort_keys=True)
          ]
          if not matching:
              raise SystemExit("local OpenCode launcher gate recorded no request")
          for record in matching:
              if record.get("model") != "ci-grillmester-local":
                  raise SystemExit("OpenCode ignored the explicit local model override")
              if record.get("stream") is not True:
                  raise SystemExit("OpenCode did not use the required streaming contract")
              if not record.get("path", "").endswith("/chat/completions"):
                  raise SystemExit("OpenCode did not use Chat Completions")
          PY
          [[ -z "$(git -C "${MACOS_CONSUMER}" status --porcelain)" ]]
