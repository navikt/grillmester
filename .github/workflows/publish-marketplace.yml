name: Publish marketplace catalog

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish a release candidate or stable catalog
        required: true
        type: choice
        options:
          - rc
          - stable
      source_sha:
        description: Exact lowercase 40-character source SHA reachable from main
        required: true
        type: string
      rc_tag:
        description: Existing reviewed RC tag (required only for stable)
        required: false
        type: string

concurrency:
  group: publish-grillmester-marketplace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      catalog-base64: ${{ steps.publication.outputs.catalog_base64 }}
      catalog-sha256: ${{ steps.publication.outputs.catalog_sha256 }}
      catalog-version: ${{ steps.publication.outputs.catalog_version }}
    steps:
      - name: Check out trusted promotion tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind trusted promotion source and generate catalog without source execution
        id: source
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RC_TAG: ${{ inputs.rc_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          [[ "${DISPATCH_REF}" == "refs/heads/main" ]] || {
            echo "Marketplace promotion must be dispatched from main." >&2
            exit 1
          }
          [[ "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The selected workflow SHA must be a lowercase 40-character SHA." >&2
            exit 1
          }
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a lowercase 40-character SHA." >&2
            exit 1
          }
          if [[ "${CHANNEL}" == "rc" ]]; then
            [[ -z "${RC_TAG}" ]] || {
              echo "rc_tag must be empty for an RC marketplace promotion." >&2
              exit 1
            }
          elif [[ "${CHANNEL}" == "stable" ]]; then
            [[ "${RC_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z.-]+$ ]] || {
              echo "stable marketplace promotion requires a prerelease rc_tag." >&2
              exit 1
            }
          else
            echo "channel must be rc or stable." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          [[ "${DISPATCH_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]] || {
            echo "The selected workflow SHA is not current origin/main." >&2
            exit 1
          }
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor \
            "${SOURCE_SHA}" refs/remotes/origin/main || {
            echo "source_sha is not reachable from origin/main." >&2
            exit 1
          }

          source_root="${RUNNER_TEMP}/source"
          git worktree add --detach "${source_root}" "${SOURCE_SHA}"
          package_manifest="${source_root}/package-manifest.json"
          plugin_manifest="${source_root}/plugin/plugin.json"
          for source_file in \
            package-manifest.json plugin/plugin.json .github/plugin/marketplace.json; do
            entry="$(git ls-tree "${SOURCE_SHA}" -- "${source_file}")"
            read -r object_mode object_type object_id object_path <<<"${entry}"
            [[ "${object_mode}" == "100644" && "${object_type}" == "blob" ]]
            [[ "${object_id}" =~ ^[0-9a-f]{40}$ && "${object_path}" == "${source_file}" ]]
            [[ -f "${source_root}/${source_file}" && ! -L "${source_root}/${source_file}" ]]
          done
          jq -e '
            .schemaVersion == 1 and
            (keys | sort) == ["marketplace", "packages", "schemaVersion"] and
            (.marketplace | type) == "object" and
            (.marketplace | keys | sort) == ["description", "name", "owner"] and
            (.marketplace.name | type == "string" and length > 0) and
            (.marketplace.description | type == "string" and length > 0) and
            (.marketplace.owner | type == "string" and length > 0) and
            .packages == [{name: "grillmester", path: "plugin", agents: 7, skills: 43}]
          ' "${package_manifest}" >/dev/null
          owner="$(jq -er '.marketplace.owner' "${package_manifest}")"
          jq -e --arg owner "${owner}" '
            type == "object" and
            (keys | sort) == [
              "agents", "author", "description", "license", "name",
              "repository", "skills", "version"
            ] and
            .name == "grillmester" and
            (.version | type == "string") and
            (.description | type == "string" and length > 0) and
            .author == {name: $owner} and
            .repository == "https://github.com/navikt/grillmester" and
            .license == "MIT" and
            .agents == "agents/" and
            .skills == "skills/"
          ' "${plugin_manifest}" >/dev/null
          version="$(jq -er '.version' "${plugin_manifest}")"
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          (( ${#version} <= 64 ))
          [[ "${version}" =~ ${version_pattern} ]]
          if [[ "${version}" == *-* ]]; then
            prerelease="${version#*-}"
            IFS='.' read -r -a prerelease_ids <<<"${prerelease}"
            for identifier in "${prerelease_ids[@]}"; do
              if [[ "${identifier}" =~ ^[0-9]+$ && \
                    ${#identifier} -gt 1 && "${identifier}" == 0* ]]; then
                echo "Plugin version has a zero-prefixed numeric prerelease identifier." >&2
                exit 1
              fi
            done
          fi
          catalog="${source_root}/.github/plugin/marketplace.json"
          mkdir -p "$(dirname "${catalog}")"
          jq -n \
            --arg marketplace_name "$(jq -er '.marketplace.name' "${package_manifest}")" \
            --arg owner "${owner}" \
            --arg marketplace_description "$(jq -er '.marketplace.description' "${package_manifest}")" \
            --arg standard_name "$(jq -er '.name' "${plugin_manifest}")" \
            --arg standard_description "$(jq -er '.description' "${plugin_manifest}")" \
            --arg version "${version}" \
            --arg source_sha "${SOURCE_SHA}" \
            '{
              name: $marketplace_name,
              owner: {name: $owner},
              metadata: {description: $marketplace_description, version: $version},
              plugins: [{
                name: $standard_name,
                description: $standard_description,
                version: $version,
                source: {
                  source: "github", repo: "navikt/grillmester",
                  path: "plugin", sha: $source_sha
                }
              }]
            }' > "${catalog}"
          {
            echo "source_root=${source_root}"
          } >> "$GITHUB_OUTPUT"

      - name: Seal catalog before executing source tooling
        id: publication
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
        run: |
          set -euo pipefail
          catalog="${SOURCE_ROOT}/.github/plugin/marketplace.json"
          {
            echo "catalog_base64=$(base64 -w0 "${catalog}")"
            echo "catalog_sha256=$(sha256sum "${catalog}" | cut -d' ' -f1)"
            echo "catalog_version=$(jq -er '.metadata.version' "${catalog}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Gate catalog channel and stable RC ancestry before publication
        shell: bash
        env:
          CATALOG_SHA256: ${{ steps.publication.outputs.catalog_sha256 }}
          CHANNEL: ${{ inputs.channel }}
          RC_TAG: ${{ inputs.rc_tag }}
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          catalog="${SOURCE_ROOT}/.github/plugin/marketplace.json"
          [[ "$(sha256sum "${catalog}" | cut -d' ' -f1)" == "${CATALOG_SHA256}" ]]

          if [[ "${CHANNEL}" == "rc" ]]; then
            [[ -z "${RC_TAG}" ]]
            python3 scripts/release_contract.py validate-source-promotion \
              --catalog "${catalog}" --channel rc \
              --source-repo "${SOURCE_ROOT}"
            exit 0
          fi

          [[ "${CHANNEL}" == "stable" ]]
          [[ "${RC_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z.-]+$ ]]
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/marketplace:refs/remotes/origin/marketplace" \
            "refs/tags/${RC_TAG}:refs/tags/${RC_TAG}"
          [[ "$(git cat-file -t "refs/tags/${RC_TAG}")" == "tag" ]]
          rc_catalog_sha="$(git rev-parse "refs/tags/${RC_TAG}^{}")"
          git merge-base --is-ancestor \
            "${rc_catalog_sha}" refs/remotes/origin/marketplace
          rc_catalog_repo="${RUNNER_TEMP}/stable-gate-rc-catalog"
          git worktree add --detach "${rc_catalog_repo}" "${rc_catalog_sha}"
          rc_catalog="${rc_catalog_repo}/.github/plugin/marketplace.json"
          rc_values="${RUNNER_TEMP}/stable-gate-rc-values"
          python3 scripts/release_contract.py inspect \
            --catalog "${rc_catalog}" --channel rc \
            --github-output "${rc_values}"
          [[ "${RC_TAG}" == "$(sed -n 's/^tag=//p' "${rc_values}")" ]]
          rc_source_sha="$(sed -n 's/^source_sha=//p' "${rc_values}")"
          [[ "${rc_source_sha}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${rc_source_sha}^{commit}"
          git merge-base --is-ancestor \
            "${rc_source_sha}" refs/remotes/origin/main
          rc_source_repo="${RUNNER_TEMP}/stable-gate-rc-source"
          git worktree add --detach "${rc_source_repo}" "${rc_source_sha}"

          # The trusted contract recomputes and binds the exact imported rights scope.
          git cat-file -e "${SOURCE_SHA}:policy/stable-rights-approval.json"
          python3 scripts/release_contract.py validate-source-promotion \
            --catalog "${catalog}" --channel stable \
            --source-repo "${SOURCE_ROOT}" \
            --rc-tag "${RC_TAG}" --rc-catalog "${rc_catalog}" \
            --rc-source-repo "${rc_source_repo}"

          # Bind stable publication to the already published immutable RC bytes.
          rc_release="$(curl --config /dev/null --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RC_TAG}")"
          [[ "$(jq -r '.tag_name' <<<"${rc_release}")" == "${RC_TAG}" ]]
          [[ "$(jq -r '.draft' <<<"${rc_release}")" == "false" ]]
          [[ "$(jq -r '.prerelease' <<<"${rc_release}")" == "true" ]]
          [[ "$(jq -r '.immutable' <<<"${rc_release}")" == "true" ]]
          rc_bundle_name="grillmester-terminal-${RC_TAG}.tar.gz"
          rc_checksum_name="${rc_bundle_name}.sha256"
          jq -e \
            --arg bundle "${rc_bundle_name}" --arg checksum "${rc_checksum_name}" \
            '(.assets | length) == 2 and
             ([.assets[].name] | sort) == ([$bundle, $checksum] | sort) and
             all(.assets[];
               .state == "uploaded" and
               (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
               (.browser_download_url | type == "string" and
                 startswith("https://github.com/"))) and
             any(.assets[];
               .name == $bundle and .label == "Grillmester terminal bundle") and
             any(.assets[];
               .name == $checksum and .label == "SHA-256 checksum")' \
            <<<"${rc_release}" >/dev/null
          rc_assets="${RUNNER_TEMP}/stable-gate-rc-assets"
          mkdir -p "${rc_assets}"
          rc_published_bundle="${rc_assets}/${rc_bundle_name}"
          rc_published_checksum="${rc_assets}/${rc_checksum_name}"
          rc_bundle_url="$(jq -er --arg name "${rc_bundle_name}" \
            '.assets[] | select(.name == $name) | .browser_download_url' \
            <<<"${rc_release}")"
          rc_checksum_url="$(jq -er --arg name "${rc_checksum_name}" \
            '.assets[] | select(.name == $name) | .browser_download_url' \
            <<<"${rc_release}")"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 61000000 \
            "${rc_bundle_url}" --output "${rc_published_bundle}"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 1024 \
            "${rc_checksum_url}" --output "${rc_published_checksum}"
          rc_rebuilt_bundle="${RUNNER_TEMP}/rebuilt-${rc_bundle_name}"
          python3 "${rc_source_repo}/scripts/build_opencode_bundle.py" \
            --source-root "${rc_source_repo}" --source-sha "${rc_source_sha}" \
            --output "${rc_rebuilt_bundle}"
          cmp -s "${rc_rebuilt_bundle}" "${rc_published_bundle}"
          rc_bundle_sha256="$(sha256sum "${rc_published_bundle}" | cut -d' ' -f1)"
          rc_checksum_sha256="$(sha256sum "${rc_published_checksum}" | cut -d' ' -f1)"
          [[ "$(jq -er --arg name "${rc_bundle_name}" \
            '.assets[] | select(.name == $name) | .digest' <<<"${rc_release}")" == \
            "sha256:${rc_bundle_sha256}" ]]
          [[ "$(jq -er --arg name "${rc_checksum_name}" \
            '.assets[] | select(.name == $name) | .digest' <<<"${rc_release}")" == \
            "sha256:${rc_checksum_sha256}" ]]
          expected_checksum="${RUNNER_TEMP}/expected-${rc_checksum_name}"
          printf '%s  %s\n' \
            "${rc_bundle_sha256}" "${rc_bundle_name}" > "${expected_checksum}"
          cmp -s "${expected_checksum}" "${rc_published_checksum}"
          (cd "${rc_assets}" && sha256sum --check --strict "${rc_checksum_name}")

      - name: Validate exact source against sealed catalog
        shell: bash
        env:
          CATALOG_SHA256: ${{ steps.publication.outputs.catalog_sha256 }}
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          source_root="${SOURCE_ROOT}"
          python3 "${source_root}/scripts/generate_marketplace.py" \
            --mode release --sha "${SOURCE_SHA}" --check
          python3 "${source_root}/scripts/validate.py"
          catalog="${source_root}/.github/plugin/marketplace.json"
          [[ "$(sha256sum "${catalog}" | cut -d' ' -f1)" == \
             "${CATALOG_SHA256}" ]]

      - name: Run Python tests from exact source
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
        run: python3 -m unittest discover -s "${SOURCE_ROOT}/tests" -v

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate Visual Companion scripts from exact source
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
        run: |
          source_root="${SOURCE_ROOT}"
          node --check "${source_root}/plugin/skills/grillmester-design-prototype/scripts/server.js"
          node --check "${source_root}/plugin/skills/grillmester-design-prototype/scripts/helper.js"
          node --test "${source_root}/plugin/skills/grillmester-design-prototype/tests/server.test.js"

      - name: Install exact OpenCode release-test baseline
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
        run: |
          set -euo pipefail
          binary_dir="${RUNNER_TEMP}/opencode-bin"
          python3 -I -S "${SOURCE_ROOT}/scripts/release_test_baseline.py" install \
            --client opencode --platform linux --architecture x86_64 \
            --output "${binary_dir}/opencode"
          echo "OPENCODE_BIN=${binary_dir}/opencode" >> "${GITHUB_ENV}"

      - name: Install exact cplt release-test baseline
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
        run: |
          set -euo pipefail
          binary_dir="${RUNNER_TEMP}/cplt-bin"
          python3 -I -S "${SOURCE_ROOT}/scripts/release_test_baseline.py" install \
            --client cplt --platform linux --architecture x86_64 \
            --output "${binary_dir}/cplt"
          echo "CPLT_BIN=${binary_dir}/cplt" >> "${GITHUB_ENV}"

      - name: Smoke-test immutable OpenCode target
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          python3 "${SOURCE_ROOT}/scripts/smoke_opencode.py" \
            --require-binary --opencode "${OPENCODE_BIN}"

      - name: Smoke-test immutable OpenCode runtime contracts
        shell: bash
        env:
          PATH: ${{ runner.temp }}/opencode-bin:${{ runner.temp }}/cplt-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          python3 "${SOURCE_ROOT}/scripts/smoke_opencode_runtime.py" \
            --require-binary --opencode "${OPENCODE_BIN}" --cplt "${CPLT_BIN}"

  copilot-compatibility:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Restore sealed catalog bytes
        shell: bash
        env:
          CATALOG_BASE64: ${{ needs.validate.outputs.catalog-base64 }}
          CATALOG_SHA256: ${{ needs.validate.outputs.catalog-sha256 }}
        run: |
          set -euo pipefail
          catalog="${RUNNER_TEMP}/marketplace.json"
          printf '%s' "${CATALOG_BASE64}" | base64 --decode > "${catalog}"
          [[ "$(sha256sum "${catalog}" | cut -d' ' -f1)" == "${CATALOG_SHA256}" ]]
          echo "CATALOG_PATH=${catalog}" >> "${GITHUB_ENV}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test immutable marketplace installation
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python3 scripts/smoke_plugin_install.py
          --catalog "${CATALOG_PATH}"
          --source-root "${GITHUB_WORKSPACE}"
          --source-sha "${SOURCE_SHA}"
          --expect-release-sha "${SOURCE_SHA}"

  macos-live-compatibility:
    needs: validate
    uses: ./.github/workflows/macos-opencode-compatibility.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    permissions:
      contents: read

  publish:
    needs:
      - validate
      - copilot-compatibility
      - macos-live-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: grillmester-release
    permissions:
      contents: write # Create and atomically update the catalog branch.
    env:
      CATALOG_BASE64: ${{ needs.validate.outputs.catalog-base64 }}
      CATALOG_SHA256: ${{ needs.validate.outputs.catalog-sha256 }}
      CATALOG_VERSION: ${{ needs.validate.outputs.catalog-version }}
      MARKETPLACE_BRANCH: marketplace
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Publish catalog-only commit atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          compare_numeric_identifier() {
            local left="$1"
            local right="$2"
            if (( ${#left} < ${#right} )); then
              NUMERIC_COMPARE=-1
            elif (( ${#left} > ${#right} )); then
              NUMERIC_COMPARE=1
            elif [[ "${left}" == "${right}" ]]; then
              NUMERIC_COMPARE=0
            elif [[ "${left}" < "${right}" ]]; then
              NUMERIC_COMPARE=-1
            else
              NUMERIC_COMPARE=1
            fi
          }

          semver_compare() {
            local left="$1"
            local right="$2"
            local pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
            (( ${#left} <= 64 && ${#right} <= 64 )) || return 2
            [[ "${left}" =~ ${pattern} ]] || return 2
            local left_major="${BASH_REMATCH[1]}"
            local left_minor="${BASH_REMATCH[2]}"
            local left_patch="${BASH_REMATCH[3]}"
            local left_pre="${BASH_REMATCH[5]-}"
            [[ "${right}" =~ ${pattern} ]] || return 2
            local right_major="${BASH_REMATCH[1]}"
            local right_minor="${BASH_REMATCH[2]}"
            local right_patch="${BASH_REMATCH[3]}"
            local right_pre="${BASH_REMATCH[5]-}"
            local left_core=("${left_major}" "${left_minor}" "${left_patch}")
            local right_core=("${right_major}" "${right_minor}" "${right_patch}")
            local index
            for index in 0 1 2; do
              compare_numeric_identifier "${left_core[index]}" "${right_core[index]}"
              if [[ "${NUMERIC_COMPARE}" != "0" ]]; then
                SEMVER_COMPARE="${NUMERIC_COMPARE}"
                return 0
              fi
            done
            if [[ -z "${left_pre}" && -z "${right_pre}" ]]; then
              SEMVER_COMPARE=0
              return 0
            elif [[ -z "${left_pre}" ]]; then
              SEMVER_COMPARE=1
              return 0
            elif [[ -z "${right_pre}" ]]; then
              SEMVER_COMPARE=-1
              return 0
            fi
            local left_ids=()
            local right_ids=()
            IFS='.' read -r -a left_ids <<<"${left_pre}"
            IFS='.' read -r -a right_ids <<<"${right_pre}"
            local identifier
            for identifier in "${left_ids[@]}" "${right_ids[@]}"; do
              if [[ "${identifier}" =~ ^[0-9]+$ && \
                    ${#identifier} -gt 1 && "${identifier}" == 0* ]]; then
                return 2
              fi
            done
            local common_count="${#left_ids[@]}"
            (( ${#right_ids[@]} < common_count )) && common_count="${#right_ids[@]}"
            for ((index = 0; index < common_count; index++)); do
              local left_id="${left_ids[index]}"
              local right_id="${right_ids[index]}"
              [[ "${left_id}" == "${right_id}" ]] && continue
              if [[ "${left_id}" =~ ^[0-9]+$ && "${right_id}" =~ ^[0-9]+$ ]]; then
                compare_numeric_identifier "${left_id}" "${right_id}"
                SEMVER_COMPARE="${NUMERIC_COMPARE}"
              elif [[ "${left_id}" =~ ^[0-9]+$ ]]; then
                SEMVER_COMPARE=-1
              elif [[ "${right_id}" =~ ^[0-9]+$ ]]; then
                SEMVER_COMPARE=1
              elif [[ "${left_id}" < "${right_id}" ]]; then
                SEMVER_COMPARE=-1
              else
                SEMVER_COMPARE=1
              fi
              return 0
            done
            if (( ${#left_ids[@]} < ${#right_ids[@]} )); then
              SEMVER_COMPARE=-1
            elif (( ${#left_ids[@]} > ${#right_ids[@]} )); then
              SEMVER_COMPARE=1
            else
              SEMVER_COMPARE=0
            fi
          }

          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CATALOG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${CATALOG_VERSION}" =~ ^[0-9A-Za-z.-]+$ ]]
          semver_compare "${CATALOG_VERSION}" "${CATALOG_VERSION}" || {
            echo "Marketplace version must be strict SemVer without build metadata." >&2
            exit 1
          }
          [[ "${SEMVER_COMPARE}" == "0" ]]
          catalog=".github/plugin/marketplace.json"
          mkdir -p "$(dirname "${catalog}")"
          printf '%s' "${CATALOG_BASE64}" | base64 --decode > "${catalog}"
          [[ "$(sha256sum "${catalog}" | cut -d' ' -f1)" == "${CATALOG_SHA256}" ]]
          jq -e \
            --arg version "${CATALOG_VERSION}" \
            --arg source_sha "${SOURCE_SHA}" \
            '
              .name == "grillmester" and
              .metadata.version == $version and
              (.plugins | length) == 1 and
              [.plugins[].name] == ["grillmester"] and
              [.plugins[].version] == [$version] and
              .plugins[0].source == {
                source: "github",
                repo: "navikt/grillmester",
                path: "plugin",
                sha: $source_sha
              }
            ' "${catalog}" >/dev/null

          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          remote_tip="$(git ls-remote --heads origin "refs/heads/${MARKETPLACE_BRANCH}")"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          [[ "${WORKFLOW_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]] || {
            echo "The selected workflow SHA is no longer current origin/main." >&2
            exit 1
          }
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor \
            "${SOURCE_SHA}" refs/remotes/origin/main || {
            echo "source_sha is no longer reachable from origin/main." >&2
            exit 1
          }

          source_package_manifest="${RUNNER_TEMP}/source-package-manifest.json"
          source_plugin_manifest="${RUNNER_TEMP}/source-plugin-manifest.json"
          for source_file in package-manifest.json plugin/plugin.json; do
            entry="$(git ls-tree "${SOURCE_SHA}" -- "${source_file}")"
            read -r object_mode object_type object_id object_path <<<"${entry}"
            [[ "${object_mode}" == "100644" && "${object_type}" == "blob" ]]
            [[ "${object_id}" =~ ^[0-9a-f]{40}$ && "${object_path}" == "${source_file}" ]]
          done
          git show "${SOURCE_SHA}:package-manifest.json" > "${source_package_manifest}"
          git show "${SOURCE_SHA}:plugin/plugin.json" > "${source_plugin_manifest}"
          jq -e '
            .schemaVersion == 1 and
            (keys | sort) == ["marketplace", "packages", "schemaVersion"] and
            (.marketplace | type) == "object" and
            (.marketplace | keys | sort) == ["description", "name", "owner"] and
            (.marketplace.name | type == "string" and length > 0) and
            (.marketplace.description | type == "string" and length > 0) and
            (.marketplace.owner | type == "string" and length > 0) and
            .packages == [{name: "grillmester", path: "plugin", agents: 7, skills: 43}]
          ' "${source_package_manifest}" >/dev/null
          source_owner="$(jq -er '.marketplace.owner' "${source_package_manifest}")"
          jq -e --arg owner "${source_owner}" '
            type == "object" and
            (keys | sort) == [
              "agents", "author", "description", "license", "name",
              "repository", "skills", "version"
            ] and
            .name == "grillmester" and
            (.version | type == "string") and
            (.description | type == "string" and length > 0) and
            .author == {name: $owner} and
            .repository == "https://github.com/navikt/grillmester" and
            .license == "MIT" and
            .agents == "agents/" and
            .skills == "skills/"
          ' "${source_plugin_manifest}" >/dev/null
          [[ "$(jq -er '.version' "${source_plugin_manifest}")" == "${CATALOG_VERSION}" ]]
          regenerated_catalog="${RUNNER_TEMP}/regenerated-marketplace.json"
          jq -n \
            --arg marketplace_name "$(jq -er '.marketplace.name' "${source_package_manifest}")" \
            --arg owner "${source_owner}" \
            --arg marketplace_description "$(jq -er '.marketplace.description' "${source_package_manifest}")" \
            --arg standard_name "$(jq -er '.name' "${source_plugin_manifest}")" \
            --arg standard_description "$(jq -er '.description' "${source_plugin_manifest}")" \
            --arg version "${CATALOG_VERSION}" \
            --arg source_sha "${SOURCE_SHA}" \
            '{
              name: $marketplace_name,
              owner: {name: $owner},
              metadata: {description: $marketplace_description, version: $version},
              plugins: [{
                name: $standard_name,
                description: $standard_description,
                version: $version,
                source: {
                  source: "github", repo: "navikt/grillmester",
                  path: "plugin", sha: $source_sha
                }
              }]
            }' > "${regenerated_catalog}"
          cmp -s "${regenerated_catalog}" "${catalog}"

          base_sha=""
          parent_args=()
          if [[ -n "${remote_tip}" ]]; then
            git fetch --no-tags origin \
              "refs/heads/${MARKETPLACE_BRANCH}:refs/remotes/origin/${MARKETPLACE_BRANCH}"
            base_sha="$(git rev-parse "refs/remotes/origin/${MARKETPLACE_BRANCH}")"
            parent_args=(-p "${base_sha}")

            previous_catalog="$(git show "${base_sha}:.github/plugin/marketplace.json")"
            previous_version="$(jq -er '.metadata.version' <<<"${previous_catalog}")"
            previous_source_sha="$(jq -er \
              '[.plugins[].source.sha] | unique | if length == 1 then .[0] else error("catalog source SHAs differ") end' \
              <<<"${previous_catalog}")"
            current_version="${CATALOG_VERSION}"

            if [[ "${current_version}" == "${previous_version}" ]]; then
              if [[ "${SOURCE_SHA}" == "${previous_source_sha}" ]]; then
                previous_catalog_sha256="$(git show "${base_sha}:${catalog}" | sha256sum | cut -d' ' -f1)"
                if [[ "${CATALOG_SHA256}" == "${previous_catalog_sha256}" ]]; then
                  echo "Marketplace already publishes ${current_version} at ${SOURCE_SHA}."
                  exit 0
                fi
                echo "Refusing idempotent marketplace rerun: existing catalog bytes do not match the sealed catalog." >&2
                exit 1
              fi
              echo "Refusing to reuse marketplace version ${current_version} for ${SOURCE_SHA}; previous source is ${previous_source_sha}." >&2
              exit 1
            fi

            semver_compare "${current_version}" "${previous_version}" || {
              echo "Marketplace versions must be strict SemVer without build metadata." >&2
              exit 1
            }
            [[ "${SEMVER_COMPARE}" == "1" ]] || {
              echo "Refusing marketplace downgrade from ${previous_version} to ${current_version}." >&2
              exit 1
            }

            while read -r catalog_commit; do
              [[ -z "${catalog_commit}" ]] && continue
              published_version="$(git show "${catalog_commit}:.github/plugin/marketplace.json" | jq -er '.metadata.version')"
              if [[ "${published_version}" == "${current_version}" ]]; then
                echo "Refusing to reuse previously published marketplace version ${current_version}." >&2
                exit 1
              fi
            done < <(git rev-list --skip=1 "${base_sha}")
          fi

          index_file="$(mktemp)"
          rm -f "${index_file}"
          trap 'rm -f "${index_file}"' EXIT

          GIT_INDEX_FILE="${index_file}" git read-tree --empty
          GIT_INDEX_FILE="${index_file}" git add -- .github/plugin/marketplace.json
          tree_sha="$(GIT_INDEX_FILE="${index_file}" git write-tree)"
          commit_sha="$(git commit-tree "${tree_sha}" "${parent_args[@]}" \
            -m "chore: publish marketplace for ${SOURCE_SHA}")"

          # The new commit has the fetched tip as its parent. A concurrent
          # update therefore fails as non-fast-forward without any force mode.
          git push origin --atomic \
            "${commit_sha}:refs/heads/${MARKETPLACE_BRANCH}"

  remote-smoke:
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Check out trusted smoke tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind floating marketplace to published source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/marketplace:refs/remotes/origin/marketplace"
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main
          marketplace_root="${RUNNER_TEMP}/marketplace"
          source_root="${RUNNER_TEMP}/source"
          git worktree add --detach \
            "${marketplace_root}" refs/remotes/origin/marketplace
          git worktree add --detach "${source_root}" "${SOURCE_SHA}"
          {
            echo "CATALOG_PATH=${marketplace_root}/.github/plugin/marketplace.json"
            echo "SOURCE_ROOT=${source_root}"
          } >> "${GITHUB_ENV}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test published floating marketplace
        run: >-
          python3 scripts/smoke_plugin_install.py
          --catalog "${CATALOG_PATH}"
          --source-root "${SOURCE_ROOT}"
          --source-sha "${SOURCE_SHA}"
          --expect-release-sha "${SOURCE_SHA}"
          --remote-marketplace-ref "navikt/grillmester#marketplace"
          --allow-floating-marketplace
