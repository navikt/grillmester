name: Publish marketplace catalog

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character source SHA reachable from main
        required: true
        type: string

concurrency:
  group: publish-grillmester-marketplace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      catalog-base64: ${{ steps.publication.outputs.catalog_base64 }}
      catalog-sha256: ${{ steps.publication.outputs.catalog_sha256 }}
      catalog-version: ${{ steps.publication.outputs.catalog_version }}
    steps:
      - name: Check out trusted promotion tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted promotion source and generate immutable catalog
        id: source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          [[ "${DISPATCH_REF}" == "refs/heads/main" ]] || {
            echo "Marketplace promotion must be dispatched from main." >&2
            exit 1
          }
          [[ "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The selected workflow SHA must be a lowercase 40-character SHA." >&2
            exit 1
          }
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a lowercase 40-character SHA." >&2
            exit 1
          }

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          [[ "${DISPATCH_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]] || {
            echo "The selected workflow SHA is not current origin/main." >&2
            exit 1
          }
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor \
            "${SOURCE_SHA}" refs/remotes/origin/main || {
            echo "source_sha is not reachable from origin/main." >&2
            exit 1
          }

          source_root="${RUNNER_TEMP}/source"
          git worktree add --detach "${source_root}" "${SOURCE_SHA}"
          python3 "${source_root}/scripts/generate_marketplace.py" \
            --mode release --sha "${SOURCE_SHA}"
          python3 "${source_root}/scripts/generate_marketplace.py" \
            --mode release --sha "${SOURCE_SHA}" --check
          python3 "${source_root}/scripts/validate.py"
          {
            echo "source_root=${source_root}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Python tests from exact source
        run: python3 -m unittest discover -s "${{ steps.source.outputs.source_root }}/tests" -v

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate Visual Companion scripts from exact source
        run: |
          source_root="${{ steps.source.outputs.source_root }}"
          node --check "${source_root}/plugin/skills/grillmester-design-prototype/scripts/server.js"
          node --check "${source_root}/plugin/skills/grillmester-design-prototype/scripts/helper.js"
          node --test "${source_root}/plugin/skills/grillmester-design-prototype/tests/server.test.js"

      - name: Seal validated catalog for publication
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          catalog="${{ steps.source.outputs.source_root }}/.github/plugin/marketplace.json"
          {
            echo "catalog_base64=$(base64 -w0 "${catalog}")"
            echo "catalog_sha256=$(sha256sum "${catalog}" | cut -d' ' -f1)"
            echo "catalog_version=$(jq -er '.metadata.version' "${catalog}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test immutable marketplace installation
        run: >-
          python3 "${{ steps.source.outputs.source_root }}/scripts/smoke_plugin_install.py"
          --catalog "${{ steps.source.outputs.source_root }}/.github/plugin/marketplace.json"
          --source-root "${{ steps.source.outputs.source_root }}"
          --source-sha "${{ inputs.source_sha }}"
          --expect-release-sha "${{ inputs.source_sha }}"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CATALOG_BASE64: ${{ needs.validate.outputs.catalog-base64 }}
      CATALOG_SHA256: ${{ needs.validate.outputs.catalog-sha256 }}
      CATALOG_VERSION: ${{ needs.validate.outputs.catalog-version }}
      MARKETPLACE_BRANCH: marketplace
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Publish catalog-only commit atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CATALOG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${CATALOG_VERSION}" =~ ^[0-9A-Za-z.-]+$ ]]
          catalog=".github/plugin/marketplace.json"
          mkdir -p "$(dirname "${catalog}")"
          printf '%s' "${CATALOG_BASE64}" | base64 --decode > "${catalog}"
          [[ "$(sha256sum "${catalog}" | cut -d' ' -f1)" == "${CATALOG_SHA256}" ]]
          jq -e \
            --arg version "${CATALOG_VERSION}" \
            --arg source_sha "${SOURCE_SHA}" \
            '
              .name == "grillmester" and
              .metadata.version == $version and
              (.plugins | length) == 1 and
              [.plugins[].name] == ["grillmester"] and
              [.plugins[].version] == [$version] and
              .plugins[0].source == {
                source: "github",
                repo: "navikt/grillmester",
                path: "plugin",
                sha: $source_sha
              }
            ' "${catalog}" >/dev/null

          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          remote_tip="$(git ls-remote --heads origin "refs/heads/${MARKETPLACE_BRANCH}")"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          [[ "${WORKFLOW_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]] || {
            echo "The selected workflow SHA is no longer current origin/main." >&2
            exit 1
          }
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor \
            "${SOURCE_SHA}" refs/remotes/origin/main || {
            echo "source_sha is no longer reachable from origin/main." >&2
            exit 1
          }

          base_sha=""
          parent_args=()
          if [[ -n "${remote_tip}" ]]; then
            git fetch --no-tags origin \
              "refs/heads/${MARKETPLACE_BRANCH}:refs/remotes/origin/${MARKETPLACE_BRANCH}"
            base_sha="$(git rev-parse "refs/remotes/origin/${MARKETPLACE_BRANCH}")"
            parent_args=(-p "${base_sha}")

            previous_catalog="$(git show "${base_sha}:.github/plugin/marketplace.json")"
            previous_version="$(jq -er '.metadata.version' <<<"${previous_catalog}")"
            previous_source_sha="$(jq -er \
              '[.plugins[].source.sha] | unique | if length == 1 then .[0] else error("catalog source SHAs differ") end' \
              <<<"${previous_catalog}")"
            current_version="${CATALOG_VERSION}"

            if [[ "${current_version}" == "${previous_version}" ]]; then
              if [[ "${SOURCE_SHA}" == "${previous_source_sha}" ]]; then
                previous_catalog_sha256="$(git show "${base_sha}:${catalog}" | sha256sum | cut -d' ' -f1)"
                if [[ "${CATALOG_SHA256}" == "${previous_catalog_sha256}" ]]; then
                  echo "Marketplace already publishes ${current_version} at ${SOURCE_SHA}."
                  exit 0
                fi
                echo "Refusing idempotent marketplace rerun: existing catalog bytes do not match the sealed catalog." >&2
                exit 1
              fi
              echo "Refusing to reuse marketplace version ${current_version} for ${SOURCE_SHA}; previous source is ${previous_source_sha}." >&2
              exit 1
            fi

            while read -r catalog_commit; do
              [[ -z "${catalog_commit}" ]] && continue
              published_version="$(git show "${catalog_commit}:.github/plugin/marketplace.json" | jq -er '.metadata.version')"
              if [[ "${published_version}" == "${current_version}" ]]; then
                echo "Refusing to reuse previously published marketplace version ${current_version}." >&2
                exit 1
              fi
            done < <(git rev-list --skip=1 "${base_sha}")
          fi

          index_file="$(mktemp)"
          rm -f "${index_file}"
          trap 'rm -f "${index_file}"' EXIT

          GIT_INDEX_FILE="${index_file}" git read-tree --empty
          GIT_INDEX_FILE="${index_file}" git add -- .github/plugin/marketplace.json
          tree_sha="$(GIT_INDEX_FILE="${index_file}" git write-tree)"
          commit_sha="$(git commit-tree "${tree_sha}" "${parent_args[@]}" \
            -m "chore: publish marketplace for ${SOURCE_SHA}")"

          # The new commit has the fetched tip as its parent. A concurrent
          # update therefore fails as non-fast-forward without any force mode.
          git push origin --atomic \
            "${commit_sha}:refs/heads/${MARKETPLACE_BRANCH}"

  remote-smoke:
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Check out trusted smoke tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind floating marketplace to published source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/marketplace:refs/remotes/origin/marketplace"
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main
          marketplace_root="${RUNNER_TEMP}/marketplace"
          source_root="${RUNNER_TEMP}/source"
          git worktree add --detach \
            "${marketplace_root}" refs/remotes/origin/marketplace
          git worktree add --detach "${source_root}" "${SOURCE_SHA}"
          {
            echo "CATALOG_PATH=${marketplace_root}/.github/plugin/marketplace.json"
            echo "SOURCE_ROOT=${source_root}"
          } >> "${GITHUB_ENV}"

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test published floating marketplace
        run: >-
          python3 scripts/smoke_plugin_install.py
          --catalog "${CATALOG_PATH}"
          --source-root "${SOURCE_ROOT}"
          --source-sha "${SOURCE_SHA}"
          --expect-release-sha "${SOURCE_SHA}"
          --remote-marketplace-ref "navikt/grillmester#marketplace"
          --allow-floating-marketplace
