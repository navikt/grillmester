name: Validate immutable release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Validate a release candidate or stable release
        required: true
        type: choice
        options:
          - rc
          - stable
      catalog_sha:
        description: Exact catalog-only commit on the marketplace branch
        required: true
        type: string
      rc_tag:
        description: Existing reviewed RC tag (required only for stable)
        required: false
        type: string

concurrency:
  group: publish-grillmester-marketplace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      catalog-sha: ${{ steps.contract.outputs.catalog_sha }}
      source-sha: ${{ steps.contract.outputs.source_sha }}
    env:
      CATALOG_SHA: ${{ inputs.catalog_sha }}
      CHANNEL: ${{ inputs.channel }}
      DISPATCH_SHA: ${{ github.sha }}
      DISPATCH_REF: ${{ github.ref }}
      RC_TAG: ${{ inputs.rc_tag }}
    steps:
      - name: Check out trusted validation tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable chain
        id: contract
        shell: bash
        run: |
          set -euo pipefail

          [[ "${DISPATCH_REF}" == "refs/heads/main" ]] || {
            echo "Validation must be dispatched from main." >&2
            exit 1
          }
          [[ "${CATALOG_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "catalog_sha must be a lowercase 40-character SHA." >&2
            exit 1
          }
          if [[ "${CHANNEL}" == "rc" ]]; then
            [[ -z "${RC_TAG}" ]] || {
              echo "rc_tag must be empty for an RC." >&2
              exit 1
            }
          elif [[ "${CHANNEL}" == "stable" ]]; then
            [[ "${RC_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z.-]+$ ]] || {
              echo "stable validation requires a prerelease rc_tag." >&2
              exit 1
            }
          else
            echo "channel must be rc or stable." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/marketplace:refs/remotes/origin/marketplace"
          [[ "${DISPATCH_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]] || {
            echo "The selected workflow SHA is not current origin/main." >&2
            exit 1
          }
          git cat-file -e "${CATALOG_SHA}^{commit}"
          git merge-base --is-ancestor \
            "${CATALOG_SHA}" refs/remotes/origin/marketplace || {
            echo "Catalog is not reachable from origin/marketplace." >&2
            exit 1
          }

          catalog_repo="${RUNNER_TEMP}/catalog"
          source_repo="${RUNNER_TEMP}/source"
          git worktree add --detach "${catalog_repo}" "${CATALOG_SHA}"
          catalog="${catalog_repo}/.github/plugin/marketplace.json"
          source_sha="$(jq -er '
            .metadata.version as $version |
            .plugins[0].source.sha as $sha |
            if
              (.plugins | length) == 1 and
              [.plugins[].name] == ["grillmester"] and
              [.plugins[].version] == [$version] and
              .plugins[0].source == {
                source: "github", repo: "navikt/grillmester",
                path: "plugin", sha: $sha
              }
            then $sha
            else error("catalog must contain the exact one-package release roster")
            end
          ' "${catalog}")"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor \
            "${source_sha}" refs/remotes/origin/main || {
            echo "Catalog source.sha is not reachable from origin/main." >&2
            exit 1
          }
          git worktree add --detach "${source_repo}" "${source_sha}"

          contract_args=(
            validate
            --catalog "${catalog}"
            --channel "${CHANNEL}"
            --catalog-repo "${catalog_repo}"
            --catalog-sha "${CATALOG_SHA}"
            --source-repo "${source_repo}"
          )
          if [[ "${CHANNEL}" == "stable" ]]; then
            git fetch --no-tags origin "refs/tags/${RC_TAG}:refs/tags/${RC_TAG}"
            [[ "$(git cat-file -t "refs/tags/${RC_TAG}")" == "tag" ]]
            rc_catalog_sha="$(git rev-parse "refs/tags/${RC_TAG}^{}")"
            git merge-base --is-ancestor \
              "${rc_catalog_sha}" refs/remotes/origin/marketplace
            rc_catalog_repo="${RUNNER_TEMP}/rc-catalog"
            git worktree add --detach "${rc_catalog_repo}" "${rc_catalog_sha}"
            rc_catalog="${rc_catalog_repo}/.github/plugin/marketplace.json"
            rc_values="${RUNNER_TEMP}/rc-values"
            python3 scripts/release_contract.py inspect \
              --catalog "${rc_catalog}" --channel rc \
              --github-output "${rc_values}"
            [[ "${RC_TAG}" == "$(sed -n 's/^tag=//p' "${rc_values}")" ]]
            rc_source_sha="$(sed -n 's/^source_sha=//p' "${rc_values}")"
            git cat-file -e "${rc_source_sha}^{commit}"
            git merge-base --is-ancestor \
              "${rc_source_sha}" refs/remotes/origin/main
            rc_source_repo="${RUNNER_TEMP}/rc-source"
            git worktree add --detach "${rc_source_repo}" "${rc_source_sha}"
            contract_args+=(
              --rc-tag "${RC_TAG}"
              --rc-catalog "${rc_catalog}"
              --rc-catalog-repo "${rc_catalog_repo}"
              --rc-catalog-sha "${rc_catalog_sha}"
              --rc-source-repo "${rc_source_repo}"
            )
            # Complete the workflow-owned, read-only contract before executing
            # the selected RC source's bundle builder.
            python3 scripts/release_contract.py "${contract_args[@]}"
            rc_release="$(curl --config /dev/null --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RC_TAG}")"
            [[ "$(jq -r '.tag_name' <<<"${rc_release}")" == "${RC_TAG}" ]]
            [[ "$(jq -r '.draft' <<<"${rc_release}")" == "false" ]]
            [[ "$(jq -r '.prerelease' <<<"${rc_release}")" == "true" ]]
            [[ "$(jq -r '.immutable' <<<"${rc_release}")" == "true" ]]
            rc_bundle_name="grillmester-opencode-${RC_TAG}.tar.gz"
            rc_bundle_checksum_name="${rc_bundle_name}.sha256"
            rc_formula_name="grillmester.rb"
            jq -e \
              --arg bundle "${rc_bundle_name}" \
              --arg checksum "${rc_bundle_checksum_name}" \
              --arg formula "${rc_formula_name}" \
              '(.assets | length) == 3 and
               ([.assets[].name] | sort) == ([$bundle, $checksum, $formula] | sort) and
               all(.assets[];
                 .state == "uploaded" and
                 (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                 (.browser_download_url | type == "string" and
                   startswith("https://github.com/"))) and
               any(.assets[];
                 .name == $bundle and .label == "Grillmester OpenCode bundle") and
               any(.assets[];
                 .name == $checksum and .label == "SHA-256 checksum") and
               any(.assets[];
                 .name == $formula and .label == "Homebrew formula")' \
              <<<"${rc_release}" >/dev/null
            rc_assets="${RUNNER_TEMP}/rc-assets"
            mkdir -p "${rc_assets}"
            rc_published_bundle="${rc_assets}/${rc_bundle_name}"
            rc_published_checksum="${rc_assets}/${rc_bundle_checksum_name}"
            rc_published_formula="${rc_assets}/${rc_formula_name}"
            rc_bundle_url="$(jq -er --arg name "${rc_bundle_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${rc_release}")"
            rc_checksum_url="$(jq -er --arg name "${rc_bundle_checksum_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${rc_release}")"
            rc_formula_url="$(jq -er --arg name "${rc_formula_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${rc_release}")"
            curl --config /dev/null --fail-with-body --silent --show-error --location \
              --proto '=https' --tlsv1.2 --proto-redir '=https' \
              --max-filesize 61000000 \
              "${rc_bundle_url}" --output "${rc_published_bundle}"
            curl --config /dev/null --fail-with-body --silent --show-error --location \
              --proto '=https' --tlsv1.2 --proto-redir '=https' \
              --max-filesize 1024 \
              "${rc_checksum_url}" --output "${rc_published_checksum}"
            curl --config /dev/null --fail-with-body --silent --show-error --location \
              --proto '=https' --tlsv1.2 --proto-redir '=https' \
              --max-filesize 100000 \
              "${rc_formula_url}" --output "${rc_published_formula}"
            rc_rebuilt_bundle="${RUNNER_TEMP}/rebuilt-${rc_bundle_name}"
            python3 "${rc_source_repo}/scripts/build_opencode_bundle.py" \
              --source-root "${rc_source_repo}" --source-sha "${rc_source_sha}" \
              --output "${rc_rebuilt_bundle}"
            cmp -s "${rc_rebuilt_bundle}" "${rc_published_bundle}"
            rc_bundle_sha256="$(sha256sum "${rc_published_bundle}" | cut -d' ' -f1)"
            rc_checksum_sha256="$(sha256sum "${rc_published_checksum}" | cut -d' ' -f1)"
            rc_formula_sha256="$(sha256sum "${rc_published_formula}" | cut -d' ' -f1)"
            [[ "$(jq -er --arg name "${rc_bundle_name}" \
              '.assets[] | select(.name == $name) | .digest' <<<"${rc_release}")" == \
              "sha256:${rc_bundle_sha256}" ]]
            [[ "$(jq -er --arg name "${rc_bundle_checksum_name}" \
              '.assets[] | select(.name == $name) | .digest' <<<"${rc_release}")" == \
              "sha256:${rc_checksum_sha256}" ]]
            [[ "$(jq -er --arg name "${rc_formula_name}" \
              '.assets[] | select(.name == $name) | .digest' <<<"${rc_release}")" == \
              "sha256:${rc_formula_sha256}" ]]
            rc_expected_checksum="${RUNNER_TEMP}/expected-${rc_bundle_checksum_name}"
            printf '%s  %s\n' \
              "${rc_bundle_sha256}" "${rc_bundle_name}" > "${rc_expected_checksum}"
            cmp -s "${rc_expected_checksum}" "${rc_published_checksum}"
            (cd "${rc_assets}" && \
              sha256sum --check --strict "${rc_bundle_checksum_name}")
            rc_expected_formula="${RUNNER_TEMP}/expected-rc-grillmester.rb"
            python3 "${rc_source_repo}/scripts/generate_homebrew_formula.py" \
              --tag "${RC_TAG}" --bundle-name "${rc_bundle_name}" \
              --bundle-sha256 "${rc_bundle_sha256}" \
              --output "${rc_expected_formula}"
            ruby -c "${rc_published_formula}"
            cmp -s "${rc_expected_formula}" "${rc_published_formula}"
          else
            python3 scripts/release_contract.py "${contract_args[@]}"
          fi

          {
            echo "SOURCE_SHA=${source_sha}"
            echo "CATALOG_PATH=${catalog}"
            echo "SOURCE_ROOT=${source_repo}"
          } >> "${GITHUB_ENV}"
          {
            echo "catalog_sha=${CATALOG_SHA}"
            echo "source_sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install checksum-pinned OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64-1.18.20.tgz"
          binary_dir="${RUNNER_TEMP}/opencode-bin"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 70000000 \
            "https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-1.18.20.tgz" \
            --output "${archive}"
          echo "1fe5e153b35b7d306df98135cdab1876e9637ef79941b6adc3bda00d485629f9c4f3781df4a67cbb96e209fed364472c8bd40979b1606b6513ade6ec8afcd0ba  ${archive}" \
            | sha512sum --check --strict
          mapfile -t opencode_entries < <(tar -tzf "${archive}")
          [[ "${#opencode_entries[@]}" == "2" ]]
          [[ "${opencode_entries[0]}" == "package/package.json" ]]
          [[ "${opencode_entries[1]}" == "package/bin/opencode" ]]
          mkdir -p "${binary_dir}"
          tar -xzf "${archive}" -C "${binary_dir}" --strip-components=2 \
            --no-same-owner --no-same-permissions -- "package/bin/opencode"
          chmod 0555 "${binary_dir}/opencode"
          [[ -f "${binary_dir}/opencode" && -x "${binary_dir}/opencode" && ! -L "${binary_dir}/opencode" ]]
          echo "5dce99ea079d925736e332b20f5bf869fe9a1fa67dc0a09027156b0ed8e41b16  ${binary_dir}/opencode" \
            | sha256sum --check --strict
          echo "OPENCODE_BIN=${binary_dir}/opencode" >> "${GITHUB_ENV}"

      - name: Install checksum-pinned cplt
        shell: bash
        run: |
          set -euo pipefail
          release="2026.08.17-062831-1008a92"
          archive="${RUNNER_TEMP}/cplt-x86_64-unknown-linux-gnu.tar.gz"
          binary_dir="${RUNNER_TEMP}/cplt-bin"
          curl --config /dev/null --fail-with-body --silent --show-error --location \
            --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --max-filesize 10000000 \
            "https://github.com/navikt/cplt/releases/download/${release}/cplt-x86_64-unknown-linux-gnu.tar.gz" \
            --output "${archive}"
          echo "3e6607db8ed2f361bb4e8a43246d38acc7e63e5d956de96c3319fffbd3be3eb4  ${archive}" \
            | sha256sum --check --strict
          mapfile -t cplt_entries < <(tar -tzf "${archive}")
          [[ "${#cplt_entries[@]}" == "1" && "${cplt_entries[0]}" == "cplt" ]]
          mkdir -p "${binary_dir}"
          tar -xzf "${archive}" -C "${binary_dir}" \
            --no-same-owner --no-same-permissions -- cplt
          chmod 0555 "${binary_dir}/cplt"
          [[ -f "${binary_dir}/cplt" && ! -L "${binary_dir}/cplt" ]]
          echo "115fff00248f0c170388e11f2a05cc9914f5ba589f2ca87817ed96de2c6eedb5  ${binary_dir}/cplt" \
            | sha256sum --check --strict
          [[ "$("${binary_dir}/cplt" --version)" == "cplt ${release}" ]]
          echo "CPLT_BIN=${binary_dir}/cplt" >> "${GITHUB_ENV}"

      - name: Smoke-test exact immutable OpenCode target locally
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          echo "5dce99ea079d925736e332b20f5bf869fe9a1fa67dc0a09027156b0ed8e41b16  ${OPENCODE_BIN}" | sha256sum --check --strict
          echo "115fff00248f0c170388e11f2a05cc9914f5ba589f2ca87817ed96de2c6eedb5  ${CPLT_BIN}" | sha256sum --check --strict
          python3 "${SOURCE_ROOT}/scripts/smoke_opencode.py" \
            --require-binary --opencode "${OPENCODE_BIN}"

      - name: Smoke-test exact immutable OpenCode runtime contracts locally
        shell: bash
        env:
          PATH: ${{ runner.temp }}/opencode-bin:${{ runner.temp }}/cplt-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          echo "5dce99ea079d925736e332b20f5bf869fe9a1fa67dc0a09027156b0ed8e41b16  ${OPENCODE_BIN}" | sha256sum --check --strict
          echo "115fff00248f0c170388e11f2a05cc9914f5ba589f2ca87817ed96de2c6eedb5  ${CPLT_BIN}" | sha256sum --check --strict
          python3 "${SOURCE_ROOT}/scripts/smoke_opencode_runtime.py" \
            --require-binary --opencode "${OPENCODE_BIN}" --cplt "${CPLT_BIN}"

  copilot-compatibility:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CATALOG_SHA: ${{ needs.validate.outputs.catalog-sha }}
      SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
    steps:
      - name: Check out exact immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore exact catalog commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CATALOG_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/heads/marketplace:refs/remotes/origin/marketplace"
          git merge-base --is-ancestor "${CATALOG_SHA}" refs/remotes/origin/marketplace
          catalog="${RUNNER_TEMP}/marketplace.json"
          git show "${CATALOG_SHA}:.github/plugin/marketplace.json" > "${catalog}"
          echo "CATALOG_PATH=${catalog}" >> "${GITHUB_ENV}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test exact immutable catalog locally
        run: >-
          python3 scripts/smoke_plugin_install.py
          --catalog "${CATALOG_PATH}"
          --source-root "${GITHUB_WORKSPACE}"
          --source-sha "${SOURCE_SHA}"
          --expect-release-sha "${SOURCE_SHA}"

  macos-live-compatibility:
    needs: validate
    uses: ./.github/workflows/macos-opencode-compatibility.yml
    with:
      source_sha: ${{ needs.validate.outputs.source-sha }}
    permissions:
      contents: read
