name: Verify Grillmester Homebrew formula on macOS

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact Grillmester source commit to verify
        required: true
        type: string
      sealed_formula_base64:
        description: Optional independently verified release formula
        required: false
        type: string
        default: ""
      release_bundle_name:
        description: Bundle name bound to the optional verified formula
        required: false
        type: string
        default: ""
      release_bundle_sha256:
        description: Bundle SHA-256 bound to the optional verified formula
        required: false
        type: string
        default: ""
      release_formula_sha256:
        description: SHA-256 of the optional independently verified formula
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  macos-homebrew-compatibility:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_BUNDLE_NAME: ${{ inputs.release_bundle_name }}
      RELEASE_BUNDLE_SHA256: ${{ inputs.release_bundle_sha256 }}
      RELEASE_FORMULA_SHA256: ${{ inputs.release_formula_sha256 }}
      SEALED_FORMULA_BASE64: ${{ inputs.sealed_formula_base64 }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out exact immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install and test the generated Homebrew formula
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]

          machine="$(uname -m)"
          case "${machine}" in
            arm64|x86_64) ;;
            *)
              echo "Unsupported macOS runner architecture: ${machine}" >&2
              exit 1
              ;;
          esac

          bundle="${RUNNER_TEMP}/macos-homebrew-bundle.tar.gz"
          repeated="${RUNNER_TEMP}/macos-homebrew-bundle-repeated.tar.gz"
          python3 -I -S scripts/generate_copilot_manifest.py --check
          python3 -I -S scripts/generate_context_projections.py --check
          python3 -I -S scripts/build_opencode_bundle.py \
            --source-root "${GITHUB_WORKSPACE}" --source-sha "${SOURCE_SHA}" \
            --output "${bundle}"
          python3 -I -S scripts/build_opencode_bundle.py \
            --source-root "${GITHUB_WORKSPACE}" --source-sha "${SOURCE_SHA}" \
            --output "${repeated}"
          cmp -s "${bundle}" "${repeated}"

          version="$(jq -er '.version' plugin/plugin.json)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tag="v${version}"
          bundle_name="grillmester-terminal-${tag}.tar.gz"
          qa_root="${RUNNER_TEMP}/homebrew-formula-qa"
          mkdir -m 700 "${qa_root}"
          qa_bundle="${qa_root}/${bundle_name}"
          formula="${qa_root}/grillmester.rb"
          expected_formula="${qa_root}/expected-grillmester.rb"
          install_formula="${qa_root}/install-grillmester.rb"
          sealed_formula="${qa_root}/sealed-grillmester.rb"
          tap_name="grillmester/formula-qa"
          formula_name="${tap_name}/grillmester"
          cp "${bundle}" "${qa_bundle}"
          bundle_sha256="$(shasum -a 256 "${qa_bundle}" | cut -d' ' -f1)"
          sealed_values=(
            "${SEALED_FORMULA_BASE64}"
            "${RELEASE_BUNDLE_NAME}"
            "${RELEASE_BUNDLE_SHA256}"
            "${RELEASE_FORMULA_SHA256}"
          )
          populated=0
          for value in "${sealed_values[@]}"; do
            [[ -z "${value}" ]] || populated=$((populated + 1))
          done
          if (( populated > 0 )); then
            (( populated == ${#sealed_values[@]} )) || {
              echo "verified release formula inputs must be all present or all absent" >&2
              exit 1
            }
            [[ "${RELEASE_BUNDLE_NAME}" =~ ^grillmester-terminal-v[0-9A-Za-z.-]+\.tar\.gz$ ]]
            [[ "${RELEASE_BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${RELEASE_FORMULA_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${bundle_name}" == "${RELEASE_BUNDLE_NAME}" ]]
            [[ "${bundle_sha256}" == "${RELEASE_BUNDLE_SHA256}" ]]
            python3 -I -S - "${sealed_formula}" "${RELEASE_FORMULA_SHA256}" <<'PY'
          import base64
          import binascii
          import hashlib
          import os
          import sys

          destination, expected_digest = sys.argv[1:]
          encoded = os.environ["SEALED_FORMULA_BASE64"]
          if not encoded or len(encoded) > 140_000:
              raise SystemExit("verified release formula encoding has an invalid size")
          try:
              content = base64.b64decode(encoded, validate=True)
          except binascii.Error as error:
              raise SystemExit("verified release formula encoding is invalid") from error
          if not content or len(content) > 100_000:
              raise SystemExit("verified release formula has an invalid size")
          if hashlib.sha256(content).hexdigest() != expected_digest:
              raise SystemExit("verified release formula digest differs")
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
          descriptor = os.open(destination, flags, 0o444)
          try:
              with os.fdopen(descriptor, "wb", closefd=False) as output:
                  output.write(content)
                  output.flush()
                  os.fsync(descriptor)
              os.fchmod(descriptor, 0o444)
          finally:
              os.close(descriptor)
          PY
            cp "${sealed_formula}" "${formula}"
          fi
          python3 -I -S scripts/generate_homebrew_formula.py \
            --tag "${tag}" --bundle-name "${bundle_name}" \
            --bundle-sha256 "${bundle_sha256}" \
            --output "${expected_formula}"
          if (( populated == 0 )); then
            cp "${expected_formula}" "${formula}"
          fi
          cmp -s "${expected_formula}" "${formula}"
          ruby -c "${formula}"
          brew tap-new --no-git "${tap_name}"
          tap_root="$(brew --repository "${tap_name}")"
          tap_formula="${tap_root}/Formula/grillmester.rb"
          cp "${formula}" "${tap_formula}"

          local_url="file://${qa_bundle}"
          python3 -I -S - "${formula}" "${install_formula}" "${local_url}" <<'PY'
          import os
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          destination = Path(sys.argv[2])
          local_url = sys.argv[3]
          expected_prefix = '  url "https://github.com/navikt/grillmester/releases/download/'
          lines = source.splitlines()
          matches = [index for index, line in enumerate(lines) if line.startswith(expected_prefix)]
          if len(matches) != 1:
              raise SystemExit("generated formula has an unexpected primary URL roster")
          lines[matches[0]] = f'  url "{local_url}"'
          descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8", newline="\n") as output:
              output.write("\n".join(lines) + "\n")
          PY

          python_dependency_preinstalled=false
          if brew list --versions python@3.13 >/dev/null 2>&1; then
            python_dependency_preinstalled=true
          fi
          cplt_dependency_preinstalled=false
          if brew list --versions cplt >/dev/null 2>&1; then
            cplt_dependency_preinstalled=true
          fi
          opencode_preinstalled=false
          if brew list --versions opencode >/dev/null 2>&1; then
            opencode_preinstalled=true
          fi
          copilot_preinstalled=false
          if brew list --cask --versions copilot-cli >/dev/null 2>&1; then
            copilot_preinstalled=true
          fi
          cplt_formula_trust_preexisting=false
          if brew trust --json=v1 | jq -e \
            '.formulae | index("navikt/tap/cplt") != null' >/dev/null; then
            cplt_formula_trust_preexisting=true
          fi
          copilot_state=""
          navikt_tap_preexisting=false
          if brew tap | grep -Fx 'navikt/tap' >/dev/null; then
            navikt_tap_preexisting=true
          fi
          runner_link_backup="${qa_root}/runner-python-links"
          runner_python_links=(
            idle3.13 pip3.13 pydoc3.13 python3.13 python3.13-config
          )
          prepare_hosted_intel_python_links() {
            [[ "${machine}" == "x86_64" ]] || return 0
            [[ "${python_dependency_preinstalled}" == "false" ]] || return 0
            mkdir -m 700 "${runner_link_backup}"
            for name in "${runner_python_links[@]}"; do
              target="/usr/local/bin/${name}"
              backup="${runner_link_backup}/${name}"
              if [[ ! -e "${target}" && ! -L "${target}" ]]; then
                continue
              fi
              [[ -L "${target}" ]]
              [[ "$(readlink "${target}")" == \
                 "/Library/Frameworks/Python.framework/Versions/3.13/bin/${name}" ]]
              [[ ! -e "${backup}" && ! -L "${backup}" ]]
              mv "${target}" "${backup}"
            done
          }
          restore_hosted_intel_python_links() {
            [[ "${python_dependency_preinstalled}" == "false" ]] || return 0
            restore_status=0
            if brew list --versions python@3.13 >/dev/null 2>&1; then
              brew uninstall --formula python@3.13 >/dev/null || restore_status=1
            fi
            [[ "${machine}" == "x86_64" ]] || return "${restore_status}"
            for name in "${runner_python_links[@]}"; do
              target="/usr/local/bin/${name}"
              backup="${runner_link_backup}/${name}"
              [[ -L "${backup}" ]] || continue
              if [[ -e "${target}" || -L "${target}" ]]; then
                echo "Cannot restore hosted runner link over ${target}." >&2
                restore_status=1
                continue
              fi
              mv "${backup}" "${target}" || restore_status=1
            done
            return "${restore_status}"
          }
          cleanup() {
            cleanup_status="${1:-0}"
            if brew list --versions "${formula_name}" >/dev/null 2>&1; then
              brew uninstall --formula "${formula_name}" >/dev/null || cleanup_status=1
            fi
            if [[ "${opencode_preinstalled}" == "false" ]] && \
              brew list --versions opencode >/dev/null 2>&1; then
              brew uninstall --formula opencode >/dev/null || cleanup_status=1
            fi
            if [[ "${copilot_preinstalled}" == "false" ]] && \
              brew list --cask --versions copilot-cli >/dev/null 2>&1; then
              brew uninstall --cask copilot-cli >/dev/null || cleanup_status=1
            fi
            if [[ -n "${copilot_state}" && -d "${copilot_state}" ]]; then
              [[ "${copilot_state}" == "${HOME}/.grillmester-copilot-qa."* ]] || {
                echo "Refusing to remove unexpected Copilot QA path: ${copilot_state}" >&2
                cleanup_status=1
              }
              if [[ "${copilot_state}" == "${HOME}/.grillmester-copilot-qa."* ]]; then
                rm -rf -- "${copilot_state}" || cleanup_status=1
              fi
            fi
            if [[ "${cplt_dependency_preinstalled}" == "false" ]] && \
              brew list --versions cplt >/dev/null 2>&1; then
              brew uninstall --formula navikt/tap/cplt >/dev/null || cleanup_status=1
            fi
            if [[ "${cplt_formula_trust_preexisting}" == "false" ]] && \
              brew trust --json=v1 | jq -e \
                '.formulae | index("navikt/tap/cplt") != null' >/dev/null; then
              brew untrust --formula navikt/tap/cplt >/dev/null || cleanup_status=1
            fi
            if [[ "${cplt_formula_trust_preexisting}" == "true" ]] && ! \
              brew trust --json=v1 | jq -e \
                '.formulae | index("navikt/tap/cplt") != null' >/dev/null; then
              brew trust --formula navikt/tap/cplt >/dev/null || cleanup_status=1
            fi
            restore_hosted_intel_python_links || cleanup_status=1
            if brew tap | grep -Fx "${tap_name}" >/dev/null; then
              brew untap "${tap_name}" >/dev/null || cleanup_status=1
            fi
            if [[ "${navikt_tap_preexisting}" == "false" ]] && \
              brew tap | grep -Fx 'navikt/tap' >/dev/null; then
              brew untap navikt/tap >/dev/null || cleanup_status=1
            fi
            return "${cleanup_status}"
          }
          trap 'cleanup $?' EXIT
          if [[ "${navikt_tap_preexisting}" == "false" ]]; then
            brew tap navikt/tap
          fi
          # Fully qualifying the dependency grants item-level trust without
          # accepting every current and future item in navikt/tap.
          brew install --formula navikt/tap/cplt
          brew style "${formula_name}"
          brew audit --strict "${formula_name}"
          prepare_hosted_intel_python_links
          cp "${install_formula}" "${tap_formula}"
          brew install --formula "${formula_name}"
          prefix="$(brew --prefix "${formula_name}")"
          linked_launcher="$(brew --prefix)/bin/grillmester"
          [[ -x "${prefix}/bin/grillmester" ]]
          [[ ! -e "${prefix}/libexec/clients" && ! -L "${prefix}/libexec/clients" ]]
          grep -F 'anomalyco/opencode' "${prefix}/libexec/THIRD_PARTY_NOTICES.md" >/dev/null
          grep -F 'navikt/cplt' "${prefix}/libexec/THIRD_PARTY_NOTICES.md" >/dev/null
          brew test --verbose "${formula_name}"

          tui_consumer="${qa_root}/tui-consumer"
          mkdir -m 700 "${tui_consumer}"
          git -C "${tui_consumer}" init --quiet
          missing_stdout="${qa_root}/missing-opencode.stdout"
          missing_stderr="${qa_root}/missing-opencode.stderr"
          if PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            "${prefix}/bin/grillmester" --client opencode \
              --agent grillmester --project-dir "${tui_consumer}" \
              --print-command >"${missing_stdout}" 2>"${missing_stderr}"; then
            echo "Grillmester unexpectedly found OpenCode outside the caller PATH." >&2
            exit 1
          fi
          [[ ! -s "${missing_stdout}" ]]
          grep -Fx \
            'grillmester: OpenCode was not found on PATH; install it with: brew install opencode' \
            "${missing_stderr}"

          # The hosted image can carry stale Homebrew API metadata while this
          # job disables implicit updates for deterministic formula testing.
          brew update
          brew install opencode
          cplt_candidate="$(brew --prefix navikt/tap/cplt)/bin/cplt"
          opencode_candidate="$(brew --prefix opencode)/bin/opencode"
          resolve_executable() {
            python3 -I -S - "$1" "$2" <<'PY'
          import os
          import sys
          from pathlib import Path

          label, raw = sys.argv[1:]
          path = Path(raw).resolve(strict=True)
          if not path.is_file() or not os.access(path, os.X_OK):
              raise SystemExit(f"{label} is not an executable regular file: {path}")
          print(path)
          PY
          }
          cplt_binary="$(resolve_executable cplt "${cplt_candidate}")"
          opencode_binary="$(resolve_executable OpenCode "${opencode_candidate}")"
          opencode_version="$("${opencode_binary}" --version)"
          [[ "${opencode_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          opencode_path_dir="${qa_root}/opencode-path"
          mkdir -m 700 "${opencode_path_dir}"
          ln -s "${opencode_binary}" "${opencode_path_dir}/opencode"
          client_path="${opencode_path_dir}:/usr/bin:/bin:/usr/sbin:/sbin"
          doctor_output="$(PATH="${client_path}" \
            "${prefix}/bin/grillmester" doctor --client opencode)"
          grep -F "ok  cplt ${cplt_binary} (cplt " <<<"${doctor_output}"
          grep -F "ok  opencode ${opencode_binary} (${opencode_version})" \
            <<<"${doctor_output}"
          python3 -I -S scripts/smoke_grillmester_tui.py \
            --launcher "${prefix}/bin/grillmester" \
            --opencode "${opencode_binary}" \
            --opencode-version "${opencode_version}" \
            --cplt "${cplt_binary}" \
            --project-dir "${tui_consumer}" \
            --state-parent "${qa_root}"

          brew install --cask copilot-cli
          copilot_candidate="$(command -v copilot)"
          copilot_binary="$(resolve_executable 'GitHub Copilot CLI' "${copilot_candidate}")"
          copilot_version="$("${copilot_binary}" --version | sed -n '1p')"
          [[ "${copilot_version}" =~ ^GitHub\ Copilot\ CLI\ [0-9]+\.[0-9]+\.[0-9]+\.$ ]]
          copilot_state="$(mktemp -d "${HOME}/.grillmester-copilot-qa.XXXXXX")"
          mkdir -m 700 "${copilot_state}/home" "${copilot_state}/config"
          copilot_path_dir="${qa_root}/copilot-path"
          mkdir -m 700 "${copilot_path_dir}"
          ln -s "${copilot_binary}" "${copilot_path_dir}/copilot"
          copilot_client_path="${copilot_path_dir}:/usr/bin:/bin:/usr/sbin:/sbin"
          if PATH="${copilot_client_path}" command -v opencode >/dev/null 2>&1; then
            echo "OpenCode unexpectedly remained on the Copilot-only PATH." >&2
            exit 1
          fi
          copilot_doctor_output="$(
            HOME="${copilot_state}/home" \
            XDG_CONFIG_HOME="${copilot_state}/config" \
            PATH="${copilot_client_path}" \
              "${prefix}/bin/grillmester" doctor --client copilot
          )"
          grep -F "ok  cplt ${cplt_binary} (cplt " <<<"${copilot_doctor_output}"
          grep -F "ok  copilot ${copilot_binary} (${copilot_version})" \
            <<<"${copilot_doctor_output}"
          copilot_help_stdout="${qa_root}/copilot-help.stdout"
          copilot_help_stderr="${qa_root}/copilot-help.stderr"
          HOME="${copilot_state}/home" \
          XDG_CONFIG_HOME="${copilot_state}/config" \
          PATH="${copilot_client_path}" \
            "${prefix}/bin/grillmester" --client copilot \
              --agent grillmester --project-dir "${tui_consumer}" \
              --yes --quiet -- --help \
              >"${copilot_help_stdout}" 2>"${copilot_help_stderr}"
          grep -F 'Usage: copilot ' "${copilot_help_stdout}"
          grep -F 'Launching Grillmester (grillmester) in copilot through cplt...' \
            "${copilot_help_stderr}"

          [[ -z "$(git -C "${tui_consumer}" status --porcelain)" ]]
          cleanup 0
          trap - EXIT
          if brew list --versions "${formula_name}" >/dev/null 2>&1; then
            echo "grillmester remains installed after uninstall" >&2
            exit 1
          fi
          [[ ! -e "${linked_launcher}" && ! -L "${linked_launcher}" ]]
          [[ ! -e "${prefix}" && ! -L "${prefix}" ]]
          if [[ "${opencode_preinstalled}" == "false" ]] && \
            brew list --versions opencode >/dev/null 2>&1; then
            echo "OpenCode remains installed after cleanup." >&2
            exit 1
          fi
          if [[ "${copilot_preinstalled}" == "false" ]] && \
            brew list --cask --versions copilot-cli >/dev/null 2>&1; then
            echo "GitHub Copilot CLI remains installed after cleanup." >&2
            exit 1
          fi
          if [[ -n "${copilot_state}" && -e "${copilot_state}" ]]; then
            echo "Copilot QA state remains after cleanup." >&2
            exit 1
          fi
          if [[ "${cplt_dependency_preinstalled}" == "false" ]] && \
            brew list --versions cplt >/dev/null 2>&1; then
            echo "cplt remains installed after cleanup." >&2
            exit 1
          fi
          if [[ "${python_dependency_preinstalled}" == "false" ]] && \
            brew list --versions python@3.13 >/dev/null 2>&1; then
            echo "python@3.13 remains installed after cleanup." >&2
            exit 1
          fi
          if [[ "${navikt_tap_preexisting}" == "false" ]] && \
            brew tap | grep -Fx 'navikt/tap' >/dev/null; then
            echo "navikt/tap remains configured after cleanup." >&2
            exit 1
          fi
          if [[ "${cplt_formula_trust_preexisting}" == "false" ]] && \
            brew trust --json=v1 | jq -e \
              '.formulae | index("navikt/tap/cplt") != null' >/dev/null; then
            echo "navikt/tap/cplt remains trusted after cleanup." >&2
            exit 1
          fi
          if [[ "${cplt_formula_trust_preexisting}" == "true" ]] && ! \
            brew trust --json=v1 | jq -e \
              '.formulae | index("navikt/tap/cplt") != null' >/dev/null; then
            echo "Pre-existing trust for navikt/tap/cplt was not preserved." >&2
            exit 1
          fi
