name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check generated marketplace catalog
        run: python3 scripts/generate_marketplace.py --mode development --check

      - name: Check generated Copilot full payload manifest
        run: python3 scripts/generate_copilot_manifest.py --check

      - name: Check generated nav-pilot agentpakke manifest
        run: python3 scripts/generate_agentpakke_manifest.py --check

      - name: Validate agentpakke with released nav-pilot contract
        shell: bash
        env:
          NAV_PILOT_URL: https://github.com/navikt/copilot/releases/download/nav-pilot/2026.08.24-134023-dc66d1e/nav-pilot-linux-amd64
          NAV_PILOT_SHA256: 99987f338db9d5de31d2018fa5d237983352b92dd6c91a7158dc0f4a3ef97e27
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/nav-pilot"
          curl --config /dev/null --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "${binary}" "${NAV_PILOT_URL}"
          actual_sha256="$(sha256sum "${binary}" | cut -d' ' -f1)"
          [[ "${actual_sha256}" == "${NAV_PILOT_SHA256}" ]]
          [[ "$(stat -c '%s' "${binary}")" == "18215074" ]]
          chmod 0555 "${binary}"
          "${binary}" validate --source "${GITHUB_WORKSPACE}" --json

      - name: Validate plugin package
        run: python3 scripts/validate.py

      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate Visual Companion scripts
        run: |
          node --check plugin/skills/grillmester-design-prototype/scripts/server.js
          node --check plugin/skills/grillmester-design-prototype/scripts/helper.js
          node --test plugin/skills/grillmester-design-prototype/tests/server.test.js

      - name: Install exact OpenCode release-test baseline
        shell: bash
        run: |
          set -euo pipefail
          binary_dir="${RUNNER_TEMP}/opencode-bin"
          python3 -I -S scripts/release_test_baseline.py install \
            --client opencode --platform linux --architecture x86_64 \
            --output "${binary_dir}/opencode"
          echo "OPENCODE_BIN=${binary_dir}/opencode" >> "${GITHUB_ENV}"

      - name: Install exact cplt release-test baseline
        shell: bash
        run: |
          set -euo pipefail
          binary_dir="${RUNNER_TEMP}/cplt-bin"
          python3 -I -S scripts/release_test_baseline.py install \
            --client cplt --platform linux --architecture x86_64 \
            --output "${binary_dir}/cplt"
          echo "CPLT_BIN=${binary_dir}/cplt" >> "${GITHUB_ENV}"

      - name: Smoke-test OpenCode target discovery
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          python3 scripts/smoke_opencode.py --require-binary --opencode "${OPENCODE_BIN}"

      - name: Smoke-test OpenCode runtime contracts
        shell: bash
        env:
          PATH: ${{ runner.temp }}/opencode-bin:${{ runner.temp }}/cplt-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          python3 scripts/smoke_opencode_runtime.py \
            --require-binary --opencode "${OPENCODE_BIN}" --cplt "${CPLT_BIN}"

  copilot-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test marketplace installation
        run: python3 scripts/smoke_plugin_install.py

  macos-live-compatibility:
    uses: ./.github/workflows/macos-opencode-compatibility.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: read

  macos-homebrew-compatibility:
    uses: ./.github/workflows/macos-homebrew-compatibility.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: read
