name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check generated marketplace catalog
        run: python3 scripts/generate_marketplace.py --mode development --check

      - name: Check generated Copilot full payload manifest
        run: python3 scripts/generate_copilot_manifest.py --check

      - name: Check generated nav-pilot agentpakke manifest
        run: python3 scripts/generate_agentpakke_manifest.py --check

      - name: Validate agentpakke with released nav-pilot contract
        shell: bash
        env:
          NAV_PILOT_CONTRACT_BASELINE_VERSION: 2026.08.28-091813-dc3e4ff
          NAV_PILOT_CONTRACT_BASELINE_URL: https://github.com/navikt/copilot/releases/download/nav-pilot/2026.08.28-091813-dc3e4ff/nav-pilot-linux-amd64
          NAV_PILOT_CONTRACT_BASELINE_SHA256: 4be22c75be1424eb2691c00eae0a287facbd0afa95fd9249cb9c00e3071dcb72
          NAV_PILOT_CONTRACT_BASELINE_SIZE: "18395298"
          NAV_PILOT_TELEMETRY_ENABLED: "0"
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/nav-pilot"
          isolated_home="${RUNNER_TEMP}/nav-pilot-home"
          mkdir -m 0700 "${isolated_home}" "${isolated_home}/.nav-pilot"
          printf 'auto_update = false\n' > "${isolated_home}/config.toml"
          printf '{"last_checked":"%s","latest_version":"%s"}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${NAV_PILOT_CONTRACT_BASELINE_VERSION}" \
            > "${isolated_home}/.nav-pilot/cache.json"
          chmod 0600 \
            "${isolated_home}/config.toml" \
            "${isolated_home}/.nav-pilot/cache.json"
          export HOME="${isolated_home}"
          export NAV_PILOT_CONFIG="${isolated_home}/config.toml"
          curl --config /dev/null --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "${binary}" "${NAV_PILOT_CONTRACT_BASELINE_URL}"
          actual_sha256="$(sha256sum "${binary}" | cut -d' ' -f1)"
          [[ "${actual_sha256}" == "${NAV_PILOT_CONTRACT_BASELINE_SHA256}" ]]
          [[ "$(stat -c '%s' "${binary}")" == "${NAV_PILOT_CONTRACT_BASELINE_SIZE}" ]]
          chmod 0555 "${binary}"
          validation_json="$("${binary}" validate --source "${GITHUB_WORKSPACE}" --json)"
          post_validation_sha256="$(sha256sum "${binary}" | cut -d' ' -f1)"
          [[ "${post_validation_sha256}" == "${NAV_PILOT_CONTRACT_BASELINE_SHA256}" ]]
          printf '%s\n' "${validation_json}" | python3 -I -S -c '
          import json
          import sys

          result = json.load(sys.stdin)
          expected_notes = [
              "manifest: .nav-pilot/agentpakke.json",
              "agentpakke: grillmester (contract version 1)",
              "clients: copilot (tier 2), opencode (tier 2)",
              "minNavPilotVersion: 2026.08.28-091813-dc3e4ff",
          ]
          if result.get("command") != "validate":
              raise SystemExit("nav-pilot returned an unexpected command")
          if result.get("kind") != "agentpakke":
              raise SystemExit("nav-pilot returned an unexpected validation kind")
          if result.get("valid") is not True:
              raise SystemExit("nav-pilot did not validate the agentpakke")
          if result.get("problems") != []:
              raise SystemExit("nav-pilot reported agentpakke problems")
          if result.get("notes") != expected_notes:
              raise SystemExit("nav-pilot returned unexpected contract notes")
          '
          printf '%s\n' "${validation_json}"

      - name: Validate plugin package
        run: python3 scripts/validate.py

      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate Visual Companion scripts
        run: |
          node --check plugin/skills/grillmester-design-prototype/scripts/server.js
          node --check plugin/skills/grillmester-design-prototype/scripts/helper.js
          node --test plugin/skills/grillmester-design-prototype/tests/server.test.js

      - name: Install exact OpenCode release-test baseline
        shell: bash
        run: |
          set -euo pipefail
          binary_dir="${RUNNER_TEMP}/opencode-bin"
          python3 -I -S scripts/release_test_baseline.py install \
            --client opencode --platform linux --architecture x86_64 \
            --output "${binary_dir}/opencode"
          echo "OPENCODE_BIN=${binary_dir}/opencode" >> "${GITHUB_ENV}"

      - name: Install exact cplt release-test baseline
        shell: bash
        run: |
          set -euo pipefail
          binary_dir="${RUNNER_TEMP}/cplt-bin"
          python3 -I -S scripts/release_test_baseline.py install \
            --client cplt --platform linux --architecture x86_64 \
            --output "${binary_dir}/cplt"
          echo "CPLT_BIN=${binary_dir}/cplt" >> "${GITHUB_ENV}"

      - name: Smoke-test OpenCode target discovery
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          python3 scripts/smoke_opencode.py --require-binary --opencode "${OPENCODE_BIN}"

      - name: Smoke-test OpenCode runtime contracts
        shell: bash
        env:
          PATH: ${{ runner.temp }}/opencode-bin:${{ runner.temp }}/cplt-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          [[ "${OPENCODE_BIN}" == "${RUNNER_TEMP}/opencode-bin/opencode" ]]
          [[ "${CPLT_BIN}" == "${RUNNER_TEMP}/cplt-bin/cplt" ]]
          [[ -f "${OPENCODE_BIN}" && -x "${OPENCODE_BIN}" && ! -L "${OPENCODE_BIN}" ]]
          [[ -f "${CPLT_BIN}" && -x "${CPLT_BIN}" && ! -L "${CPLT_BIN}" ]]
          [[ "$(stat -c '%a:%u' "${OPENCODE_BIN}")" == "555:$(id -u)" ]]
          [[ "$(stat -c '%a:%u' "${CPLT_BIN}")" == "555:$(id -u)" ]]
          python3 scripts/smoke_opencode_runtime.py \
            --require-binary --opencode "${OPENCODE_BIN}" --cplt "${CPLT_BIN}"

  copilot-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.79

      - name: Smoke-test marketplace installation
        run: python3 scripts/smoke_plugin_install.py

  macos-live-compatibility:
    uses: ./.github/workflows/macos-opencode-compatibility.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: read

  macos-homebrew-compatibility:
    uses: ./.github/workflows/macos-homebrew-compatibility.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: read
